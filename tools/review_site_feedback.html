<!doctype html>
<meta charset="utf-8" />
<title>Site Feedback</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --paper: #14181f;
    --paper-raised: #1b212a;
    --ink: #e8eaee;
    --ink-soft: #aab1bd;
    --ink-faint: #6b7280;
    --rule: #2c333e;
    --rule-soft: #232a34;
    --accent: #5fb3a3;
    --accent-soft: #1c2e2b;
    --accent-ink: #a8ddd0;
    --done: #6ec48b;
    --warn: #dcab5c;
    --warn-bg: #2e2515;
    --bad: #e37c83;
    --bad-bg: #331d1f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid var(--rule); background: var(--paper-raised); flex-wrap: wrap;
  }
  h1 { font-size: 16px; margin: 0 18px 0 0; white-space: nowrap; }
  .btn {
    appearance: none; font: inherit; font-weight: 600; font-size: 13px;
    background: var(--paper-raised); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #0b1310; }
  .btn.active { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .btn-danger { border-color: var(--bad); color: var(--bad); }
  .btn-danger:hover { background: var(--bad-bg); }
  .viewToggle { display: flex; gap: 6px; }
  #connStatus { font-size: 12.5px; color: var(--ink-faint); margin-left: auto; }
  #connStatus.ok { color: var(--done); }
  #connStatus.bad { color: var(--bad); }
  main { max-width: 800px; margin: 0 auto; padding: 20px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .hint { font-size: 12.5px; color: var(--ink-faint); }
  .card {
    background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .cardHead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    padding: 2px 8px; border-radius: 99px; border: 1px solid var(--rule); color: var(--ink-soft);
  }
  .pill.bug { color: var(--bad); border-color: var(--bad); }
  .pill.feature { color: var(--accent-ink); border-color: var(--accent); }
  .pill.account_recovery { color: var(--warn); border-color: var(--warn); }
  .meta { font-size: 12px; color: var(--ink-faint); margin-left: auto; white-space: nowrap; }
  .message { font-size: 13.5px; white-space: pre-wrap; margin-bottom: 10px; }
  .contact { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  .actions { display: flex; gap: 8px; }
  .resolvedBadge { color: var(--done); font-size: 12.5px; font-weight: 600; }
</style>

<header>
  <h1>💬 Site Feedback</h1>
  <div class="viewToggle">
    <button class="btn active" id="showActiveBtn" type="button">Open</button>
    <button class="btn" id="showResolvedBtn" type="button">Resolved</button>
  </div>
  <span id="connStatus">Connecting…</span>
</header>

<main>
  <div class="toolbar">
    <button class="btn" id="refreshBtn" type="button">Refresh</button>
    <span class="hint" id="listStatus"></span>
  </div>
  <div id="listWrap"></div>
</main>

<script>
(function () {
  let active = [];
  let resolved = [];
  let view = "active";
  const $ = (id) => document.getElementById(id);

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtDate(iso) {
    if (!iso) return "";
    try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
  }

  async function loadFeedback() {
    $("listStatus").textContent = "Loading…";
    try {
      const res = await fetch("/api/site_feedback");
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "server error");
      active = data.feedback;
      resolved = data.resolved || [];
      $("connStatus").textContent = "Connected to local reports server ✓";
      $("connStatus").className = "ok";
      render();
    } catch (e) {
      $("listStatus").textContent = "Couldn't load feedback: " + e.message;
      $("connStatus").textContent = "Not connected — run scripts/reports_server.py";
      $("connStatus").className = "bad";
    }
  }

  function render() {
    const rows = view === "active" ? active : resolved;
    $("showActiveBtn").classList.toggle("active", view === "active");
    $("showResolvedBtn").classList.toggle("active", view === "resolved");
    $("listStatus").textContent = `${rows.length} ${view === "active" ? "open" : "resolved"} item${rows.length === 1 ? "" : "s"}`;

    const wrap = $("listWrap");
    if (!rows.length) {
      wrap.innerHTML = `<p class="hint">${view === "active" ? "Nothing waiting — nice." : "Nothing resolved yet."}</p>`;
      return;
    }
    wrap.innerHTML = rows.slice().reverse().map((f) => {
      const contact = [f.username ? `KYJ-Cloud: ${f.username}` : "", f.contact || ""].filter(Boolean).join(" · ");
      const actions = view === "active"
        ? `<div class="actions">
             <button class="btn btn-danger" data-resolve="${escapeHtml(f.submitted_at)}" type="button">Mark resolved</button>
             <button class="btn" data-dismiss="${escapeHtml(f.submitted_at)}" type="button">Dismiss (spam)</button>
           </div>`
        : `<span class="resolvedBadge">✓ resolved ${escapeHtml(fmtDate(f.resolved_at))}</span>`;
      const typeLabels = { account_recovery: "account recovery" };
      const type = f.type || "other";
      return `<div class="card">
        <div class="cardHead">
          <span class="pill ${escapeHtml(type)}">${escapeHtml(typeLabels[type] || type)}</span>
          ${f.page ? `<span class="pill">${escapeHtml(f.page)}</span>` : ""}
          <span class="meta">${escapeHtml(fmtDate(f.submitted_at))}</span>
        </div>
        <div class="message">${escapeHtml(f.message || "")}</div>
        ${contact ? `<div class="contact">Contact: ${escapeHtml(contact)}</div>` : ""}
        ${actions}
      </div>`;
    }).join("");

    if (view === "active") {
      wrap.querySelectorAll("[data-resolve]").forEach(btn => {
        btn.addEventListener("click", () => act("/api/resolve_site_feedback", btn.dataset.resolve));
      });
      wrap.querySelectorAll("[data-dismiss]").forEach(btn => {
        btn.addEventListener("click", () => {
          if (confirm("Dismiss without keeping a record? This can't be undone.")) act("/api/dismiss_site_feedback", btn.dataset.dismiss);
        });
      });
    }
  }

  async function act(route, submitted_at) {
    const item = active.find(f => f.submitted_at === submitted_at);
    if (!item) return;
    try {
      const res = await fetch(route, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item, resolved_at: new Date().toISOString() }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "server error");
      await loadFeedback();
    } catch (e) {
      $("listStatus").textContent = "Failed: " + e.message;
    }
  }

  $("showActiveBtn").addEventListener("click", () => { view = "active"; render(); });
  $("showResolvedBtn").addEventListener("click", () => { view = "resolved"; render(); });
  $("refreshBtn").addEventListener("click", loadFeedback);

  loadFeedback();
})();
</script>
