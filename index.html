<style>
  :root {
    --paper: #f6f7f9;
    --paper-raised: #ffffff;
    --ink: #1c2430;
    --ink-soft: #4b5563;
    --ink-faint: #8a93a1;
    --rule: #dde1e7;
    --rule-soft: #e9ebef;
    --accent: #1f5f56;
    --accent-soft: #e4efec;
    --accent-ink: #12403a;
    --easy: #2f7a4f;
    --easy-bg: #e5f3ea;
    --medium: #a06a1e;
    --medium-bg: #f6ecd9;
    --hard: #a1333b;
    --hard-bg: #f6e2e3;
    --correct: #2f7a4f;
    --correct-bg: #e5f3ea;
    --incorrect: #a1333b;
    --incorrect-bg: #f6e2e3;
    --review: #8a7000;
    --review-bg: #faf2ce;
    --done: #2f7a4f;
    --done-bg: #e5f3ea;
    --tier-bronze: #a9713c;
    --tier-bronze-bg: #f3e6d6;
    --tier-silver: #6b7684;
    --tier-silver-bg: #e7eaee;
    --tier-gold: #b8860b;
    --tier-gold-bg: #f7edcb;
    --xp: #4a6fa5;
    --xp-bg: #e3eaf3;
    --shadow: 0 1px 2px rgba(28, 36, 48, 0.06), 0 4px 14px rgba(28, 36, 48, 0.05);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181f;
      --paper-raised: #1b212a;
      --ink: #e8eaee;
      --ink-soft: #aab1bd;
      --ink-faint: #6b7280;
      --rule: #2c333e;
      --rule-soft: #232a34;
      --accent: #5fb3a3;
      --accent-soft: #1c2e2b;
      --accent-ink: #a8ddd0;
      --easy: #6ec48b;
      --easy-bg: #1b2b21;
      --medium: #dcab5c;
      --medium-bg: #2e2515;
      --hard: #e37c83;
      --hard-bg: #331d1f;
      --correct: #6ec48b;
      --correct-bg: #1b2b21;
      --incorrect: #e37c83;
      --incorrect-bg: #331d1f;
      --review: #e0c93a;
      --review-bg: #332c12;
      --done: #6ec48b;
      --done-bg: #1b2b21;
      --tier-bronze: #cf9a63;
      --tier-bronze-bg: #2e2416;
      --tier-silver: #a9b2bd;
      --tier-silver-bg: #262b32;
      --tier-gold: #e0bf4a;
      --tier-gold-bg: #332c12;
      --xp: #8bacd9;
      --xp-bg: #1c2735;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(0, 0, 0, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --paper: #14181f;
    --paper-raised: #1b212a;
    --ink: #e8eaee;
    --ink-soft: #aab1bd;
    --ink-faint: #6b7280;
    --rule: #2c333e;
    --rule-soft: #232a34;
    --accent: #5fb3a3;
    --accent-soft: #1c2e2b;
    --accent-ink: #a8ddd0;
    --easy: #6ec48b;
    --easy-bg: #1b2b21;
    --medium: #dcab5c;
    --medium-bg: #2e2515;
    --hard: #e37c83;
    --hard-bg: #331d1f;
    --correct: #6ec48b;
    --correct-bg: #1b2b21;
    --incorrect: #e37c83;
    --incorrect-bg: #331d1f;
    --review: #e0c93a;
    --review-bg: #332c12;
    --done: #6ec48b;
    --done-bg: #1b2b21;

    --tier-bronze-bg: #2e2416;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(0, 0, 0, 0.3);

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }

  a { color: var(--accent); }

  .app { display: flex; flex-direction: column; min-height: 100%; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-raised);
    flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    background: none;
    border: none;
    padding: 4px 6px;
    margin: -4px -6px;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s ease, transform 0.12s ease;
  }
  .brand:hover { background: var(--accent-soft); }
  .brand:active { transform: scale(0.97); }
  .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .brand-logo { display: block; height: 46px; width: auto; }
  .brand-logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo-light { display: none; }
    :root:not([data-theme="light"]) .brand-logo-dark { display: block; }
  }
  :root[data-theme="dark"] .brand-logo-light { display: none; }

  .stat-row { display: flex; gap: 18px; margin-left: auto; }

  /* ---------- Browse layout ---------- */

  select {

  .qmeta { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; width: 130px; }
  .pill {

  .status-btn-row { display: flex; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }

    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;

    background: var(--paper-raised);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .status-btn:hover { border-color: var(--ink-faint); }
  .status-btn.on-review { border-color: var(--review); color: var(--review); background: var(--review-bg); }
  .status-btn.on-done { border-color: var(--done); color: var(--done); background: var(--done-bg); }
  .status-btn.on-incomplete { border-color: var(--ink-faint); color: var(--ink); background: var(--rule-soft); }
  .status-kbd {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;

  }
  .qid { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); cursor: pointer; }
  .qid:hover { color: var(--accent-ink); }

  .id-chip {

  .tags-section { margin-top: 14px; }
  .tags-label {
    font-size: 10.5px;

    letter-spacing: 0.06em;
    color: var(--ink-faint);

    color: var(--accent-ink);
    background: var(--accent-soft);

  }

    color: var(--ink-faint);
    font-weight: 700;

  .note-item .note-text { flex: 1; white-space: pre-wrap; }
  .note-remove {
    appearance: none;
    border: none;
    background: none;
    color: inherit;

    font-size: 14px;
    line-height: 1;

  /* ---------- Question modal (Browse) ---------- */
  .modal-root {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 4vh 16px;
  }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(10, 13, 18, 0.55);
  }
  .modal-card {
    position: relative;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    width: min(720px, 100%);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .modal-head-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; }
  .modal-close {
    appearance: none;
    border: none;
    background: none;
    color: var(--ink-faint);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .modal-close:hover { background: var(--rule-soft); color: var(--ink); }
  .modal-body {
    padding: 18px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-body .qdetail-bare .status-btn-row { margin-bottom: 4px; }
  .modal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 18px;
    border-top: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .modal-position { font-size: 12.5px; color: var(--ink-faint); font-family: var(--mono); }
  @media (max-width: 600px) {
    .modal-root { padding: 0; align-items: stretch; }
    .modal-card { width: 100%; max-height: 100vh; border-radius: 0; }
  }
  body.modal-open { overflow: hidden; }
  #loadMoreBtn { align-self: flex-start; }
  .qimage { display: block; max-width: 100%; height: auto; }
  .qimage-missing {
    padding: 14px 16px;

  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .choice {

    gap: 10px;
    align-items: flex-start;

  .choice.choice-selected { border-color: var(--accent); background: var(--accent-soft); }
  .choice.choice-selected .letter { color: var(--accent-ink); }
  .choice.chosen-correct { border-color: var(--correct); background: var(--correct-bg); }

  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }

  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-faint); }

    <div class="test-shell">

        <h2>Notes</h2>
        <p style="margin:-6px 0 16px; color:var(--ink-faint); font-size:13px;">
          Everything you've jotted down on individual questions, compiled in one place. Add notes from any question's detail view — you can add as many as you like per question.
        </p>
        <div class="search" style="max-width:360px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

</div>

<div id="questionModalRoot" class="modal-root" style="display:none;"></div>

<script src="data.js"></script>
<script id="questions-data" type="application/json">[]</script>
<script>
(function () {
  // Loaded from an external data.js (GitHub Pages build) when present;
  // falls back to the inline JSON tag (self-contained single-file build).
  const QUESTIONS = (typeof SAT_QUESTIONS !== 'undefined')
    ? SAT_QUESTIONS
    : JSON.parse(document.getElementById('questions-data').textContent);

  // Short, human-friendly identifiers ("Transitions #23") assigned in source
  // order per category. The long College Board hash id (q.id) remains the
  // storage key for progress/attempt state so existing exported progress
  // files keep working; shortId is purely a display label.
  const CATEGORY_LABELS = {
    'Command of Evidence': 'Evidence',
    'Cross-Text': 'Cross Text',
  };
  function categoryLabel(cat) { return CATEGORY_LABELS[cat] || cat; }
  (function assignShortIds() {
    const counters = {};
    QUESTIONS.forEach(q => {
      counters[q.category] = (counters[q.category] || 0) + 1;
      q.shortId = `${categoryLabel(q.category)} #${counters[q.category]}`;
    });
  })();

  // ---------- Progress persistence ----------
  // Per-question status: 'review' (flagged) | 'done' (complete) | absent (incomplete).
  // Saved to localStorage as a best effort — browsers/hosts vary in whether that
  // persists reliably, so Export/Import (Progress tab) is the durable backup path.
  const STORAGE_KEY = 'sat_qbank_progress_v1';

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    } catch (e) {
      // storage unavailable/full — progress still lives in memory for this session
    }
  }

  function setStatus(qid, status) {
    if (status) state.progress[qid] = status;
    else delete state.progress[qid];
    if (status === 'done') logCompletion(qid);
    saveProgress();
    renderStats();
  }

  // Same as setStatus but for many questions at once — one localStorage
  // write instead of one per question, so bulk-acting on a large selection
  // (e.g. "select all" over a few hundred filtered results) doesn't hammer
  // storage.
  function bulkSetStatus(qids, status) {
    qids.forEach(qid => {
      if (status) state.progress[qid] = status;
      else delete state.progress[qid];
      if (status === 'done') logCompletion(qid);
    });
    saveProgress();
    renderStats();
  }

  // ---------- Progress focus (personal domain) ----------
  // Which difficulties count toward the Progress tab's stats/percentage —
  // e.g. "Hard only" or "Medium + Hard" to track completion within just the
  // range you're currently drilling, instead of the whole bank. Persisted so
  // it survives reloads. This is also the intended hook for the planned
  // adaptive-practice feature: it can read the same focus set to scope its
  // question pool to whatever range you've picked here.
  const PROGRESS_FOCUS_KEY = 'sat_qbank_progress_focus_v1';
  const PROGRESS_FOCUS_DIFFICULTIES = ['Easy', 'Medium', 'Hard'];

  function loadProgressFocus() {
    try {
      const raw = JSON.parse(localStorage.getItem(PROGRESS_FOCUS_KEY));
      if (Array.isArray(raw) && raw.length && raw.every(d => PROGRESS_FOCUS_DIFFICULTIES.includes(d))) {
        return new Set(raw);
      }
    } catch (e) {
      // fall through to default
    }
    return new Set(PROGRESS_FOCUS_DIFFICULTIES);
  }

  function saveProgressFocus() {
    try {
      localStorage.setItem(PROGRESS_FOCUS_KEY, JSON.stringify([...state.progressFocus]));
    } catch (e) {
      // storage unavailable/full — focus still lives in memory for this session
    }
  }

  function toggleProgressFocus(diff) {
    const next = new Set(state.progressFocus);
    if (next.has(diff)) {
      if (next.size === 1) return; // always keep at least one difficulty selected
      next.delete(diff);
    } else {
      next.add(diff);
    }
    state.progressFocus = next;
    saveProgressFocus();
    renderProgress();
  }

  // ---------- Completion log (for streaks / XP / achievements) ----------
  // Records the first moment each question is marked 'done', keyed by
  // question id. Deliberately separate from state.progress: unmarking a
  // question back to review/incomplete shouldn't un-earn the XP, streak day,
  // or achievement progress that completing it once already banked.
  const COMPLETION_LOG_KEY = 'sat_qbank_completion_log_v1';

  function loadCompletionLog() {
    try {
      const raw = JSON.parse(localStorage.getItem(COMPLETION_LOG_KEY));
      return (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
    } catch (e) {
      return {};
    }
  }

  function saveCompletionLog() {
    try {
      localStorage.setItem(COMPLETION_LOG_KEY, JSON.stringify(state.completionLog));
    } catch (e) {
      // storage unavailable/full — log still lives in memory for this session
    }
  }

  // Called from setStatus/bulkSetStatus whenever a question's status becomes
  // 'done'. A no-op after the first time so re-completing something already
  // logged doesn't shift its earned day.
  function logCompletion(qid) {
    if (state.completionLog[qid]) return;
    state.completionLog[qid] = new Date().toISOString();
    saveCompletionLog();
  }

  // ---------- Daily goal ----------
  // How many questions you're aiming to complete today — purely a personal
  // target used to drive the Progress tab's goal ring and goal-related
  // achievements. Editable any time; changing it re-evaluates past days
  // against the new number (there's no per-day history of what the goal used
  // to be, which is fine for a personal practice tool).
  const DAILY_GOAL_KEY = 'sat_qbank_daily_goal_v1';
  const DEFAULT_DAILY_GOAL = 10;
  const DAILY_GOAL_PRESETS = [5, 10, 15, 20, 25, 30];

  function loadDailyGoal() {
    const raw = parseInt(localStorage.getItem(DAILY_GOAL_KEY), 10);
    return (Number.isFinite(raw) && raw > 0) ? raw : DEFAULT_DAILY_GOAL;
  }

  function saveDailyGoal(val) {
    try {
      localStorage.setItem(DAILY_GOAL_KEY, String(val));
    } catch (e) {
      // storage unavailable/full — goal still lives in memory for this session
    }
  }

  // ---------- Profile ----------
  // Just a display name right now — deliberately minimal (no avatar upload,
  // no account system) since this is a single-browser local tool.
  const PROFILE_KEY = 'sat_qbank_profile_v1';
  const DEFAULT_PROFILE_NAME = 'Student';

  function loadProfile() {
    try {
      const raw = JSON.parse(localStorage.getItem(PROFILE_KEY));
      if (raw && typeof raw === 'object' && typeof raw.name === 'string' && raw.name.trim()) {
        return { name: raw.name.slice(0, 24) };
      }
    } catch (e) {
      // fall through to default
    }
    return { name: DEFAULT_PROFILE_NAME };
  }

  function saveProfile() {
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(state.profile));
    } catch (e) {
      // storage unavailable/full — profile still lives in memory for this session
    }
  }

  // ---------- Tags ----------
  // Free-form per-question labels ("weak spot", "redo", whatever) you add
  // yourself from a question's detail view. Same storage pattern as
  // progress: localStorage as a best-effort, Export/Import (Progress tab)
  // as the durable backup since both live in the same exported file.
  const TAGS_KEY = 'sat_qbank_tags_v1';

  function loadTags() {
    try {
      const raw = localStorage.getItem(TAGS_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function saveTags() {
    try {
      localStorage.setItem(TAGS_KEY, JSON.stringify(state.tags));
    } catch (e) {
      // storage unavailable/full — tags still live in memory for this session
    }
  }

  function getTags(qid) {
    return state.tags[qid] || [];
  }

  function addTag(qid, rawTag) {
    const tag = rawTag.trim();
    if (!tag) return;
    const existing = getTags(qid);
    if (existing.some(t => t.toLowerCase() === tag.toLowerCase())) return;
    state.tags[qid] = [...existing, tag];
    saveTags();
  }

  function removeTag(qid, tag) {
    const next = getTags(qid).filter(t => t !== tag);
    if (next.length) state.tags[qid] = next;
    else delete state.tags[qid];
    saveTags();
  }

  function allTags() {
    const set = new Set();
    Object.values(state.tags).forEach(arr => arr.forEach(t => set.add(t)));
    return [...set].sort((a, b) => a.localeCompare(b));
  }

  // ---------- Notes ----------
  // The user-facing replacement for Tags above: free-form text entries you
  // jot down on a question from its detail view. Unlike tags, notes aren't
  // deduplicated (they're commentary, not labels) and a question can carry
  // any number of them. Same storage pattern as progress/tags: localStorage
  // as a best-effort, Export/Import (Progress tab) as the durable backup.
  const NOTES_KEY = 'sat_qbank_notes_v1';

  function loadNotes() {
    try {
      const raw = localStorage.getItem(NOTES_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function saveNotes() {
    try {
      localStorage.setItem(NOTES_KEY, JSON.stringify(state.notes));
    } catch (e) {
      // storage unavailable/full — notes still live in memory for this session
    }
  }

  function getNotes(qid) {
    return state.notes[qid] || [];
  }

  function addNote(qid, rawText) {
    const text = rawText.trim();
    if (!text) return;
    state.notes[qid] = [...getNotes(qid), { text, ts: Date.now() }];
    saveNotes();
  }

  function removeNote(qid, ts) {
    const next = getNotes(qid).filter(n => n.ts !== ts);
    if (next.length) state.notes[qid] = next;
    else delete state.notes[qid];
    saveNotes();
  }

  // Every note across every question, newest first — feeds the compiled
  // Notes tab ("see all your notes in one place").
  function allNotesFlat() {
    const out = [];
    Object.keys(state.notes).forEach(qid => {
      getNotes(qid).forEach(n => out.push({ qid, text: n.text, ts: n.ts }));
    });
    return out.sort((a, b) => b.ts - a.ts);
  }

  // ---------- Estimated composite score (Mock Exam results) ----------
  // The real digital SAT is scored via IRT on an adaptive item pool we don't
  // have — this is a hand-tuned approximation, not an official College Board
  // conversion. Two curves because the actual test's design means your score
  // ceiling depends on *which* Module 2 pool you were routed into: acing an
  // easier Module 2 (routed there after a rough Module 1) still tops out well
  // below 800, the same way it does on the real adaptive test. Anchor points
  // are piecewise-linearly interpolated and rounded to the nearest 10, matching
  // real SAT score granularity.
  const RW_CURVE_HARDER = [[0, 200], [10, 320], [20, 430], [27, 490], [35, 570], [40, 630], [45, 690], [49, 740], [52, 780], [54, 800]];
  const RW_CURVE_EASIER = [[0, 200], [10, 290], [20, 380], [27, 440], [35, 510], [40, 560], [45, 600], [49, 630], [54, 650]];

  function interpCurve(curve, raw) {
    if (raw <= curve[0][0]) return curve[0][1];
    if (raw >= curve[curve.length - 1][0]) return curve[curve.length - 1][1];
    for (let i = 0; i < curve.length - 1; i++) {
      const [x0, y0] = curve[i], [x1, y1] = curve[i + 1];
      if (raw >= x0 && raw <= x1) {
        const t = (raw - x0) / (x1 - x0);
        return Math.round((y0 + t * (y1 - y0)) / 10) * 10;
      }
    }
    return curve[curve.length - 1][1];
  }

  function estimateRWScore(rawCorrect, routedHarder) {
    return interpCurve(routedHarder ? RW_CURVE_HARDER : RW_CURVE_EASIER, rawCorrect);
  }

  function computeMockRWScore(data) {
    const d = data || mockState;
    const all = [...d.module1Questions, ...d.module2Questions];
    let correct = 0;
    all.forEach(q => { if (d.answers[q.id] === q.correct_answer) correct++; });
    return estimateRWScore(correct, d.routedHarder);
  }

  const MATH_SCORE_KEY = 'sat_qbank_math_score_v1';

  function loadMathScore() {
    const raw = parseInt(localStorage.getItem(MATH_SCORE_KEY), 10);
    return (Number.isFinite(raw) && raw >= 200 && raw <= 800) ? raw : 800;
  }

  function saveMathScore(val) {
    try { localStorage.setItem(MATH_SCORE_KEY, String(val)); } catch (e) { /* best-effort */ }
  }

  // Renders the total/1600 + two subscore bars, with an editable Math score
  // input (defaults to 800, persisted across sessions/exams). `rwScore` is
  // fixed at render time; the Math input updates the total live via direct
  // DOM writes (see wireScoreCard) rather than a full re-render.
  function scoreCardHtml(rwScore) {
    const mathScore = loadMathScore();
    const total = rwScore + mathScore;
    const rwPct = Math.round(((rwScore - 200) / 600) * 100);
    const mathPct = Math.round(((mathScore - 200) / 600) * 100);
    return `
      <div class="score-card">
        <div class="total-score" id="scTotal">${total}</div>
        <div class="total-label">Estimated total score (/1600)</div>
        <div class="score-bars">
          <div class="score-bar-row">
            <div class="score-bar-head"><span>Reading &amp; Writing</span><span class="val">${rwScore}</span></div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${rwPct}%"></div></div>
          </div>
          <div class="score-bar-row">
            <div class="score-bar-head"><span>Math</span><span class="val" id="scMathVal">${mathScore}</span></div>
            <div class="score-bar-track"><div class="score-bar-fill" id="scMathFill" style="width:${mathPct}%"></div></div>
            <div class="math-score-edit">
              <label for="scMathInput">Edit Math score</label>
              <input type="number" id="scMathInput" min="200" max="800" step="10" value="${mathScore}">
            </div>
          </div>
        </div>
        <div class="score-disclaimer">R&amp;W score is an approximate estimate from this mock exam, not an official College Board conversion. Math score is self-reported.</div>
      </div>`;
  }

  function wireScoreCard(rwScore) {
    const input = document.getElementById('scMathInput');
    if (!input) return;
    input.addEventListener('input', () => {
      let val = parseInt(input.value, 10);
      if (!Number.isFinite(val)) return;
      val = Math.max(200, Math.min(800, val));
      saveMathScore(val);
      const mathPct = Math.round(((val - 200) / 600) * 100);
      document.getElementById('scMathVal').textContent = val;
      document.getElementById('scMathFill').style.width = mathPct + '%';
      document.getElementById('scTotal').textContent = rwScore + val;
    });
  }

  const state = {
    query: '',
    categories: new Set(),
    skills: new Set(),
    difficulties: new Set(),
    statuses: new Set(), // 'review' | 'done' | 'incomplete'
    sort: 'default',
    expanded: null,
    browseSelection: new Set(), // qids checked in Browse for bulk actions; persists across search/filter/sort changes so a selection can be built up across several searches, cleared only via "Clear selection" or after a bulk action runs
    modalList: null, // ordered array of questions the modal is navigating (Browse's current filtered list)
    modalIndex: null, // index within modalList currently shown in the modal
    attempt: {}, // questionId -> { choice, submitted, showAnswer }
    progress: loadProgress(), // questionId -> 'review' | 'done'
    tags: loadTags(), // questionId -> ['tag1', 'tag2', ...] — kept for backward-compat data, no longer user-facing
    tagsFilter: new Set(), // unused now that the Tags facet is hidden; left in place harmlessly
    notes: loadNotes(), // questionId -> [{ text, ts }, ...]
    notesQuery: '', // free-text filter on the compiled Notes tab
    notesOpenQuestion: null, // qid opened inline on the Notes tab (via a note click)
    progressExpandedCategory: null, // which category's tile breakdown is open on the Progress tab
    progressOpenQuestion: null, // qid opened inline on the Progress tab (via a tile click)
    reviewOpenQuestion: null, // qid opened inline on the Review tab (via a tile click)
    progressFocus: loadProgressFocus(), // Set of difficulty labels counted toward Progress tab stats
    completionLog: loadCompletionLog(), // questionId -> ISO timestamp of first completion
    dailyGoal: loadDailyGoal(), // questions/day target, drives the Progress tab goal ring
    profile: loadProfile(), // { name }
  };

  const testState = {
    phase: 'config', // config | quiz | results
    count: 10,
    categories: new Set(),
    skills: new Set(),
    difficulties: new Set(),
    statuses: new Set(),
    questions: [],
    index: 0,
    answers: {},
    timed: false, // per-question timer, opt-in
    timerSeconds: 60,
    timerStrict: true, // strict: auto-advance on expiry. flexible: timer just stops
    timeLeft: 0,
    timerId: null,
    expired: false, // current question's timer has run out (flexible mode only lingers here)
  };

  const practiceState = {
    phase: 'config', // config | session
    categories: new Set(),
    skills: new Set(),
    difficulties: new Set(),
    statuses: new Set(),
    shuffle: false,
    questions: [],
    index: 0,
    timed: false,
    timerSeconds: 60,
    timerStrict: true,
    timeLeft: 0,
    timerId: null,
    expired: false,
  };

  const allCategories = [...new Set(QUESTIONS.map(q => q.category))].sort();
  const allSkills = [...new Set(QUESTIONS.map(q => q.skill))].sort();
  const allDifficulties = ['Easy', 'Medium', 'Hard'];

  // ---------- Stats ----------
  // Personalized progress snapshot rather than fixed catalog metadata — updates
  // live as you mark questions and take mock exams (see setStatus/saveMockAttempt).
  function bestMockRWScore() {
    if (!mockState.history.length) return null;
    return Math.max(...mockState.history.map(a => computeMockRWScore(resolveMockAttempt(a))));
  }

  function renderStats() {
    let completed = 0, review = 0;
    Object.values(state.progress).forEach(s => {
      if (s === 'done') completed++;
      else if (s === 'review') review++;
    });
    const best = bestMockRWScore();
    document.getElementById('statRow').innerHTML = `
      <div class="stat"><span class="n">${completed}</span><span class="l">Completed</span></div>
      <div class="stat"><span class="n">${review}</span><span class="l">To Review</span></div>
      <div class="stat"><span class="n">${best !== null ? best : '—'}</span><span class="l">Best Score</span></div>
    `;
  }

  // ---------- Filters ----------
  function questionStatus(q) {
    return state.progress[q.id] || 'incomplete';
  }

  const STATUS_LABELS = { review: 'To review', done: 'Complete', incomplete: 'Incomplete' };
  const ALL_STATUSES = ['review', 'done', 'incomplete'];

  function matchesQuery(q) {
    if (!state.query) return true;
    const needle = state.query.toLowerCase().trim();
    if (q.id.toLowerCase() === needle) return true; // exact ID match, regardless of what else is in the text
    const hay = (q.id + ' ' + q.stem + ' ' + Object.values(q.choices).join(' ') + ' ' + q.rationale_full
      + ' ' + getTags(q.id).join(' ') + ' ' + getNotes(q.id).map(n => n.text).join(' ')).toLowerCase();
    return hay.includes(needle);
  }

  function currentFiltered(base) {
    return base.filter(q => {
      if (state.categories.size && !state.categories.has(q.category)) return false;
      if (state.skills.size && !state.skills.has(q.skill)) return false;
      if (state.difficulties.size && !state.difficulties.has(q.difficulty_label)) return false;
      if (state.statuses.size && !state.statuses.has(questionStatus(q))) return false;
      if (state.tagsFilter.size) {
        const qTags = getTags(q.id);
        if (!qTags.some(t => state.tagsFilter.has(t))) return false;
      }
      return matchesQuery(q);
    });
  }

  // Filters QUESTIONS by an arbitrary {categories, skills, difficulties, statuses}
  // selection object — shared by the Test and Practice tabs' config screens.
  function filterPool(sel) {
    return QUESTIONS.filter(q =>
      (!sel.categories.size || sel.categories.has(q.category)) &&
      (!sel.skills.size || sel.skills.has(q.skill)) &&
      (!sel.difficulties.size || sel.difficulties.has(q.difficulty_label)) &&
      (!sel.statuses.size || sel.statuses.has(questionStatus(q)))
    );
  }

  function diffPillClass(label) {
    return { Easy: 'pill pill-easy', Medium: 'pill pill-medium', Hard: 'pill pill-hard' }[label] || 'pill';
  }

  function statusPillClass(status) {
    return { review: 'pill pill-review', done: 'pill pill-done' }[status] || 'pill';
  }

  // `shortcuts: true` shows the A/S/D keyboard hints — only passed by call
  // sites where those keys are actually wired (the question modal and the
  // Progress/Review/Notes inline panels), so the hint never lies about a
  // key that won't do anything (e.g. the Test/Mock results lists, which
  // render these same buttons for mouse-only marking).
  function statusButtonsHtml(q, opts) {
    const status = questionStatus(q);
    const kbd = (opts && opts.shortcuts) ? {
      review: '<kbd class="status-kbd">A</kbd>',
      done: '<kbd class="status-kbd">D</kbd>',
      incomplete: '<kbd class="status-kbd">S</kbd>',
    } : { review: '', done: '', incomplete: '' };
    return `
      <div class="status-btn-row">
        <button class="status-btn ${status === 'review' ? 'on-review' : ''}" data-status-qid="${q.id}" data-set-status="review">🚩 Mark for review${kbd.review}</button>
        <button class="status-btn ${status === 'done' ? 'on-done' : ''}" data-status-qid="${q.id}" data-set-status="done">✓ Mark complete${kbd.done}</button>
        <button class="status-btn ${status === 'incomplete' ? 'on-incomplete' : ''}" data-status-qid="${q.id}" data-set-status="incomplete">○ Mark incomplete${kbd.incomplete}</button>
      </div>`;
  }

  function applyStatusClick(qid, next) {
    setStatus(qid, next === 'incomplete' ? null : next);
    renderFilters();
  }

  // Wires every [data-status-qid] button inside `container` via a single
  // delegated listener. Safe to call on every render of the same container —
  // a dataset flag guards against attaching the same delegated listener
  // twice on a container that persists across re-renders (its innerHTML gets
  // replaced, but the container element itself does not).
  function wireStatusButtons(container, onChange) {
    if (!container) return;
    if (container.dataset && container.dataset.statusWired) return;
    if (container.dataset) container.dataset.statusWired = '1';
    container.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-status-qid]');
      if (!btn || !container.contains(btn)) return;
      applyStatusClick(btn.dataset.statusQid, btn.dataset.setStatus);
      onChange();
    });
  }

  // Renders one filter facet (category / skill / difficulty / status), computing
  // each option's count against every OTHER active facet (but not its own), so
  // checking a box never makes its neighbors read "0".
  function renderFacet(containerId, options, selectedSet, facetKey, valueFn, pillClassFn, labelFn) {
    const counts = options.map(opt => QUESTIONS.filter(q => {
      if (facetKey !== 'categories' && state.categories.size && !state.categories.has(q.category)) return false;
      if (facetKey !== 'skills' && state.skills.size && !state.skills.has(q.skill)) return false;
      if (facetKey !== 'difficulties' && state.difficulties.size && !state.difficulties.has(q.difficulty_label)) return false;
      if (facetKey !== 'statuses' && state.statuses.size && !state.statuses.has(questionStatus(q))) return false;
      if (!matchesQuery(q)) return false;
      return valueFn(q) === opt;
    }).length);

    const el = document.getElementById(containerId);
    el.innerHTML = options.map((opt, i) => {
      const checked = selectedSet.has(opt) ? 'checked' : '';
      const cls = pillClassFn ? pillClassFn(opt) : '';
      const label = escapeHtml(labelFn ? labelFn(opt) : opt);
      return `<label class="filter-opt">
        <input type="checkbox" data-val="${escapeHtml(opt)}" ${checked} />
        <span class="${cls}">${label}</span>
        <span class="count">${counts[i]}</span>
      </label>`;
    }).join('');
    el.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('change', () => {
        const v = inp.dataset.val;
        if (inp.checked) selectedSet.add(v); else selectedSet.delete(v);
        renderFilters();
        renderBrowse();
      });
    });
  }

  function renderFilters() {
    renderFacet('categoryFilters', allCategories, state.categories, 'categories', q => q.category);
    renderFacet('skillFilters', allSkills, state.skills, 'skills', q => q.skill);
    renderFacet('difficultyFilters', allDifficulties, state.difficulties, 'difficulties', q => q.difficulty_label, diffPillClass);
    renderFacet('statusFilters', ALL_STATUSES, state.statuses, 'statuses', questionStatus, statusPillClass, s => STATUS_LABELS[s]);
    renderTagFacet();
  }

  // Tags aren't a single-value-per-question facet like the others above (one
  // question can carry several), so they get their own renderer: a question
  // matches if it has *any* of the checked tags (OR, not AND).
  // NOTE: the #tagFilters container no longer exists in the DOM — the Tags
  // facet was replaced by the Notes tab — so this is effectively dead code,
  // kept intentionally rather than deleted in case Tags come back.
  function renderTagFacet() {
    const container = document.getElementById('tagFilters');
    if (!container) return;
    const tags = allTags();
    if (!tags.length) {
      container.innerHTML = `<div class="tags-empty-hint">No tags yet — add some from any question's detail view.</div>`;
      return;
    }
    const counts = tags.map(tag => QUESTIONS.filter(q => {
      if (state.categories.size && !state.categories.has(q.category)) return false;
      if (state.skills.size && !state.skills.has(q.skill)) return false;
      if (state.difficulties.size && !state.difficulties.has(q.difficulty_label)) return false;
      if (state.statuses.size && !state.statuses.has(questionStatus(q))) return false;
      if (!matchesQuery(q)) return false;
      return getTags(q.id).includes(tag);
    }).length);

    container.innerHTML = tags.map((tag, i) => {
      const checked = state.tagsFilter.has(tag) ? 'checked' : '';
      return `<label class="filter-opt">
        <input type="checkbox" data-val="${escapeHtml(tag)}" ${checked} />
        <span>${escapeHtml(tag)}</span>
        <span class="count">${counts[i]}</span>
      </label>`;
    }).join('');
    container.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('change', () => {
        const v = inp.dataset.val;
        if (inp.checked) state.tagsFilter.add(v); else state.tagsFilter.delete(v);
        renderFilters();
        renderBrowse();
      });
    });
  }

  // ---------- Browse list ----------
  const BROWSE_PAGE_SIZE = 60;
  let browseRenderedList = []; // the list currently on screen, for the delegated click handler + modal Prev/Next

  function computeBrowseList() {
    let list = currentFiltered(QUESTIONS);
    if (state.sort === 'diff-asc') list = [...list].sort((a, b) => a.difficulty - b.difficulty);
    if (state.sort === 'diff-desc') list = [...list].sort((a, b) => b.difficulty - a.difficulty);
    return list;
  }

  function renderBrowse() {
    state.browseShown = BROWSE_PAGE_SIZE; // any filter/search/sort change restarts pagination
    // Deliberately does NOT touch state.browseSelection — selection survives
    // search/filter/sort changes so you can search for one thing, check a
    // few, search for something else, check more, and bulk-act on the whole
    // accumulated set at once instead of being limited to one search's results.
    renderBrowseChrome(computeBrowseList());
  }

  // Re-renders the count/bulk-bar/list without resetting pagination — used
  // after a bulk status action, where jumping back to the top of a long
  // filtered list would be disorienting.
  function refreshBrowseList() {
    renderBrowseChrome(computeBrowseList());
  }

  function renderBrowseChrome(list) {
    document.getElementById('resultCount').textContent =
      `${list.length} question${list.length === 1 ? '' : 's'}`;
    renderBulkBar(list);
    renderQuestionListInto(document.getElementById('qlist'), list);
  }

  // Bulk-action bar. The "select all" checkbox only ever adds/removes the
  // *current* filtered list's ids (same scope the modal's Prev/Next already
  // navigates) — but the running total, and the mark complete/review/
  // incomplete actions, act on state.browseSelection as a whole, which can
  // include ids picked under an earlier, different search/filter. That's
  // what makes "search, select some, search again, select more, bulk-act on
  // all of it" work.
  function renderBulkBar(list) {
    const bar = document.getElementById('bulkBar');
    const total = state.browseSelection.size;
    if (!list.length && !total) { bar.style.display = 'none'; bar.innerHTML = ''; return; }

    const inView = list.filter(q => state.browseSelection.has(q.id)).length;
    const allInViewSelected = list.length > 0 && inView === list.length;
    const countLabel = total
      ? (total === inView ? `${total} selected` : `${total} selected (${inView} in current view)`)
      : `Select all ${list.length}`;

    bar.style.display = 'flex';
    bar.innerHTML = `
      <label class="select-all-opt">
        <input type="checkbox" id="selectAllBox" ${allInViewSelected ? 'checked' : ''} ${list.length ? '' : 'disabled'} />
        <span>${countLabel}</span>
      </label>
      ${total ? `
        <div class="bulk-actions">
          <button class="status-btn" data-bulk-status="done">✓ Mark complete</button>
          <button class="status-btn" data-bulk-status="review">🚩 Mark for review</button>
          <button class="status-btn" data-bulk-status="incomplete">○ Mark incomplete</button>
          <button class="clear-btn" id="bulkClearBtn">Clear selection</button>
        </div>
      ` : ''}
    `;

    const selectAllBox = document.getElementById('selectAllBox');
    if (selectAllBox) selectAllBox.addEventListener('change', (e) => {
      if (e.target.checked) list.forEach(q => state.browseSelection.add(q.id));
      else list.forEach(q => state.browseSelection.delete(q.id));
      refreshBrowseList();
    });
    bar.querySelectorAll('[data-bulk-status]').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = btn.dataset.bulkStatus;
        bulkSetStatus([...state.browseSelection], next === 'incomplete' ? null : next);
        state.browseSelection.clear();
        renderFilters();
        refreshBrowseList();
      });
    });
    const clearBtn = document.getElementById('bulkClearBtn');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      state.browseSelection.clear();
      refreshBrowseList();
    });
  }

  // Renders a (paginated) list of question cards into `container`. Clicking a
  // card opens it in the modal rather than expanding inline — Browse never
  // has to re-render its ~1700-question list just to show one question's
  // detail, and a single delegated click listener (wired once, in the init
  // block at the bottom of this script) replaces what used to be one
  // addEventListener call per card. Rendering itself is capped at
  // BROWSE_PAGE_SIZE cards with a "Show more" button appending the rest in
  // batches, since building/parsing HTML for ~1700 cards at once was the
  // biggest remaining cost — most filtered views are far smaller than that,
  // and the common "browse everything" case rarely needs to scroll past
  // the first batch anyway.
  function renderQuestionListInto(container, list) {
    browseRenderedList = list;
    if (!list.length) {
      container.innerHTML = `<div class="empty-state">No questions match these filters.</div>`;
      return;
    }

    const shown = Math.min(state.browseShown || BROWSE_PAGE_SIZE, list.length);
    const visible = list.slice(0, shown);
    const remaining = list.length - shown;
    container.innerHTML = visible.map(q => qCardHtml(q)).join('') + (remaining > 0
      ? `<button class="btn" id="loadMoreBtn">Show ${Math.min(BROWSE_PAGE_SIZE, remaining)} more (${remaining} left)</button>`
      : '');

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (loadMoreBtn) loadMoreBtn.addEventListener('click', () => {
      state.browseShown = shown + BROWSE_PAGE_SIZE;
      renderQuestionListInto(container, list);
    });
  }

  // Renders a question's chart/table image when it has one. Command of
  // Evidence is the only category with these; the image lives alongside
  // this page as a plain file (images/<category-slug>/<id>.png) on a real
  // static-host deploy. It's absent from the single-file build, so a
  // missing file degrades to a small note instead of a broken-image icon.
  function questionImageHtml(q) {
    if (!q.has_image || !q.image_paths || !q.image_paths.length) return '';
    const src = q.image_paths[0].path || q.image_paths[0];
    return `<div class="qimage-wrap">
      <img class="qimage" src="${escapeHtml(src)}" alt="Chart or table for question ${q.id}"
        onerror="this.closest('.qimage-wrap').innerHTML='<div class=&quot;qimage-missing&quot;>Chart/table image not available in this view.</div>'" />
    </div>`;
  }

  // Renders a stem/passage that may contain "\n\n"-separated paragraphs
  // (e.g. Cross-Text questions have a "Text 1" / "Text 2" pair).
  function renderStemHtml(stem) {
    return stem.split('\n\n').map(p => {
      if (/^Text \d+$/.test(p.trim())) {
        return `<div class="text-label">${escapeHtml(p.trim())}</div>`;
      }
      return `<p>${restoreUnderline(escapeHtml(p))}</p>`;
    }).join('');
  }

  function qCardHtml(q) {
    const status = questionStatus(q);
    const statusBadge = status !== 'incomplete'
      ? `<span class="${statusPillClass(status)}">${STATUS_LABELS[status]}</span>`
      : '';
    const checked = state.browseSelection.has(q.id) ? 'checked' : '';
    return `
      <div class="qcard ${status !== 'incomplete' ? 'status-' + status : ''}">
        <div class="qcard-head" data-id="${q.id}">
          <label class="qcard-select" title="Select for bulk actions">
            <input type="checkbox" data-select-id="${q.id}" ${checked} />
          </label>
          <div style="flex:1; min-width:0;">
            <div class="qstem">${escapeStemFlat(q.stem)}</div>
            <div class="qskill">${escapeHtml(q.skill)} &middot; ${escapeHtml(q.domain)}</div>
          </div>
          <div class="qmeta">
            <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
            ${statusBadge}
            <span class="cat-tag">${escapeHtml(q.category)}</span>
            <span class="qid" data-copy-id="${escapeHtml(q.shortId)}" title="Click to copy ${escapeHtml(q.shortId)}">${escapeHtml(q.shortId)}</span>
            <button class="id-chip" data-copy-id="${escapeHtml(q.id)}" title="Click to copy ID">${escapeHtml(q.id)}</button>
          </div>
        </div>
      </div>`;
  }

  // Current pending/graded attempt for a question: { choice, submitted, showAnswer }.
  function getAttempt(qid) {
    return state.attempt[qid] || { choice: null, submitted: false, showAnswer: false };
  }

  // Shared interactive question body (image, stem, choices, submit/show-answer
  // buttons, status buttons) used by Browse's expanded card, the Practice
  // session, and the inline panels opened from Progress/Review tiles.
  //
  // Interaction model: clicking a choice only *selects* it (no reveal).
  // "Submit" grades that selection (chosen choice turns green/red). "Show
  // answer" independently reveals the correct choice + full per-choice
  // rationale, whether or not anything has been submitted yet.
  function qDetailHtml(q, opts) {
    opts = opts || {};
    const att = getAttempt(q.id);
    const choiceHtml = ['A', 'B', 'C', 'D'].map(letter => {
      const isCorrect = letter === q.correct_answer;
      const isChosen = att.choice === letter;
      let cls = 'choice';
      if (att.submitted && isChosen) cls += isCorrect ? ' chosen-correct' : ' chosen-incorrect';
      else if (isChosen) cls += ' choice-selected';
      if (att.showAnswer && isCorrect && !(att.submitted && isChosen)) cls += ' reveal-correct';
      const showRationale = (att.submitted && isChosen) || att.showAnswer;
      const rationaleLine = showRationale
        ? `<div class="rationale-line">${escapeHtml(q.rationale_by_choice[letter] || '')}</div>`
        : '';
      return `<div class="${cls}" data-letter="${letter}" data-qid="${q.id}">
        <span class="letter">${letter}</span>
        <div style="flex:1;">
          <div>${escapeHtml(q.choices[letter])}</div>
          ${rationaleLine}
        </div>
      </div>`;
    }).join('');

    const wrapClass = opts.bare ? 'qdetail qdetail-bare' : 'qdetail';
    return `
      <div class="${wrapClass}">
        ${questionImageHtml(q)}
        <div class="stem">${renderStemHtml(q.stem)}</div>
        <div class="prompt-line">${escapeHtml(q.prompt)}</div>
        <div class="choices">${choiceHtml}</div>
        <div class="detail-actions">
          <button class="btn btn-accent" data-submit-qid="${q.id}" ${(!att.choice || att.submitted) ? 'disabled' : ''}>Submit</button>
          <button class="btn" data-toggle-answer-qid="${q.id}">${att.showAnswer ? 'Hide answer' : 'Show answer'}</button>
          <button class="btn" data-copy-question-qid="${q.id}" title="${q.has_image ? 'Copies question text only — chart/table image not included' : 'Copy question text'}">Copy question</button>
        </div>
        ${statusButtonsHtml(q, { shortcuts: opts.shortcuts })}
        ${notesSectionHtml(q)}
      </div>`;
  }

  // Free-form tag chips (add/remove) for one question — no longer rendered
  // anywhere (see notesSectionHtml below, its user-facing replacement) but
  // kept intact rather than deleted.
  function tagsSectionHtml(q) {
    const tags = getTags(q.id);
    const chips = tags.map(t => `
      <span class="tag-chip">
        ${escapeHtml(t)}
        <button class="tag-remove" data-tag-qid="${q.id}" data-remove-tag="${escapeHtml(t)}" aria-label="Remove tag ${escapeHtml(t)}">&times;</button>
      </span>`).join('');
    return `
      <div class="tags-section">
        <div class="tags-label">Tags</div>
        <div class="tag-list">
          ${chips}
          <input type="text" class="tag-input" data-tag-qid="${q.id}" placeholder="+ Add tag, Enter to save" />
        </div>
      </div>`;
  }

  // Free-form note entries (add/remove) for one question — shown wherever
  // qDetailHtml renders (modal, inline panels). Notes feed the compiled
  // Notes tab and are matched by the free-text search box too. Unlike the
  // old tag chips, a question can carry any number of notes and they aren't
  // deduplicated.
  function notesSectionHtml(q) {
    const notes = getNotes(q.id);
    const items = notes.map(n => `
      <div class="note-item">
        <span class="note-text">${escapeHtml(n.text)}</span>
        <button class="note-remove" data-note-qid="${q.id}" data-remove-note-ts="${n.ts}" aria-label="Delete note">&times;</button>
      </div>`).join('');
    return `
      <div class="notes-section">
        <div class="notes-label">Notes</div>
        <div class="note-list">
          ${items}
          ${notes.length ? '' : '<div class="notes-empty-hint">No notes yet — add one below.</div>'}
        </div>
        <input type="text" class="note-input" data-note-qid="${q.id}" placeholder="+ Add note, Enter to save" />
      </div>`;
  }

  // Wires a question's interactive detail body within `root` (choice select,
  // submit, show/hide answer, status buttons). `root` scopes every query so
  // the same question open in two different tabs at once (e.g. expanded in
  // Browse while also open in a Progress tile panel) never cross-wires.
  function wireDetail(q, onChange, root) {
    root = root || document;
    root.querySelectorAll(`.choice[data-qid="${q.id}"]`).forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const letter = el.dataset.letter;
        const att = getAttempt(q.id);
        state.attempt[q.id] = Object.assign({}, att, { choice: letter, submitted: false });
        onChange();
      });
    });
    const submitBtn = root.querySelector(`[data-submit-qid="${q.id}"]`);
    if (submitBtn) submitBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const att = getAttempt(q.id);
      if (!att.choice) return;
      state.attempt[q.id] = Object.assign({}, att, { submitted: true });
      onChange();
    });
    const toggleBtn = root.querySelector(`[data-toggle-answer-qid="${q.id}"]`);
    if (toggleBtn) toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const att = getAttempt(q.id);
      state.attempt[q.id] = Object.assign({}, att, { showAnswer: !att.showAnswer });
      onChange();
    });
    wireStatusButtons(root, onChange);

    const tagInput = root.querySelector(`.tag-input[data-tag-qid="${q.id}"]`);
    if (tagInput) tagInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      addTag(q.id, tagInput.value);
      renderFilters();
      onChange();
    });
    root.querySelectorAll(`.tag-remove[data-tag-qid="${q.id}"]`).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeTag(q.id, btn.dataset.removeTag);
        renderFilters();
        onChange();
      });
    });

    const noteInput = root.querySelector(`.note-input[data-note-qid="${q.id}"]`);
    if (noteInput) noteInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      addNote(q.id, noteInput.value);
      onChange();
    });
    root.querySelectorAll(`.note-remove[data-note-qid="${q.id}"]`).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeNote(q.id, Number(btn.dataset.removeNoteTs));
        onChange();
      });
    });
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Source text can contain <u>...</u> markers (from the source PDF's own
  // underline formatting — SAT Functions/Evidence/Cross-Text questions often
  // reference "the underlined sentence"). escapeHtml neutralizes them like
  // any other text first, then this restores just those two exact tags —
  // never arbitrary markup — so real underline formatting survives escaping
  // without reopening any injection risk.
  function restoreUnderline(escaped) {
    return escaped.replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>');
  }

  function escapeStemFlat(stem) {
    return restoreUnderline(escapeHtml(stem.replace(/\n\n/g, ' ')));
  }

  // "Category#N" shorthand (e.g. "Evidence#1", "Grammar#42") jumps straight
  // to that question's card, expanded and scrolled into view. Matches on a
  // prefix of either the short display label ("Evidence") or the full
  // category name ("Command of Evidence"), case-insensitively.
  function findByShortIdQuery(query) {
    const m = query.trim().match(/^([A-Za-z][A-Za-z\- ]*?)\s*#\s*(\d+)$/);
    if (!m) return null;
    const catQuery = m[1].trim().toLowerCase();
    const num = parseInt(m[2], 10);
    return QUESTIONS.find(q => {
      const label = categoryLabel(q.category).toLowerCase();
      const full = q.category.toLowerCase();
      const shortNum = parseInt(q.shortId.split('#')[1], 10);
      return shortNum === num && (label.startsWith(catQuery) || full.startsWith(catQuery));
    }) || null;
  }

  function jumpToQuestion(qid) {
    state.categories.clear();
    state.skills.clear();
    state.difficulties.clear();
    state.statuses.clear();
    state.query = '';
    document.getElementById('searchBox').value = '';
    renderFilters();
    renderBrowse();
    const idx = browseRenderedList.findIndex(q => q.id === qid);
    if (idx !== -1) {
      openQuestionModal(browseRenderedList, idx);
    } else {
      const q = QUESTIONS.find(x => x.id === qid);
      if (q) openQuestionModal([q], 0);
    }
  }

  // ---------- Question modal (Browse) ----------
  // `list` is the ordered set the modal navigates Prev/Next through — pass
  // whatever list the click came from (Browse's current filtered results),
  // so paging through the modal walks the same set the user was looking at.
  function openQuestionModal(list, index) {
    state.modalList = list;
    state.modalIndex = index;
    renderQuestionModal();
  }

  function closeQuestionModal() {
    state.modalList = null;
    state.modalIndex = null;
    renderQuestionModal();
  }

  function renderQuestionModal() {
    const root = document.getElementById('questionModalRoot');
    const list = state.modalList;
    const q = list && list[state.modalIndex];
    if (!q) {
      root.style.display = 'none';
      root.innerHTML = '';
      document.body.classList.remove('modal-open');
      return;
    }
    root.style.display = 'flex';
    document.body.classList.add('modal-open');
    const total = list.length;
    const status = questionStatus(q);
    const statusBadge = status !== 'incomplete'
      ? `<span class="${statusPillClass(status)}">${STATUS_LABELS[status]}</span>`
      : '';
    root.innerHTML = `
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-card">
        <div class="modal-head">
          <div class="modal-head-info">
            <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
            ${statusBadge}
            <span class="cat-tag">${escapeHtml(q.category)}</span>
            <span class="qid" data-copy-id="${escapeHtml(q.shortId)}" title="Click to copy ${escapeHtml(q.shortId)}">${escapeHtml(q.shortId)}</span>
            <button class="id-chip" data-copy-id="${escapeHtml(q.id)}" title="Click to copy ID">${escapeHtml(q.id)}</button>
          </div>
          <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">${qDetailHtml(q, { bare: true, shortcuts: true })}</div>
        <div class="modal-nav">
          <button class="btn" id="modalPrevBtn" ${state.modalIndex === 0 ? 'disabled' : ''}>&larr; Previous</button>
          <span class="modal-position">${state.modalIndex + 1} of ${total}</span>
          <button class="btn" id="modalNextBtn" ${state.modalIndex === total - 1 ? 'disabled' : ''}>Next &rarr;</button>
        </div>
      </div>`;

    root.querySelectorAll('[data-close-modal]').forEach(el => el.addEventListener('click', closeQuestionModal));
    const prevBtn = document.getElementById('modalPrevBtn');
    if (prevBtn) prevBtn.addEventListener('click', () => { state.modalIndex--; renderQuestionModal(); });
    const nextBtn = document.getElementById('modalNextBtn');
    if (nextBtn) nextBtn.addEventListener('click', () => { state.modalIndex++; renderQuestionModal(); });
    wireDetail(q, renderQuestionModal, root);
  }

  // Plain-text rendering of a question for pasting elsewhere (another chat,
  // a doc, etc.) — <u> markers can't survive as plain text, so they're
  // converted to **bold** instead of just dropped, since a prompt like "the
  // function of the underlined sentence" is unanswerable without some way
  // to tell which sentence that is. Charts/tables (Command of Evidence)
  // aren't included — there's no image support in a plain-text clipboard
  // paste — so those questions copy as text + choices only.
  function questionCopyText(q) {
    const stemText = q.stem.replace(/<u>/g, '**').replace(/<\/u>/g, '**');
    const choicesText = ['A', 'B', 'C', 'D'].map(l => `${l}. ${q.choices[l]}`).join('\n');
    return [stemText, q.prompt, choicesText].join('\n\n');
  }

  // Copies `text` to the clipboard and flashes "Copied!" on `el` briefly.
  // Falls back to the old execCommand trick when the async Clipboard API
  // isn't available (e.g. a plain http:// or file:// context).
  function copyToClipboard(text, el) {
    const flash = () => {
      if (!el) return;
      const original = el.textContent;
      el.textContent = 'Copied!';
      el.classList.add('id-chip-copied');
      setTimeout(() => {
        el.textContent = original;
        el.classList.remove('id-chip-copied');
      }, 900);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash).catch(() => fallbackCopy(text, flash));
    } else {
      fallbackCopy(text, flash);
    }
  }

  function fallbackCopy(text, onDone) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* best effort */ }
    document.body.removeChild(ta);
    onDone();
  }

  // Debounced: with ~1700 questions, re-filtering + re-rendering the facet
  // counts and the list on every single keystroke was a real chunk of the
  // "feels slow" complaint. Waiting a beat after typing stops removes that
  // without making search feel laggy.
  let searchDebounceTimer = null;
  document.getElementById('searchBox').addEventListener('input', (e) => {
    const value = e.target.value;
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
      state.query = value;
      renderFilters();
      renderBrowse();
    }, 180);
  });
  document.getElementById('searchBox').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const value = e.target.value.trim();
    // Paste/type a raw College Board ID (e.g. from the copy-ID chip) and hit
    // Enter to jump straight to it — same idea as the "Category#N" shortcut,
    // just keyed off the actual ID instead of the display label.
    const byId = QUESTIONS.find(q => q.id.toLowerCase() === value.toLowerCase());
    const match = byId || findByShortIdQuery(value);
    if (match) {
      e.preventDefault();
      jumpToQuestion(match.id);
    }
  });
  let notesSearchDebounceTimer = null;
  const notesSearchBox = document.getElementById('notesSearchBox');
  if (notesSearchBox) notesSearchBox.addEventListener('input', (e) => {
    const value = e.target.value;
    clearTimeout(notesSearchDebounceTimer);
    notesSearchDebounceTimer = setTimeout(() => {
      state.notesQuery = value;
      renderNotesView();
    }, 180);
  });
  document.getElementById('sortSelect').addEventListener('change', (e) => {
    state.sort = e.target.value;
    renderBrowse();
  });
  document.getElementById('clearFilters').addEventListener('click', () => {
    state.categories.clear();
    state.skills.clear();
    state.difficulties.clear();
    state.statuses.clear();
    state.tagsFilter.clear();
    state.query = '';
    document.getElementById('searchBox').value = '';
    renderFilters();
    renderBrowse();
  });

  // One delegated listener for the whole Browse list — opens the clicked
  // question in the modal, navigating Prev/Next through whatever list was
  // on screen at click time (browseRenderedList, kept in sync by
  // renderQuestionListInto). Replaces what used to be an addEventListener
  // call per rendered card.
  document.getElementById('qlist').addEventListener('click', (e) => {
    if (e.target.closest('[data-copy-id]')) return; // let the copy-ID click through, don't also open the modal
    if (e.target.closest('.qcard-select')) return; // let the bulk-select checkbox toggle, don't also open the modal
    const head = e.target.closest('.qcard-head');
    if (!head) return;
    const qid = head.dataset.id;
    const idx = browseRenderedList.findIndex(q => q.id === qid);
    if (idx !== -1) openQuestionModal(browseRenderedList, idx);
  });

  // Bulk-select checkboxes toggle on 'change' rather than the click listener
  // above (which bails out early for clicks inside .qcard-select) — keeps
  // the "don't open the modal" guard and the "record the selection" logic
  // in separate, single-purpose listeners.
  document.getElementById('qlist').addEventListener('change', (e) => {
    const box = e.target.closest('[data-select-id]');
    if (!box) return;
    const qid = box.dataset.selectId;
    if (box.checked) state.browseSelection.add(qid);
    else state.browseSelection.delete(qid);
    renderBulkBar(browseRenderedList);
  });

  // Single-question panels that can have exactly one question open at a
  // time outside the modal — Progress/Review/Notes tabs, each populated by
  // clicking a tile or list row — eligible for the A/S/D marking keys below.
  // Only the panel on the tab that's actually on screen counts (a stale
  // state.xOpenQuestion left over from a tab the user has since left
  // shouldn't eat keystrokes on whatever tab they're looking at now). The
  // Review tab's panel also auto-advances to the next flagged question on
  // marking — that queue is meant to shrink as you clear it, same as the
  // modal below.
  function activeInlinePanel() {
    const candidates = [
      { key: 'reviewOpenQuestion', viewId: 'view-review', render: renderReview, advanceQueue: true },
      { key: 'progressOpenQuestion', viewId: 'view-progress', render: renderProgress, advanceQueue: false },
      { key: 'notesOpenQuestion', viewId: 'view-notes', render: renderNotesView, advanceQueue: false },
    ];
    for (const c of candidates) {
      const qid = state[c.key];
      if (!qid) continue;
      const view = document.getElementById(c.viewId);
      if (!view || !view.classList.contains('active')) continue;
      if (!QUESTIONS.find(x => x.id === qid)) continue;
      return Object.assign({ qid }, c);
    }
    return null;
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.modalList) { closeQuestionModal(); return; }

    // Don't hijack Left/Right/A/S/D while the user is typing somewhere
    // (search box, tag input, the Math-score field) — those need normal
    // text entry.
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

    const inlinePanel = state.modalList ? null : activeInlinePanel();

    if (state.modalList) {
      const q = state.modalList[state.modalIndex];
      const canAdvance = state.modalIndex < state.modalList.length - 1;
      // A / S / D sit together on the left home row — reachable blind,
      // right next to each other — for the three question statuses, while
      // Left/Right (opposite hand) page through freely without marking
      // anything. Setting a status advances to the next question
      // automatically (unless already on the last one), Anki-style, so
      // working through a batch is just "glance, tap a key" on repeat.
      if (e.key === 'ArrowRight' && canAdvance) {
        state.modalIndex++; renderQuestionModal();
      } else if (e.key === 'ArrowLeft' && state.modalIndex > 0) {
        state.modalIndex--; renderQuestionModal();
      } else if (q && /^[asd]$/i.test(e.key)) {
        const status = { a: 'review', s: 'incomplete', d: 'done' }[e.key.toLowerCase()];
        applyStatusClick(q.id, status);
        if (canAdvance) state.modalIndex++;
        renderQuestionModal();
      }
    } else if (inlinePanel && /^[asd]$/i.test(e.key)) {
      const status = { a: 'review', s: 'incomplete', d: 'done' }[e.key.toLowerCase()];
      applyStatusClick(inlinePanel.qid, status);
      if (inlinePanel.advanceQueue) {
        const remaining = QUESTIONS.filter(x => questionStatus(x) === 'review' && x.id !== inlinePanel.qid);
        state[inlinePanel.key] = remaining.length ? remaining[0].id : null;
      }
      inlinePanel.render();
    } else if (mockState.phase === 'module1' || mockState.phase === 'module2') {
      // Mirrors the Previous/Next buttons — Right never auto-submits on the
      // last question (no mockSubmitBtn to click), so a stray press there
      // can't accidentally end the module.
      if (e.key === 'ArrowRight') {
        const btn = document.getElementById('mockNextBtn');
        if (btn) btn.click();
      } else if (e.key === 'ArrowLeft') {
        const btn = document.getElementById('mockPrevBtn');
        if (btn) btn.click();
      }
    }
  });

  // One global delegated listener covers every "click ID to copy" chip
  // anywhere in the app (Browse cards, the modal, quiz/practice/mock views)
  // without needing to wire it separately at each render site.
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-copy-id]');
    if (!chip) return;
    e.stopPropagation();
    copyToClipboard(chip.dataset.copyId, chip);
  });

  // Same pattern for "Copy question" buttons (qDetailHtml, Test, Mock).
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-copy-question-qid]');
    if (!btn) return;
    e.stopPropagation();
    const q = QUESTIONS.find(qq => qq.id === btn.dataset.copyQuestionQid);
    if (q) copyToClipboard(questionCopyText(q), btn);
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + tab.dataset.view).classList.add('active');
      if (tab.dataset.view === 'practice') renderPractice();
      if (tab.dataset.view === 'test') renderTest();
      if (tab.dataset.view === 'mock') renderMock();
      if (tab.dataset.view === 'progress') renderProgress();
      if (tab.dataset.view === 'review') renderReview();
      if (tab.dataset.view === 'notes') renderNotesView();
    });
  });

  const brandLogoBtn = document.getElementById('brandLogoBtn');
  if (brandLogoBtn) brandLogoBtn.addEventListener('click', () => {
    document.querySelector('.tab[data-view="browse"]').click();
  });

  // ---------- Theme toggle ----------
  const THEME_KEY = 'sat_qbank_theme_v1';
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  if (themeToggleBtn) themeToggleBtn.addEventListener('click', () => {
    const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const current = document.documentElement.dataset.theme || (systemDark ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* best-effort */ }
  });

  // ---------- Shared scope-filter chips (Test config + Practice config) ----------
  function categoryChipsHtml(sel) {
    return allCategories.map(c =>
      `<button class="chip ${sel.categories.has(c) ? 'on' : ''}" data-field="categories" data-val="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');
  }
  function skillChipsHtml(sel) {
    return allSkills.map(s =>
      `<button class="chip ${sel.skills.has(s) ? 'on' : ''}" data-field="skills" data-val="${escapeHtml(s)}">${escapeHtml(s)}</button>`
    ).join('');
  }
  function difficultyChipsHtml(sel) {
    return allDifficulties.map(d =>
      `<button class="chip ${sel.difficulties.has(d) ? 'on' : ''}" data-field="difficulties" data-val="${d}">${d}</button>`
    ).join('');
  }
  function statusChipsHtml(sel) {
    return ALL_STATUSES.map(s =>
      `<button class="chip ${sel.statuses.has(s) ? 'on' : ''}" data-field="statuses" data-val="${s}">${STATUS_LABELS[s]}</button>`
    ).join('');
  }
  // Delegated-free (rebound every render, but chips are recreated each render
  // too since they live inside an innerHTML-replaced config card) toggle wiring
  // for any chip row built from the helpers above.
  function wireScopeChips(root, sel, onChange) {
    root.querySelectorAll('[data-field]').forEach(btn => {
      btn.addEventListener('click', () => {
        const field = btn.dataset.field;
        const val = btn.dataset.val;
        const set = sel[field];
        if (set.has(val)) set.delete(val); else set.add(val);
        onChange();
      });
    });
  }

  // ---------- Per-question timer (shared by Test and Practice) ----------
  // Opt-in config block rendered inside a config-card. `sel` is testState or
  // practiceState; `prefix` ("test" | "practice") keeps element ids unique
  // between the two tabs so both can be mid-render in the DOM at once.
  function timedModeConfigHtml(sel, prefix) {
    return `
      <div class="config-row" style="margin-bottom:6px;">
        <label class="filter-opt" style="padding:0;">
          <input type="checkbox" id="${prefix}Timed" ${sel.timed ? 'checked' : ''} />
          <span>Timed mode — per-question timer</span>
        </label>
      </div>
      ${sel.timed ? `
      <div class="config-row">
        <label>Seconds per question</label>
        <input type="number" class="num-input" id="${prefix}TimerSeconds" min="5" max="600" value="${sel.timerSeconds}" />
      </div>
      <div class="config-row">
        <label>When time runs out</label>
        <div class="chip-row">
          <button class="chip ${sel.timerStrict ? 'on' : ''}" data-timer-strict="1">Strict — auto-advance</button>
          <button class="chip ${!sel.timerStrict ? 'on' : ''}" data-timer-strict="0">Flexible — timer just stops</button>
        </div>
      </div>` : ''}`;
  }

  // Wires the checkbox/seconds/strict-flex controls rendered by
  // timedModeConfigHtml. `onChange` re-renders the whole config screen (the
  // timed checkbox reveals/hides the seconds+strictness rows, so a full
  // re-render is needed, not just a state update).
  function wireTimedModeConfig(root, sel, prefix, onChange) {
    const box = document.getElementById(`${prefix}Timed`);
    if (box) box.addEventListener('change', () => { sel.timed = box.checked; onChange(); });
    const secondsInput = document.getElementById(`${prefix}TimerSeconds`);
    if (secondsInput) secondsInput.addEventListener('change', () => {
      sel.timerSeconds = Math.max(5, parseInt(secondsInput.value, 10) || 60);
    });
    root.querySelectorAll('[data-timer-strict]').forEach(btn => {
      btn.addEventListener('click', () => { sel.timerStrict = btn.dataset.timerStrict === '1'; onChange(); });
    });
  }

  function qtimerClear(sel) {
    if (sel.timerId) {
      clearInterval(sel.timerId);
      sel.timerId = null;
    }
  }

  // Starts (or restarts) the per-question countdown on `sel`, ticking the
  // element with id `elId` each second. No-ops if timed mode is off. Calls
  // `onExpire` once when time runs out — strict/flexible branching happens
  // in the caller, since "expire" means something different for Test
  // (auto-advance/submit) vs Practice (auto-advance/finish).
  function qtimerStart(sel, elId, onExpire) {
    qtimerClear(sel);
    sel.expired = false;
    if (!sel.timed) return;
    sel.timeLeft = sel.timerSeconds;
    sel.timerId = setInterval(() => {
      sel.timeLeft -= 1;
      const el = document.getElementById(elId);
      if (el) {
        el.textContent = formatMockTime(sel.timeLeft);
        el.classList.toggle('low-time', sel.timeLeft <= 10);
      }
      if (sel.timeLeft <= 0) {
        qtimerClear(sel);
        sel.expired = true;
        onExpire();
      }
    }, 1000);
  }

  function timerTopbarHtml(sel, elId) {
    if (!sel.timed) return '';
    return `
      <div class="mock-topbar">
        <span class="mock-module-badge">${sel.timerStrict ? 'Strict timer' : 'Flexible timer'}</span>
        <span class="mock-timer ${sel.expired ? 'low-time' : ''}" id="${elId}">${formatMockTime(sel.timeLeft)}</span>
        ${sel.expired && !sel.timerStrict ? `<span style="font-size:12px; color:var(--ink-faint);">Time's up — keep going at your own pace</span>` : ''}
      </div>`;
  }

  // ---------- Test (real, scored test — no per-question feedback until the end) ----------
  function testPool() { return filterPool(testState); }

  function renderTest() {
    const shell = document.getElementById('testShell');
    if (testState.phase === 'config') shell.innerHTML = testConfigHtml();
    else if (testState.phase === 'quiz') shell.innerHTML = testQuizHtml();
    else shell.innerHTML = testResultsHtml();
    wireTest();
  }

  function testConfigHtml() {
    const pool = testPool();
    return `
      <div class="config-card">
        <h2>Build a test</h2>
        <p class="lede">${pool.length} question${pool.length === 1 ? '' : 's'} available with the filters below. This simulates the real thing — choices aren't graded until you submit the whole test.</p>
        <div class="config-row">
          <label>Scope — status (leave empty for all)</label>
          <div class="chip-row">${statusChipsHtml(testState)}</div>
        </div>
        <div class="config-row">
          <label>Categories (leave empty for all)</label>
          <div class="chip-row">${categoryChipsHtml(testState)}</div>
        </div>
        <div class="config-row">
          <label>Skills (leave empty for all)</label>
          <div class="chip-row">${skillChipsHtml(testState)}</div>
        </div>
        <div class="config-row">
          <label>Difficulty (leave empty for all)</label>
          <div class="chip-row">${difficultyChipsHtml(testState)}</div>
        </div>
        <div class="config-row">
          <label>Number of questions</label>
          <input type="number" class="num-input" id="testCount" min="1" max="${Math.max(pool.length, 1)}" value="${Math.min(testState.count, Math.max(pool.length, 1))}" />
        </div>
        ${timedModeConfigHtml(testState, 'test')}
        <button class="btn btn-accent" id="startTestBtn" ${pool.length ? '' : 'disabled'}>Start test</button>
      </div>`;
  }

  function testQuizHtml() {
    const q = testState.questions[testState.index];
    const total = testState.questions.length;
    const answered = testState.answers[q.id];
    const pct = Math.round(((testState.index) / total) * 100);
    const choiceHtml = ['A', 'B', 'C', 'D'].map(letter => {
      let cls = 'choice';
      if (answered === letter) cls += ' choice-selected';
      return `<div class="${cls}" data-letter="${letter}">
        <span class="letter">${letter}</span>
        <div>${escapeHtml(q.choices[letter])}</div>
      </div>`;
    }).join('');

    return `
      ${timerTopbarHtml(testState, 'testTimer')}
      <div class="quiz-progress">
        <span>Question ${testState.index + 1} of ${total}</span>
        <span>${Object.keys(testState.answers).length} answered</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="quiz-card">
        <div class="quiz-tags">
          <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
          <span class="cat-tag">${escapeHtml(q.category)}</span>
          <span class="qid" style="align-self:center;" data-copy-id="${escapeHtml(q.shortId)}" title="Click to copy ${escapeHtml(q.shortId)}">${escapeHtml(q.shortId)}</span>
          <button class="id-chip" data-copy-id="${escapeHtml(q.id)}" title="Click to copy ID">${escapeHtml(q.id)}</button>
          <button class="btn" style="padding:4px 10px; font-size:12px;" data-copy-question-qid="${q.id}" title="${q.has_image ? 'Copies question text only — chart/table image not included' : 'Copy question text'}">Copy question</button>
        </div>
        ${questionImageHtml(q)}
        <div class="stem">${renderStemHtml(q.stem)}</div>
        <div class="prompt-line">${escapeHtml(q.prompt)}</div>
        <div class="choices">${choiceHtml}</div>
        <div class="quiz-nav">
          <button class="btn" id="prevBtn" ${testState.index === 0 ? 'disabled' : ''}>Previous</button>
          ${testState.index === total - 1
            ? `<button class="btn btn-accent" id="submitBtn">Submit test</button>`
            : `<button class="btn btn-accent" id="nextBtn">Next</button>`}
        </div>
      </div>`;
  }

  function testResultsHtml() {
    const total = testState.questions.length;
    let correct = 0;
    testState.questions.forEach(q => { if (testState.answers[q.id] === q.correct_answer) correct++; });
    const pct = Math.round((correct / total) * 100);
    const bySkill = {};
    testState.questions.forEach(q => {
      bySkill[q.skill] = bySkill[q.skill] || { c: 0, t: 0 };
      bySkill[q.skill].t++;
      if (testState.answers[q.id] === q.correct_answer) bySkill[q.skill].c++;
    });
    const skillRows = Object.entries(bySkill).map(([s, v]) =>
      `<div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
        <span>${escapeHtml(s)}</span><span style="font-family:var(--mono);">${v.c}/${v.t}</span>
      </div>`).join('');

    const reviewHtml = testState.questions.map((q, i) => {
      const yours = testState.answers[q.id];
      const isCorrect = yours === q.correct_answer;
      return `
        <div class="review-item">
          <div class="row1">
            <span class="pill ${isCorrect ? 'pill-easy' : 'pill-hard'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>
            <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
            <span class="cat-tag">${escapeHtml(q.category)}</span>
            <span class="qskill" style="margin:0;">${escapeHtml(q.shortId)} &middot; ${escapeHtml(q.skill)}</span>
          </div>
          <div class="stem">${i + 1}. ${escapeStemFlat(q.stem)}</div>
          ${questionImageHtml(q)}
          <div style="font-size:13px;">
