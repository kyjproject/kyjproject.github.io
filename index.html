<!doctype html>
<meta charset="utf-8" />
<title>SAT Reading &amp; Writing Question Bank</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --paper: #f6f7f9;
    --paper-raised: #ffffff;
    --ink: #1c2430;
    --ink-soft: #4b5563;
    --ink-faint: #8a93a1;
    --rule: #dde1e7;
    --rule-soft: #e9ebef;
    --accent: #1f5f56;
    --accent-soft: #e4efec;
    --accent-ink: #12403a;
    --easy: #2f7a4f;
    --easy-bg: #e5f3ea;
    --medium: #a06a1e;
    --medium-bg: #f6ecd9;
    --hard: #a1333b;
    --hard-bg: #f6e2e3;
    --correct: #2f7a4f;
    --correct-bg: #e5f3ea;
    --incorrect: #a1333b;
    --incorrect-bg: #f6e2e3;
    --review: #6d4fc2;
    --review-bg: #ece7f8;
    --done: #2f7a4f;
    --done-bg: #e5f3ea;
    --shadow: 0 1px 2px rgba(28, 36, 48, 0.06), 0 4px 14px rgba(28, 36, 48, 0.05);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181f;
      --paper-raised: #1b212a;
      --ink: #e8eaee;
      --ink-soft: #aab1bd;
      --ink-faint: #6b7280;
      --rule: #2c333e;
      --rule-soft: #232a34;
      --accent: #5fb3a3;
      --accent-soft: #1c2e2b;
      --accent-ink: #a8ddd0;
      --easy: #6ec48b;
      --easy-bg: #1b2b21;
      --medium: #dcab5c;
      --medium-bg: #2e2515;
      --hard: #e37c83;
      --hard-bg: #331d1f;
      --correct: #6ec48b;
      --correct-bg: #1b2b21;
      --incorrect: #e37c83;
      --incorrect-bg: #331d1f;
      --review: #ab97e8;
      --review-bg: #292040;
      --done: #6ec48b;
      --done-bg: #1b2b21;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(0, 0, 0, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --paper: #14181f;
    --paper-raised: #1b212a;
    --ink: #e8eaee;
    --ink-soft: #aab1bd;
    --ink-faint: #6b7280;
    --rule: #2c333e;
    --rule-soft: #232a34;
    --accent: #5fb3a3;
    --accent-soft: #1c2e2b;
    --accent-ink: #a8ddd0;
    --easy: #6ec48b;
    --easy-bg: #1b2b21;
    --medium: #dcab5c;
    --medium-bg: #2e2515;
    --hard: #e37c83;
    --hard-bg: #331d1f;
    --correct: #6ec48b;
    --correct-bg: #1b2b21;
    --incorrect: #e37c83;
    --incorrect-bg: #331d1f;
    --review: #ab97e8;
    --review-bg: #292040;
    --done: #6ec48b;
    --done-bg: #1b2b21;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 20px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }

  a { color: var(--accent); }

  .app { display: flex; flex-direction: column; min-height: 100%; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-raised);
    flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .topbar .sub {
    color: var(--ink-faint);
    font-size: 13px;
  }
  .stat-row { display: flex; gap: 18px; margin-left: auto; }
  .stat {
    text-align: right;
    font-family: var(--mono);
  }
  .stat .n { font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .stat .l {
    font-family: var(--sans);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    display: block;
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    background: var(--paper-raised);
    border-bottom: 1px solid var(--rule);
    flex-wrap: wrap;
  }
  .tab {
    appearance: none;
    background: none;
    border: none;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-faint);
    padding: 11px 14px 10px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    letter-spacing: 0.01em;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent-ink); border-bottom-color: var(--accent); }

  .view { flex: 1; display: none; }
  .view.active { display: block; }

  /* ---------- Browse layout ---------- */
  .browse-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    align-items: start;
  }
  .filters {
    padding: 22px 18px;
    border-right: 1px solid var(--rule);
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .filter-group h3 {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-faint);
    margin: 0 0 9px;
    font-weight: 700;
  }
  .filter-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 13.5px;
    cursor: pointer;
    user-select: none;
  }
  .filter-opt input { accent-color: var(--accent); width: 14px; height: 14px; }
  .filter-opt .count { margin-left: auto; color: var(--ink-faint); font-family: var(--mono); font-size: 11.5px; }
  .clear-btn {
    appearance: none;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 6px;
    color: var(--ink-soft);
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .clear-btn:hover { border-color: var(--ink-faint); color: var(--ink); }

  .main {
    padding: 22px 28px 60px;
    min-width: 0;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search {
    flex: 1;
    min-width: 220px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .search svg { flex-shrink: 0; color: var(--ink-faint); }
  .search input {
    border: none;
    outline: none;
    background: none;
    font: inherit;
    color: var(--ink);
    width: 100%;
  }
  select {
    font: inherit;
    font-size: 13px;
    background: var(--paper-raised);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .result-count {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  .qlist { display: flex; flex-direction: column; gap: 10px; }
  .qcard {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .qcard.status-done { border-color: var(--done); }
  .qcard.status-review { border-color: var(--review); }
  .qcard-head {
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .qcard-head:hover { background: var(--rule-soft); }
  .qmeta { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; width: 130px; }
  .pill {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2.5px 7px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .pill-easy { color: var(--easy); background: var(--easy-bg); }
  .pill-medium { color: var(--medium); background: var(--medium-bg); }
  .pill-hard { color: var(--hard); background: var(--hard-bg); }
  .pill-review { color: var(--review); background: var(--review-bg); }
  .pill-done { color: var(--done); background: var(--done-bg); }
  .status-btn-row { display: flex; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
  .status-btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: var(--paper-raised);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .status-btn:hover { border-color: var(--ink-faint); }
  .status-btn.on-review { border-color: var(--review); color: var(--review); background: var(--review-bg); }
  .status-btn.on-done { border-color: var(--done); color: var(--done); background: var(--done-bg); }
  .status-btn.on-incomplete { border-color: var(--ink-faint); color: var(--ink); background: var(--rule-soft); }
  .qid { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
  .cat-tag {
    font-size: 10.5px;
    color: var(--ink-faint);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 1.5px 6px;
    white-space: nowrap;
  }
  .qstem {
    font-size: 14px;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .qskill { font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; }

  .qdetail { border-top: 1px solid var(--rule); padding: 4px 20px 20px; }
  .qdetail.qdetail-bare { border-top: none; padding: 0; }
  .qdetail .stem { font-size: 15px; padding: 14px 0 16px; }
  .stem p { margin: 0 0 12px; }
  .stem p:last-child { margin-bottom: 0; }
  .text-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent-ink);
    margin-bottom: 4px;
  }
  .qimage-wrap {
    margin: 4px 0 16px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: auto;
    background: #ffffff;
  }

  /* ---------- Question modal (Browse) ---------- */
  .modal-root {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 4vh 16px;
  }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(10, 13, 18, 0.55);
  }
  .modal-card {
    position: relative;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    width: min(720px, 100%);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .modal-head-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; }
  .modal-close {
    appearance: none;
    border: none;
    background: none;
    color: var(--ink-faint);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .modal-close:hover { background: var(--rule-soft); color: var(--ink); }
  .modal-body {
    padding: 18px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-body .qdetail-bare .status-btn-row { margin-bottom: 4px; }
  .modal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 18px;
    border-top: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .modal-position { font-size: 12.5px; color: var(--ink-faint); font-family: var(--mono); }
  @media (max-width: 600px) {
    .modal-root { padding: 0; align-items: stretch; }
    .modal-card { width: 100%; max-height: 100vh; border-radius: 0; }
  }
  body.modal-open { overflow: hidden; }
  #loadMoreBtn { align-self: flex-start; }
  .qimage { display: block; max-width: 100%; height: auto; }
  .qimage-missing {
    padding: 14px 16px;
    font-size: 12.5px;
    color: var(--ink-faint);
    font-style: italic;
  }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .choice {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    background: var(--paper);
  }
  .choice:hover { border-color: var(--accent); }
  .choice .letter {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12.5px;
    color: var(--ink-faint);
    flex-shrink: 0;
    width: 16px;
  }
  .choice.choice-selected { border-color: var(--accent); background: var(--accent-soft); }
  .choice.choice-selected .letter { color: var(--accent-ink); }
  .choice.chosen-correct { border-color: var(--correct); background: var(--correct-bg); }
  .choice.chosen-correct .letter { color: var(--correct); }
  .choice.chosen-incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .choice.chosen-incorrect .letter { color: var(--incorrect); }
  .choice.reveal-correct:not(.chosen-correct) { border-color: var(--correct); }
  .choice .rationale-line {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--rule);
  }
  .detail-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    appearance: none;
    border: 1px solid var(--rule);
    background: var(--paper-raised);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-accent:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-faint); }

  /* ---------- Practice / Test shell ---------- */
  .test-shell { max-width: 760px; margin: 0 auto; padding: 30px 24px 60px; }
  .config-card {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 26px;
  }
  .config-card h2 {
    font-family: var(--serif);
    font-size: 19px;
    margin: 0 0 4px;
  }
  .config-card p.lede { color: var(--ink-faint); font-size: 13px; margin: 0 0 20px; }
  .config-row { margin-bottom: 18px; }
  .config-row label {
    display: block;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-faint);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .num-input {
    width: 90px;
    font: inherit;
    font-size: 15px;
    padding: 7px 10px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 99px;
    cursor: pointer;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

  .quiz-progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }
  .bar { height: 4px; background: var(--rule-soft); border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
  .bar-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }
  .quiz-card {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 24px 26px;
  }
  .quiz-tags { display: flex; gap: 8px; margin-bottom: 14px; }
  .quiz-nav { display: flex; justify-content: space-between; margin-top: 20px; }

  .results-summary {
    text-align: center;
    padding: 30px 20px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  .results-summary .score {
    font-family: var(--serif);
    font-size: 44px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .results-summary .score-sub { color: var(--ink-faint); font-size: 13px; margin-top: 4px; }
  .review-item {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .review-item .row1 { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .review-item .stem { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 8px; }

  /* ---------- Progress / Review tabs ---------- */
  .progress-summary {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 24px 26px;
    margin-bottom: 20px;
  }
  .progress-summary h2 { font-family: var(--serif); font-size: 19px; margin: 0 0 16px; }
  .progress-stats { display: flex; gap: 26px; margin-bottom: 14px; flex-wrap: wrap; }
  .progress-stat .n { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .progress-stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); display: block; margin-top: 2px; }
  .progress-stat.review .n { color: var(--review); }
  .progress-stat.done .n { color: var(--done); }
  .segbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--rule-soft); }
  .segbar .seg-done { background: var(--done); }
  .segbar .seg-review { background: var(--review); }
  .progress-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .progress-note { font-size: 11.5px; color: var(--ink-faint); margin-top: 10px; }
  .cat-progress-card {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 8px;
  }
  .cat-progress-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .cat-progress-row .name { font-weight: 600; font-size: 13.5px; }
  .cat-progress-row .frac { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
  .cat-progress-card { cursor: pointer; }
  .cat-progress-row .name { display: flex; align-items: center; gap: 6px; }
  .chevron { display: inline-block; color: var(--ink-faint); transition: transform 0.15s ease; font-size: 10px; }
  .chevron.open { transform: rotate(90deg); }
  .cat-detail { border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 10px; cursor: default; }
  .diff-subhead {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    margin: 12px 0 6px;
  }
  .diff-subhead:first-child { margin-top: 0; }
  .qtile-grid { display: flex; flex-wrap: wrap; gap: 4px; }
  .qtile {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1.5px solid var(--rule);
    background: var(--paper);
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .qtile:hover { border-color: var(--ink-faint); transform: scale(1.25); }
  .qtile.status-done { background: var(--done); border-color: var(--done); }
  .qtile.status-review { background: var(--review); border-color: var(--review); }
  .review-queue-empty { color: var(--ink-faint); font-size: 13px; padding: 4px 0 4px; }

  .inline-q-panel {
    background: var(--paper-raised);
    border: 1px solid var(--accent);
    border-radius: 12px;

<script id="questions-data" type="application/json">[]</script>
<script>
(function () {
  // Loaded from an external data.js (GitHub Pages build) when present;
  // falls back to the inline JSON tag (self-contained single-file build).
  const QUESTIONS = (typeof SAT_QUESTIONS !== 'undefined')
    ? SAT_QUESTIONS
    : JSON.parse(document.getElementById('questions-data').textContent);

  // Short, human-friendly identifiers ("Transitions #23") assigned in source
  // order per category. The long College Board hash id (q.id) remains the
  // storage key for progress/attempt state so existing exported progress
  // files keep working; shortId is purely a display label.
  const CATEGORY_LABELS = {
    'Command of Evidence': 'Evidence',
    'Cross-Text': 'Cross Text',
  };
  function categoryLabel(cat) { return CATEGORY_LABELS[cat] || cat; }
  (function assignShortIds() {
    const counters = {};
    QUESTIONS.forEach(q => {
      counters[q.category] = (counters[q.category] || 0) + 1;
      q.shortId = `${categoryLabel(q.category)} #${counters[q.category]}`;
    });
  })();

  // ---------- Progress persistence ----------
  // Per-question status: 'review' (flagged) | 'done' (complete) | absent (incomplete).
  // Saved to localStorage as a best effort — browsers/hosts vary in whether that
  // persists reliably, so Export/Import (Progress tab) is the durable backup path.
  const STORAGE_KEY = 'sat_qbank_progress_v1';

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    } catch (e) {
      // storage unavailable/full — progress still lives in memory for this session
    }
  }

  function setStatus(qid, status) {
    if (status) state.progress[qid] = status;
    else delete state.progress[qid];
    saveProgress();
  }

  const state = {
    query: '',
    categories: new Set(),
    skills: new Set(),
    difficulties: new Set(),
    statuses: new Set(), // 'review' | 'done' | 'incomplete'
    sort: 'default',
    expanded: null,
    modalList: null, // ordered array of questions the modal is navigating (Browse's current filtered list)
    modalIndex: null, // index within modalList currently shown in the modal
    attempt: {}, // questionId -> { choice, submitted, showAnswer }
    progress: loadProgress(), // questionId -> 'review' | 'done'
    progressExpandedCategory: null, // which category's tile breakdown is open on the Progress tab
    progressOpenQuestion: null, // qid opened inline on the Progress tab (via a tile click)
    reviewOpenQuestion: null, // qid opened inline on the Review tab (via a tile click)
  };

  const testState = {
    phase: 'config', // config | quiz | results
    count: 10,
    categories: new Set(),
    skills: new Set(),
    difficulties: new Set(),
    statuses: new Set(),
    questions: [],
    index: 0,
    answers: {},
  };

  const practiceState = {
    phase: 'config', // config | session
    categories: new Set(),
    skills: new Set(),
    difficulties: new Set(),
    statuses: new Set(),
    shuffle: false,
    questions: [],
    index: 0,
  };

  const allCategories = [...new Set(QUESTIONS.map(q => q.category))].sort();
  const allSkills = [...new Set(QUESTIONS.map(q => q.skill))].sort();
  const allDifficulties = ['Easy', 'Medium', 'Hard'];

  // ---------- Stats ----------
  function renderStats() {
    const byDiff = { Easy: 0, Medium: 0, Hard: 0 };
    QUESTIONS.forEach(q => byDiff[q.difficulty_label]++);
    document.getElementById('statRow').innerHTML = `
      <div class="stat"><span class="n">${QUESTIONS.length}</span><span class="l">Questions</span></div>
      <div class="stat"><span class="n">${allCategories.length}</span><span class="l">Categories</span></div>
      <div class="stat"><span class="n">${byDiff.Hard}</span><span class="l">Hard</span></div>
    `;
  }

  // ---------- Filters ----------
  function questionStatus(q) {
    return state.progress[q.id] || 'incomplete';
  }

  const STATUS_LABELS = { review: 'To review', done: 'Complete', incomplete: 'Incomplete' };
  const ALL_STATUSES = ['review', 'done', 'incomplete'];

  function matchesQuery(q) {
    if (!state.query) return true;
    const hay = (q.stem + ' ' + Object.values(q.choices).join(' ') + ' ' + q.rationale_full).toLowerCase();
    return hay.includes(state.query.toLowerCase());
  }

  function currentFiltered(base) {
    return base.filter(q => {
      if (state.categories.size && !state.categories.has(q.category)) return false;
      if (state.skills.size && !state.skills.has(q.skill)) return false;
      if (state.difficulties.size && !state.difficulties.has(q.difficulty_label)) return false;
      if (state.statuses.size && !state.statuses.has(questionStatus(q))) return false;
      return matchesQuery(q);
    });
  }

  // Filters QUESTIONS by an arbitrary {categories, skills, difficulties, statuses}
  // selection object — shared by the Test and Practice tabs' config screens.
  function filterPool(sel) {
    return QUESTIONS.filter(q =>
      (!sel.categories.size || sel.categories.has(q.category)) &&
      (!sel.skills.size || sel.skills.has(q.skill)) &&
      (!sel.difficulties.size || sel.difficulties.has(q.difficulty_label)) &&
      (!sel.statuses.size || sel.statuses.has(questionStatus(q)))
    );
  }

  function diffPillClass(label) {
    return { Easy: 'pill pill-easy', Medium: 'pill pill-medium', Hard: 'pill pill-hard' }[label] || 'pill';
  }

  function statusPillClass(status) {
    return { review: 'pill pill-review', done: 'pill pill-done' }[status] || 'pill';
  }

  function statusButtonsHtml(q) {
    const status = questionStatus(q);
    return `
      <div class="status-btn-row">
        <button class="status-btn ${status === 'review' ? 'on-review' : ''}" data-status-qid="${q.id}" data-set-status="review">🚩 Mark for review</button>
        <button class="status-btn ${status === 'done' ? 'on-done' : ''}" data-status-qid="${q.id}" data-set-status="done">✓ Mark complete</button>
        <button class="status-btn ${status === 'incomplete' ? 'on-incomplete' : ''}" data-status-qid="${q.id}" data-set-status="incomplete">○ Mark incomplete</button>
      </div>`;
  }

  function applyStatusClick(qid, next) {
    setStatus(qid, next === 'incomplete' ? null : next);
    renderFilters();
  }

  // Wires every [data-status-qid] button inside `container` via a single
  // delegated listener. Safe to call on every render of the same container —
  // a dataset flag guards against attaching the same delegated listener
  // twice on a container that persists across re-renders (its innerHTML gets
  // replaced, but the container element itself does not).
  function wireStatusButtons(container, onChange) {
    if (!container) return;
    if (container.dataset && container.dataset.statusWired) return;
    if (container.dataset) container.dataset.statusWired = '1';
    container.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-status-qid]');
      if (!btn || !container.contains(btn)) return;
      applyStatusClick(btn.dataset.statusQid, btn.dataset.setStatus);
      onChange();
    });
  }

  // Renders one filter facet (category / skill / difficulty / status), computing
  // each option's count against every OTHER active facet (but not its own), so
  // checking a box never makes its neighbors read "0".
  function renderFacet(containerId, options, selectedSet, facetKey, valueFn, pillClassFn, labelFn) {
    const counts = options.map(opt => QUESTIONS.filter(q => {
      if (facetKey !== 'categories' && state.categories.size && !state.categories.has(q.category)) return false;
      if (facetKey !== 'skills' && state.skills.size && !state.skills.has(q.skill)) return false;
      if (facetKey !== 'difficulties' && state.difficulties.size && !state.difficulties.has(q.difficulty_label)) return false;
      if (facetKey !== 'statuses' && state.statuses.size && !state.statuses.has(questionStatus(q))) return false;
      if (!matchesQuery(q)) return false;
      return valueFn(q) === opt;
    }).length);

    const el = document.getElementById(containerId);
    el.innerHTML = options.map((opt, i) => {
      const checked = selectedSet.has(opt) ? 'checked' : '';
      const cls = pillClassFn ? pillClassFn(opt) : '';
      const label = escapeHtml(labelFn ? labelFn(opt) : opt);
      return `<label class="filter-opt">
        <input type="checkbox" data-val="${escapeHtml(opt)}" ${checked} />
        <span class="${cls}">${label}</span>
        <span class="count">${counts[i]}</span>
      </label>`;
    }).join('');
    el.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('change', () => {
        const v = inp.dataset.val;
        if (inp.checked) selectedSet.add(v); else selectedSet.delete(v);
        renderFilters();
        renderBrowse();
      });
    });
  }

  function renderFilters() {
    renderFacet('categoryFilters', allCategories, state.categories, 'categories', q => q.category);
    renderFacet('skillFilters', allSkills, state.skills, 'skills', q => q.skill);
    renderFacet('difficultyFilters', allDifficulties, state.difficulties, 'difficulties', q => q.difficulty_label, diffPillClass);
    renderFacet('statusFilters', ALL_STATUSES, state.statuses, 'statuses', questionStatus, statusPillClass, s => STATUS_LABELS[s]);
  }

  // ---------- Browse list ----------
  const BROWSE_PAGE_SIZE = 60;
  let browseRenderedList = []; // the list currently on screen, for the delegated click handler + modal Prev/Next

  function renderBrowse() {
    state.browseShown = BROWSE_PAGE_SIZE; // any filter/search/sort change restarts pagination
    let list = currentFiltered(QUESTIONS);
    if (state.sort === 'diff-asc') list = [...list].sort((a, b) => a.difficulty - b.difficulty);
    if (state.sort === 'diff-desc') list = [...list].sort((a, b) => b.difficulty - a.difficulty);

    document.getElementById('resultCount').textContent =
      `${list.length} question${list.length === 1 ? '' : 's'}`;

    renderQuestionListInto(document.getElementById('qlist'), list);
  }

  // Renders a (paginated) list of question cards into `container`. Clicking a
  // card opens it in the modal rather than expanding inline — Browse never
  // has to re-render its ~1700-question list just to show one question's
  // detail, and a single delegated click listener (wired once, in the init
  // block at the bottom of this script) replaces what used to be one
  // addEventListener call per card. Rendering itself is capped at
  // BROWSE_PAGE_SIZE cards with a "Show more" button appending the rest in
  // batches, since building/parsing HTML for ~1700 cards at once was the
  // biggest remaining cost — most filtered views are far smaller than that,
  // and the common "browse everything" case rarely needs to scroll past
  // the first batch anyway.
  function renderQuestionListInto(container, list) {
    browseRenderedList = list;
    if (!list.length) {
      container.innerHTML = `<div class="empty-state">No questions match these filters.</div>`;
      return;
    }

    const shown = Math.min(state.browseShown || BROWSE_PAGE_SIZE, list.length);
    const visible = list.slice(0, shown);
    const remaining = list.length - shown;
    container.innerHTML = visible.map(q => qCardHtml(q)).join('') + (remaining > 0
      ? `<button class="btn" id="loadMoreBtn">Show ${Math.min(BROWSE_PAGE_SIZE, remaining)} more (${remaining} left)</button>`
      : '');

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (loadMoreBtn) loadMoreBtn.addEventListener('click', () => {
      state.browseShown = shown + BROWSE_PAGE_SIZE;
      renderQuestionListInto(container, list);
    });
  }

  // Renders a question's chart/table image when it has one. Command of
  // Evidence is the only category with these; the image lives alongside
  // this page as a plain file (images/<category-slug>/<id>.png) on a real
  // static-host deploy. It's absent from the single-file build, so a
  // missing file degrades to a small note instead of a broken-image icon.
  function questionImageHtml(q) {
    if (!q.has_image || !q.image_paths || !q.image_paths.length) return '';
    const src = q.image_paths[0].path || q.image_paths[0];
    return `<div class="qimage-wrap">
      <img class="qimage" src="${escapeHtml(src)}" alt="Chart or table for question ${q.id}"
        onerror="this.closest('.qimage-wrap').innerHTML='<div class=&quot;qimage-missing&quot;>Chart/table image not available in this view.</div>'" />
    </div>`;
  }

  // Renders a stem/passage that may contain "\n\n"-separated paragraphs
  // (e.g. Cross-Text questions have a "Text 1" / "Text 2" pair).
  function renderStemHtml(stem) {
    return stem.split('\n\n').map(p => {
      if (/^Text \d+$/.test(p.trim())) {
        return `<div class="text-label">${escapeHtml(p.trim())}</div>`;
      }
      return `<p>${escapeHtml(p)}</p>`;
    }).join('');
  }

  function qCardHtml(q) {
    const status = questionStatus(q);
    const statusBadge = status !== 'incomplete'
      ? `<span class="${statusPillClass(status)}">${STATUS_LABELS[status]}</span>`
      : '';
    return `
      <div class="qcard ${status !== 'incomplete' ? 'status-' + status : ''}">
        <div class="qcard-head" data-id="${q.id}">
          <div style="flex:1; min-width:0;">
            <div class="qstem">${escapeHtml(q.stem.replace(/\n\n/g, ' '))}</div>
            <div class="qskill">${escapeHtml(q.skill)} &middot; ${escapeHtml(q.domain)}</div>
          </div>
          <div class="qmeta">
            <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
            ${statusBadge}
            <span class="cat-tag">${escapeHtml(q.category)}</span>
            <span class="qid" title="${escapeHtml(q.id)}">${escapeHtml(q.shortId)}</span>
          </div>
        </div>
      </div>`;
  }

  // Current pending/graded attempt for a question: { choice, submitted, showAnswer }.
  function getAttempt(qid) {
    return state.attempt[qid] || { choice: null, submitted: false, showAnswer: false };
  }

  // Shared interactive question body (image, stem, choices, submit/show-answer
  // buttons, status buttons) used by Browse's expanded card, the Practice
  // session, and the inline panels opened from Progress/Review tiles.
  //
  // Interaction model: clicking a choice only *selects* it (no reveal).
  // "Submit" grades that selection (chosen choice turns green/red). "Show
  // answer" independently reveals the correct choice + full per-choice
  // rationale, whether or not anything has been submitted yet.
  function qDetailHtml(q, opts) {
    opts = opts || {};
    const att = getAttempt(q.id);
    const choiceHtml = ['A', 'B', 'C', 'D'].map(letter => {
      const isCorrect = letter === q.correct_answer;
      const isChosen = att.choice === letter;
      let cls = 'choice';
      if (att.submitted && isChosen) cls += isCorrect ? ' chosen-correct' : ' chosen-incorrect';
      else if (isChosen) cls += ' choice-selected';
      if (att.showAnswer && isCorrect && !(att.submitted && isChosen)) cls += ' reveal-correct';
      const showRationale = (att.submitted && isChosen) || att.showAnswer;
      const rationaleLine = showRationale
        ? `<div class="rationale-line">${escapeHtml(q.rationale_by_choice[letter] || '')}</div>`
        : '';
      return `<div class="${cls}" data-letter="${letter}" data-qid="${q.id}">
        <span class="letter">${letter}</span>
        <div style="flex:1;">
          <div>${escapeHtml(q.choices[letter])}</div>
          ${rationaleLine}
        </div>
      </div>`;
    }).join('');

    const wrapClass = opts.bare ? 'qdetail qdetail-bare' : 'qdetail';
    return `
      <div class="${wrapClass}">
        ${questionImageHtml(q)}
        <div class="stem">${renderStemHtml(q.stem)}</div>
        <div class="choices">${choiceHtml}</div>
        <div class="detail-actions">
          <span style="font-size:12px; color:var(--ink-faint); flex:1; min-width:160px;">${escapeHtml(q.prompt)}</span>
          <button class="btn btn-accent" data-submit-qid="${q.id}" ${(!att.choice || att.submitted) ? 'disabled' : ''}>Submit</button>
          <button class="btn" data-toggle-answer-qid="${q.id}">${att.showAnswer ? 'Hide answer' : 'Show answer'}</button>
        </div>
        ${statusButtonsHtml(q)}
      </div>`;
  }

  // Wires a question's interactive detail body within `root` (choice select,
  // submit, show/hide answer, status buttons). `root` scopes every query so
  // the same question open in two different tabs at once (e.g. expanded in
  // Browse while also open in a Progress tile panel) never cross-wires.
  function wireDetail(q, onChange, root) {
    root = root || document;
    root.querySelectorAll(`.choice[data-qid="${q.id}"]`).forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const letter = el.dataset.letter;
        const att = getAttempt(q.id);
        state.attempt[q.id] = Object.assign({}, att, { choice: letter, submitted: false });
        onChange();
      });
    });
    const submitBtn = root.querySelector(`[data-submit-qid="${q.id}"]`);
    if (submitBtn) submitBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const att = getAttempt(q.id);
      if (!att.choice) return;
      state.attempt[q.id] = Object.assign({}, att, { submitted: true });
      onChange();
    });
    const toggleBtn = root.querySelector(`[data-toggle-answer-qid="${q.id}"]`);
    if (toggleBtn) toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const att = getAttempt(q.id);
      state.attempt[q.id] = Object.assign({}, att, { showAnswer: !att.showAnswer });
      onChange();
    });
    wireStatusButtons(root, onChange);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // "Category#N" shorthand (e.g. "Evidence#1", "Grammar#42") jumps straight
  // to that question's card, expanded and scrolled into view. Matches on a
  // prefix of either the short display label ("Evidence") or the full
  // category name ("Command of Evidence"), case-insensitively.
  function findByShortIdQuery(query) {
    const m = query.trim().match(/^([A-Za-z][A-Za-z\- ]*?)\s*#\s*(\d+)$/);
    if (!m) return null;
    const catQuery = m[1].trim().toLowerCase();
    const num = parseInt(m[2], 10);
    return QUESTIONS.find(q => {
      const label = categoryLabel(q.category).toLowerCase();
      const full = q.category.toLowerCase();
      const shortNum = parseInt(q.shortId.split('#')[1], 10);
      return shortNum === num && (label.startsWith(catQuery) || full.startsWith(catQuery));
    }) || null;
  }

  function jumpToQuestion(qid) {
    state.categories.clear();
    state.skills.clear();
    state.difficulties.clear();
    state.statuses.clear();
    state.query = '';
    document.getElementById('searchBox').value = '';
    renderFilters();
    renderBrowse();
    const idx = browseRenderedList.findIndex(q => q.id === qid);
    if (idx !== -1) {
      openQuestionModal(browseRenderedList, idx);
    } else {
      const q = QUESTIONS.find(x => x.id === qid);
      if (q) openQuestionModal([q], 0);
    }
  }

  // ---------- Question modal (Browse) ----------
  // `list` is the ordered set the modal navigates Prev/Next through — pass
  // whatever list the click came from (Browse's current filtered results),
  // so paging through the modal walks the same set the user was looking at.
  function openQuestionModal(list, index) {
    state.modalList = list;
    state.modalIndex = index;
    renderQuestionModal();
  }

  function closeQuestionModal() {
    state.modalList = null;
    state.modalIndex = null;
    renderQuestionModal();
  }

  function renderQuestionModal() {
    const root = document.getElementById('questionModalRoot');
    const list = state.modalList;
    const q = list && list[state.modalIndex];
    if (!q) {
      root.style.display = 'none';
      root.innerHTML = '';
      document.body.classList.remove('modal-open');
      return;
    }
    root.style.display = 'flex';
    document.body.classList.add('modal-open');
    const total = list.length;
    const status = questionStatus(q);
    const statusBadge = status !== 'incomplete'
      ? `<span class="${statusPillClass(status)}">${STATUS_LABELS[status]}</span>`
      : '';
    root.innerHTML = `
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-card">
        <div class="modal-head">
          <div class="modal-head-info">
            <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
            ${statusBadge}
            <span class="cat-tag">${escapeHtml(q.category)}</span>
            <span class="qid" title="${escapeHtml(q.id)}">${escapeHtml(q.shortId)}</span>
          </div>
          <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">${qDetailHtml(q, { bare: true })}</div>
        <div class="modal-nav">
          <button class="btn" id="modalPrevBtn" ${state.modalIndex === 0 ? 'disabled' : ''}>&larr; Previous</button>
          <span class="modal-position">${state.modalIndex + 1} of ${total}</span>
          <button class="btn" id="modalNextBtn" ${state.modalIndex === total - 1 ? 'disabled' : ''}>Next &rarr;</button>
        </div>
      </div>`;

    root.querySelectorAll('[data-close-modal]').forEach(el => el.addEventListener('click', closeQuestionModal));
    const prevBtn = document.getElementById('modalPrevBtn');
    if (prevBtn) prevBtn.addEventListener('click', () => { state.modalIndex--; renderQuestionModal(); });
    const nextBtn = document.getElementById('modalNextBtn');
    if (nextBtn) nextBtn.addEventListener('click', () => { state.modalIndex++; renderQuestionModal(); });
    wireDetail(q, renderQuestionModal, root);
  }

  // Debounced: with ~1700 questions, re-filtering + re-rendering the facet
  // counts and the list on every single keystroke was a real chunk of the
  // "feels slow" complaint. Waiting a beat after typing stops removes that
  // without making search feel laggy.
  let searchDebounceTimer = null;
  document.getElementById('searchBox').addEventListener('input', (e) => {
    const value = e.target.value;
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
      state.query = value;
      renderFilters();
      renderBrowse();
    }, 180);
  });
  document.getElementById('searchBox').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const match = findByShortIdQuery(e.target.value);
    if (match) {
      e.preventDefault();
      jumpToQuestion(match.id);
    }
  });
  document.getElementById('sortSelect').addEventListener('change', (e) => {
    state.sort = e.target.value;
    renderBrowse();
  });
  document.getElementById('clearFilters').addEventListener('click', () => {
    state.categories.clear();
    state.skills.clear();
    state.difficulties.clear();
    state.statuses.clear();
    state.query = '';
    document.getElementById('searchBox').value = '';
    renderFilters();
    renderBrowse();
  });

  // One delegated listener for the whole Browse list — opens the clicked
  // question in the modal, navigating Prev/Next through whatever list was
  // on screen at click time (browseRenderedList, kept in sync by
  // renderQuestionListInto). Replaces what used to be an addEventListener
  // call per rendered card.
  document.getElementById('qlist').addEventListener('click', (e) => {
    const head = e.target.closest('.qcard-head');
    if (!head) return;
    const qid = head.dataset.id;
    const idx = browseRenderedList.findIndex(q => q.id === qid);
    if (idx !== -1) openQuestionModal(browseRenderedList, idx);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.modalList) closeQuestionModal();
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + tab.dataset.view).classList.add('active');
      if (tab.dataset.view === 'practice') renderPractice();
      if (tab.dataset.view === 'test') renderTest();
      if (tab.dataset.view === 'mock') renderMock();
      if (tab.dataset.view === 'progress') renderProgress();
      if (tab.dataset.view === 'review') renderReview();
    });
  });

  // ---------- Shared scope-filter chips (Test config + Practice config) ----------
  function categoryChipsHtml(sel) {
    return allCategories.map(c =>
      `<button class="chip ${sel.categories.has(c) ? 'on' : ''}" data-field="categories" data-val="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');
  }
  function skillChipsHtml(sel) {
    return allSkills.map(s =>
      `<button class="chip ${sel.skills.has(s) ? 'on' : ''}" data-field="skills" data-val="${escapeHtml(s)}">${escapeHtml(s)}</button>`
    ).join('');
  }
  function difficultyChipsHtml(sel) {
    return allDifficulties.map(d =>
      `<button class="chip ${sel.difficulties.has(d) ? 'on' : ''}" data-field="difficulties" data-val="${d}">${d}</button>`
    ).join('');
  }
  function statusChipsHtml(sel) {
    return ALL_STATUSES.map(s =>
      `<button class="chip ${sel.statuses.has(s) ? 'on' : ''}" data-field="statuses" data-val="${s}">${STATUS_LABELS[s]}</button>`
    ).join('');
  }
  // Delegated-free (rebound every render, but chips are recreated each render
  // too since they live inside an innerHTML-replaced config card) toggle wiring
  // for any chip row built from the helpers above.
  function wireScopeChips(root, sel, onChange) {
    root.querySelectorAll('[data-field]').forEach(btn => {
      btn.addEventListener('click', () => {
        const field = btn.dataset.field;
        const val = btn.dataset.val;
        const set = sel[field];
        if (set.has(val)) set.delete(val); else set.add(val);
        onChange();
      });
    });
  }

  // ---------- Test (real, scored test — no per-question feedback until the end) ----------
  function testPool() { return filterPool(testState); }

  function renderTest() {
    const shell = document.getElementById('testShell');
    if (testState.phase === 'config') shell.innerHTML = testConfigHtml();
    else if (testState.phase === 'quiz') shell.innerHTML = testQuizHtml();
    else shell.innerHTML = testResultsHtml();
    wireTest();
  }

  function testConfigHtml() {
    const pool = testPool();
    return `
      <div class="config-card">
        <h2>Build a test</h2>
        <p class="lede">${pool.length} question${pool.length === 1 ? '' : 's'} available with the filters below. This simulates the real thing — choices aren't graded until you submit the whole test.</p>
        <div class="config-row">
          <label>Scope — status (leave empty for all)</label>
          <div class="chip-row">${statusChipsHtml(testState)}</div>
        </div>
        <div class="config-row">

  function testQuizHtml() {
    const q = testState.questions[testState.index];
    const total = testState.questions.length;
    const answered = testState.answers[q.id];
    const pct = Math.round(((testState.index) / total) * 100);
    const choiceHtml = ['A', 'B', 'C', 'D'].map(letter => {
      let cls = 'choice';
      if (answered === letter) cls += ' choice-selected';
      return `<div class="${cls}" data-letter="${letter}">
        <span class="letter">${letter}</span>
        <div>${escapeHtml(q.choices[letter])}</div>
      </div>`;
    }).join('');

    return `
      <div class="quiz-progress">
        <span>Question ${testState.index + 1} of ${total}</span>
        <span>${Object.keys(testState.answers).length} answered</span>
      </div>

      <div class="quiz-card">
        <div class="quiz-tags">
          <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
          <span class="cat-tag">${escapeHtml(q.category)}</span>
          <span class="qid" style="align-self:center;">${escapeHtml(q.shortId)}</span>

        <div class="choices">${choiceHtml}</div>
        <div class="quiz-nav">
          <button class="btn" id="prevBtn" ${testState.index === 0 ? 'disabled' : ''}>Previous</button>
          ${testState.index === total - 1
            ? `<button class="btn btn-accent" id="submitBtn">Submit test</button>`
            : `<button class="btn btn-accent" id="nextBtn">Next</button>`}
        </div>
      </div>`;
  }

  function testResultsHtml() {
    const total = testState.questions.length;
    let correct = 0;
    testState.questions.forEach(q => { if (testState.answers[q.id] === q.correct_answer) correct++; });
    const pct = Math.round((correct / total) * 100);
    const bySkill = {};
    testState.questions.forEach(q => {
      bySkill[q.skill] = bySkill[q.skill] || { c: 0, t: 0 };
      bySkill[q.skill].t++;
      if (testState.answers[q.id] === q.correct_answer) bySkill[q.skill].c++;
    });
    const skillRows = Object.entries(bySkill).map(([s, v]) =>
      `<div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
        <span>${escapeHtml(s)}</span><span style="font-family:var(--mono);">${v.c}/${v.t}</span>
      </div>`).join('');

    const reviewHtml = testState.questions.map((q, i) => {
      const yours = testState.answers[q.id];
      const isCorrect = yours === q.correct_answer;
      return `
        <div class="review-item">
          <div class="row1">
            <span class="pill ${isCorrect ? 'pill-easy' : 'pill-hard'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>
            <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
            <span class="cat-tag">${escapeHtml(q.category)}</span>
            <span class="qskill" style="margin:0;">${escapeHtml(q.shortId)} &middot; ${escapeHtml(q.skill)}</span>
          </div>
          <div class="stem">${i + 1}. ${escapeHtml(q.stem.replace(/\n\n/g, ' '))}</div>
          ${questionImageHtml(q)}
          <div style="font-size:13px;">
            Your answer: <strong>${yours || '—'}</strong>${!isCorrect ? ` &nbsp;&middot;&nbsp; Correct: <strong>${q.correct_answer}</strong>` : ''}
          </div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px;">${escapeHtml(q.rationale_by_choice[q.correct_answer] || '')}</div>
          ${statusButtonsHtml(q)}
        </div>`;
    }).join('');

    return `
      <div class="results-summary">
        <div class="score">${correct}/${total}</div>
        <div class="score-sub">${pct}% correct</div>
        <div style="max-width:280px; margin:18px auto 0; text-align:left;">${skillRows}</div>
        <button class="btn" id="retakeBtn" style="margin-top:18px;">New test</button>
      </div>
      <h3 style="font-family:var(--serif); font-size:16px; margin:0 0 10px;">Review</h3>
      ${reviewHtml}`;
  }

  function wireTest() {
    const shell = document.getElementById('testShell');
    if (testState.phase === 'config') {
      wireScopeChips(shell, testState, renderTest);
      const startBtn = document.getElementById('startTestBtn');
      if (startBtn) startBtn.addEventListener('click', () => {
        const countInput = document.getElementById('testCount');
        const n = Math.max(1, parseInt(countInput.value, 10) || 10);
        const pool = testPool();
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        testState.questions = shuffled.slice(0, Math.min(n, shuffled.length));
        testState.index = 0;
        testState.answers = {};
        testState.phase = 'quiz';
        renderTest();
      });
    } else if (testState.phase === 'quiz') {
      const q = testState.questions[testState.index];
      shell.querySelectorAll('.choice[data-letter]').forEach(el => {
        el.addEventListener('click', () => {
          testState.answers[q.id] = el.dataset.letter;
          renderTest();
        });
      });
      const prevBtn = document.getElementById('prevBtn');
      if (prevBtn) prevBtn.addEventListener('click', () => { testState.index--; renderTest(); });
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) nextBtn.addEventListener('click', () => { testState.index++; renderTest(); });
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) submitBtn.addEventListener('click', () => { testState.phase = 'results'; renderTest(); });
    } else {
      const retakeBtn = document.getElementById('retakeBtn');
      if (retakeBtn) retakeBtn.addEventListener('click', () => { testState.phase = 'config'; renderTest(); });
      wireStatusButtons(shell, renderTest);
    }
  }

  // ---------- Mock Exam (full-length, mirrors the real Digital SAT R&W structure) ----------
  // Two modules of 27 questions (54 total), 32 minutes each. Module 1 draws a
  // medium-weighted mix from every skill; Module 2 adapts — harder-weighted if
  // Module 1 went well, easier-weighted if it didn't — approximating (not
  // replicating; College Board's real routing is IRT-based) the real digital
  // SAT's multistage-adaptive design. Skill order/counts below mirror the
  // official 4-domain, 10-skill blueprint and its published per-test count
  // ranges (Information and Ideas 12-14, Craft and Structure 13-15, Expression
  // of Ideas 8-12, Standard English Conventions 11-15, out of 54) — Words in
  // Context leads each module, matching the real test's usual opening block.
  const MOCK_MODULE_SECONDS = 32 * 60;
  const MOCK_PASS_THRESHOLD = 0.6; // module-1 accuracy at/above this routes module 2 to the harder pool

  const MOCK_BLUEPRINT = [
    { category: 'Vocab', skill: 'Words in Context', m1: 4, m2: 4 },
    { category: 'Functions', skill: 'Text Structure and Purpose', m1: 2, m2: 3 },
    { category: 'Cross-Text', skill: 'Cross-Text Connections', m1: 1, m2: 1 },
    { category: 'Main Idea', skill: 'Central Ideas and Details', m1: 2, m2: 2 },
    { category: 'Command of Evidence', skill: 'Command of Evidence', m1: 3, m2: 3 },
    { category: 'Inferences', skill: 'Inferences', m1: 2, m2: 2 },
    { category: 'Grammar', skill: 'Boundaries', m1: 4, m2: 3 },
    { category: 'Grammar', skill: 'Form, Structure, and Sense', m1: 3, m2: 3 },
    { category: 'Transitions', skill: 'Transitions', m1: 3, m2: 3 },
    { category: 'Notes', skill: 'Rhetorical Synthesis', m1: 3, m2: 3 },
  ];
  const MOCK_M1_TOTAL = MOCK_BLUEPRINT.reduce((s, r) => s + r.m1, 0);
  const MOCK_M2_TOTAL = MOCK_BLUEPRINT.reduce((s, r) => s + r.m2, 0);

  const SKILL_DOMAIN = {
    'Central Ideas and Details': 'Information and Ideas',
    'Command of Evidence': 'Information and Ideas',
    'Inferences': 'Information and Ideas',
    'Words in Context': 'Craft and Structure',
    'Text Structure and Purpose': 'Craft and Structure',
    'Cross-Text Connections': 'Craft and Structure',
    'Rhetorical Synthesis': 'Expression of Ideas',
    'Transitions': 'Expression of Ideas',
    'Boundaries': 'Standard English Conventions',
    'Form, Structure, and Sense': 'Standard English Conventions',
  };
  const MOCK_DOMAIN_ORDER = ['Information and Ideas', 'Craft and Structure', 'Expression of Ideas', 'Standard English Conventions'];

  const MOCK_WEIGHTS_M1 = { Easy: 0.25, Medium: 0.5, Hard: 0.25 };
  const MOCK_WEIGHTS_HARDER = { Easy: 0.1, Medium: 0.35, Hard: 0.55 };
  const MOCK_WEIGHTS_EASIER = { Easy: 0.5, Medium: 0.4, Hard: 0.1 };

  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Picks `n` questions from `pool` biased toward `weights` (a difficulty ->
  // fraction map), without replacement. Buckets by difficulty, takes a
  // weight-proportional slice of each, then backfills from whatever's left
  // over (any difficulty) if a bucket came up short — so a thin bucket (e.g.
  // few Hard Cross-Text questions) degrades gracefully instead of returning
  // fewer than n.
  function pickWeighted(pool, n, weights) {
    const buckets = { Easy: [], Medium: [], Hard: [] };
    pool.forEach(q => buckets[q.difficulty_label].push(q));
    Object.values(buckets).forEach(shuffleInPlace);

    const order = ['Easy', 'Medium', 'Hard'];
    const targets = {};
    let remaining = n;
    order.forEach((d, i) => {
      const t = (i === order.length - 1) ? remaining : Math.min(remaining, Math.round(n * weights[d]));
      targets[d] = Math.max(0, t);
      remaining -= targets[d];
    });

    const picked = [];
    order.forEach(d => picked.push(...buckets[d].splice(0, targets[d])));
    if (picked.length < n) {
      const leftover = shuffleInPlace([...buckets.Easy, ...buckets.Medium, ...buckets.Hard]);
      picked.push(...leftover.slice(0, n - picked.length));
    }
    return picked.slice(0, n);
  }

  function buildMockModule(countField, weights, excludeIds) {
    const used = new Set(excludeIds || []);
    const questions = [];
    MOCK_BLUEPRINT.forEach(row => {
      const pool = QUESTIONS.filter(q => q.category === row.category && q.skill === row.skill && !used.has(q.id));
      const picked = pickWeighted(pool, row[countField], weights);
      picked.forEach(q => used.add(q.id));
      questions.push(...picked);
    });
    return questions;
  }

  const mockState = {
    phase: 'intro', // intro | module1 | break | module2 | results
    module1Questions: [],
    module2Questions: [],
    index: 0,
    answers: {}, // qid -> letter, shared across both modules
    timeLeft: 0,
    timerId: null,
    module1Correct: null,
    module1Pct: null,
    routedHarder: null,
  };

  function formatMockTime(seconds) {
    const s = Math.max(0, Math.ceil(seconds));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  function mockClearTimer() {
    if (mockState.timerId) {
      clearInterval(mockState.timerId);
      mockState.timerId = null;
    }
  }

  function mockStartTimer(onExpire) {
    mockClearTimer();
    mockState.timerId = setInterval(() => {
      mockState.timeLeft -= 1;
      const el = document.getElementById('mockTimer');
      if (el) {
        el.textContent = formatMockTime(mockState.timeLeft);
        el.classList.toggle('low-time', mockState.timeLeft <= 60);
      }
      if (mockState.timeLeft <= 0) {
        mockClearTimer();
        onExpire();
      }
    }, 1000);
  }

  function mockScoreModule(questions) {
    let correct = 0;
    questions.forEach(q => { if (mockState.answers[q.id] === q.correct_answer) correct++; });
    return { correct, total: questions.length, pct: questions.length ? correct / questions.length : 0 };
  }

  function startMockExam() {
    mockState.module1Questions = buildMockModule('m1', MOCK_WEIGHTS_M1, []);
    mockState.module2Questions = [];
    mockState.index = 0;
    mockState.answers = {};
    mockState.module1Correct = null;
    mockState.module1Pct = null;
    mockState.routedHarder = null;
    mockState.timeLeft = MOCK_MODULE_SECONDS;
    mockState.phase = 'module1';
    renderMock();
    mockStartTimer(submitMockModule1);
  }

  function submitMockModule1() {
    mockClearTimer();
    const score = mockScoreModule(mockState.module1Questions);
    mockState.module1Correct = score.correct;
    mockState.module1Pct = score.pct;
    mockState.routedHarder = score.pct >= MOCK_PASS_THRESHOLD;
    mockState.phase = 'break';
    renderMock();
  }

  function startMockModule2() {
    const usedIds = mockState.module1Questions.map(q => q.id);
    const weights = mockState.routedHarder ? MOCK_WEIGHTS_HARDER : MOCK_WEIGHTS_EASIER;
    mockState.module2Questions = buildMockModule('m2', weights, usedIds);
    mockState.index = 0;
    mockState.timeLeft = MOCK_MODULE_SECONDS;
    mockState.phase = 'module2';
    renderMock();
    mockStartTimer(submitMockModule2);
  }

  function submitMockModule2() {
    mockClearTimer();
    mockState.phase = 'results';
    renderMock();
  }

  function exitMockExam() {
    if (!confirm('Exit this mock exam? Your progress on it will be lost.')) return;
    mockClearTimer();
    mockState.phase = 'intro';

  function renderMock() {
    const shell = document.getElementById('mockShell');
    if (mockState.phase === 'intro') shell.innerHTML = mockIntroHtml();
    else if (mockState.phase === 'module1') shell.innerHTML = mockQuizHtml(mockState.module1Questions, 1);
    else if (mockState.phase === 'break') shell.innerHTML = mockBreakHtml();
    else if (mockState.phase === 'module2') shell.innerHTML = mockQuizHtml(mockState.module2Questions, 2);
    else shell.innerHTML = mockResultsHtml();
    wireMock();
  }

  function wireMock() {
    const shell = document.getElementById('mockShell');
    if (mockState.phase === 'intro') {
      const startBtn = document.getElementById('startMockBtn');
      if (startBtn) startBtn.addEventListener('click', startMockExam);
    } else if (mockState.phase === 'module1' || mockState.phase === 'module2') {
      const questions = mockState.phase === 'module1' ? mockState.module1Questions : mockState.module2Questions;
      const q = questions[mockState.index];
      shell.querySelectorAll('.choice[data-letter]').forEach(el => {
        el.addEventListener('click', () => {
          mockState.answers[q.id] = el.dataset.letter;
          renderMock();
        });
      });
      const prevBtn = document.getElementById('mockPrevBtn');
      if (prevBtn) prevBtn.addEventListener('click', () => { mockState.index--; renderMock(); });
      const nextBtn = document.getElementById('mockNextBtn');
      if (nextBtn) nextBtn.addEventListener('click', () => { mockState.index++; renderMock(); });
      const submitBtn = document.getElementById('mockSubmitBtn');
      if (submitBtn) submitBtn.addEventListener('click', () => {
        if (mockState.phase === 'module1') submitMockModule1(); else submitMockModule2();
      });
      const exitBtn = document.getElementById('mockExitBtn');
      if (exitBtn) exitBtn.addEventListener('click', exitMockExam);
    } else if (mockState.phase === 'break') {
      const btn = document.getElementById('startModule2Btn');
      if (btn) btn.addEventListener('click', startMockModule2);
    } else {
      const newBtn = document.getElementById('newMockBtn');
      if (newBtn) newBtn.addEventListener('click', () => { mockState.phase = 'intro'; renderMock(); });
      wireStatusButtons(shell, renderMock);
    }
  }

  async function downloadFile(filename, text) {
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const downloads = await window.claude.use('downloads');
        if (downloads) {
          await downloads.save({ filename, data: text });
          return true;
        }
      } catch (e) {
        // fall through to blob-link fallback (also covers "declined")
      }
    }
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  }

  function wireProgress() {
    const exportBtn = document.getElementById('exportProgressBtn');
    if (exportBtn) exportBtn.addEventListener('click', () => {
      const payload = {
        app: 'sat-qbank-progress',
        version: 1,
        exportedAt: new Date().toISOString(),
        progress: state.progress,
      };
      const date = new Date().toISOString().slice(0, 10);
      downloadFile(`sat-progress-${date}.json`, JSON.stringify(payload, null, 2));
    });

    const importBtn = document.getElementById('importProgressBtn');
    const importFile = document.getElementById('importProgressFile');
    if (importBtn && importFile) {
      importBtn.addEventListener('click', () => importFile.click());
      importFile.addEventListener('change', () => {
        const file = importFile.files && importFile.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            const incoming = parsed && typeof parsed === 'object' ? parsed.progress : null;
            if (!incoming || typeof incoming !== 'object') {
              alert('This file doesn\'t look like a progress export.');
              return;
            }
            state.progress = Object.assign({}, state.progress, incoming);
            saveProgress();
            renderFilters();
            renderBrowse();
            renderProgress();
            renderReview();
          } catch (e) {
            alert('Could not read that file as progress JSON.');
          }
        };
        reader.readAsText(file);
        importFile.value = '';
      });
    }

    const resetBtn = document.getElementById('resetProgressBtn');
    if (resetBtn) resetBtn.addEventListener('click', () => {
      if (!confirm('Clear all "complete" and "to review" marks? This can\'t be undone unless you\'ve exported a backup.')) return;
      state.progress = {};
      saveProgress();
      renderFilters();
      renderBrowse();
      renderProgress();
      renderReview();
    });
  }

      const panel = document.getElementById('reviewPanel');
      const closeBtn = document.getElementById('reviewPanelClose');
      if (closeBtn) closeBtn.addEventListener('click', () => { state.reviewOpenQuestion = null; renderReview(); });
      wireDetail(openQ, renderReview, panel);
      requestAnimationFrame(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }

    const practiceBtn = document.getElementById('reviewPracticeBtn');
    if (practiceBtn) practiceBtn.addEventListener('click', () => {
      practiceState.statuses = new Set(['review']);
      practiceState.categories = new Set();
      practiceState.skills = new Set();
      practiceState.difficulties = new Set();
      practiceState.shuffle = false;
      practiceState.questions = practicePool();
      practiceState.index = 0;
      practiceState.phase = practiceState.questions.length ? 'session' : 'config';

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab[data-view="practice"]').classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-practice').classList.add('active');
      renderPractice();
    });
  }

  renderStats();
  renderFilters();
  renderBrowse();
  renderPractice();
  renderTest();
  renderMock();
  renderProgress();
  renderReview();
})();
</script>
