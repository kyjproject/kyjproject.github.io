            Your answer: <strong>${yours || '—'}</strong>${!isCorrect ? ` &nbsp;&middot;&nbsp; Correct: <strong>${q.correct_answer}</strong>` : ''}
          </div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px;">${escapeHtml(q.rationale_by_choice[q.correct_answer] || '')}</div>
          ${statusButtonsHtml(q)}
        </div>`;
    }).join('');

    return `
      <div class="results-summary">
        <div class="score">${correct}/${total}</div>
        <div class="score-sub">${pct}% correct</div>
        <div style="max-width:280px; margin:18px auto 0; text-align:left;">${skillRows}</div>
        <button class="btn" id="retakeBtn" style="margin-top:18px;">New test</button>
      </div>
      <h3 style="font-family:var(--serif); font-size:16px; margin:0 0 10px;">Review</h3>
      ${reviewHtml}`;
  }

  // Advances to the next question (restarting the per-question timer) or,
  // on the last question, submits the test — shared by the timer's
  // strict-mode expiry and could equally be called from a "time's up, next"
  // control if one's ever added.
  function testAdvanceOrSubmit() {
    if (testState.index < testState.questions.length - 1) {
      testState.index++;
      qtimerStart(testState, 'testTimer', testTimerExpire);
      renderTest();
    } else {
      qtimerClear(testState);
      testState.phase = 'results';
      renderTest();
    }
  }

  function testTimerExpire() {
    if (testState.timerStrict) testAdvanceOrSubmit();
    else renderTest(); // flexible: just show the expired badge, let the user continue
  }

  function wireTest() {
    const shell = document.getElementById('testShell');
    if (testState.phase === 'config') {
      wireScopeChips(shell, testState, renderTest);
      wireTimedModeConfig(shell, testState, 'test', renderTest);
      const startBtn = document.getElementById('startTestBtn');
      if (startBtn) startBtn.addEventListener('click', () => {
        const countInput = document.getElementById('testCount');
        const n = Math.max(1, parseInt(countInput.value, 10) || 10);
        const pool = testPool();
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        testState.questions = shuffled.slice(0, Math.min(n, shuffled.length));
        testState.index = 0;
        testState.answers = {};
        testState.phase = 'quiz';
        qtimerStart(testState, 'testTimer', testTimerExpire);
        renderTest();
      });
    } else if (testState.phase === 'quiz') {
      const q = testState.questions[testState.index];
      shell.querySelectorAll('.choice[data-letter]').forEach(el => {
        el.addEventListener('click', () => {
          testState.answers[q.id] = el.dataset.letter;
          renderTest();
        });
      });
      const prevBtn = document.getElementById('prevBtn');
      if (prevBtn) prevBtn.addEventListener('click', () => { testState.index--; qtimerStart(testState, 'testTimer', testTimerExpire); renderTest(); });
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) nextBtn.addEventListener('click', () => { testState.index++; qtimerStart(testState, 'testTimer', testTimerExpire); renderTest(); });
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) submitBtn.addEventListener('click', () => { qtimerClear(testState); testState.phase = 'results'; renderTest(); });
    } else {
      const retakeBtn = document.getElementById('retakeBtn');
      if (retakeBtn) retakeBtn.addEventListener('click', () => { qtimerClear(testState); testState.phase = 'config'; renderTest(); });
      wireStatusButtons(shell, renderTest);
    }
  }

  // ---------- Practice (pick a scope, then work questions one at a time in detail) ----------
  function practicePool() { return filterPool(practiceState); }

  function renderPractice() {
    const shell = document.getElementById('practiceShell');
    shell.innerHTML = practiceState.phase === 'config' ? practiceConfigHtml() : practiceSessionHtml();
    wirePractice();
  }

  function practiceConfigHtml() {
    const pool = practicePool();
    return `
      <div class="config-card">
        <h2>Build a practice set</h2>
        <p class="lede">${pool.length} question${pool.length === 1 ? '' : 's'} available with the filters below. Work through them one at a time — pick a choice, submit to check it, or reveal the answer whenever you want.</p>
        <div class="config-row">
          <label>Scope — status (leave empty for all)</label>
          <div class="chip-row">${statusChipsHtml(practiceState)}</div>
        </div>
        <div class="config-row">
          <label>Category (leave empty for all)</label>
          <div class="chip-row">${categoryChipsHtml(practiceState)}</div>
        </div>
        <div class="config-row">
          <label>Skill (leave empty for all)</label>
          <div class="chip-row">${skillChipsHtml(practiceState)}</div>
        </div>
        <div class="config-row">
          <label>Difficulty (leave empty for all)</label>
          <div class="chip-row">${difficultyChipsHtml(practiceState)}</div>
        </div>
        <div class="config-row" style="margin-bottom:6px;">
          <label class="filter-opt" style="padding:0;">
            <input type="checkbox" id="practiceShuffle" ${practiceState.shuffle ? 'checked' : ''} />
            <span>Shuffle order</span>
          </label>
        </div>
        ${timedModeConfigHtml(practiceState, 'practice')}
        <button class="btn btn-accent" id="startPracticeBtn" ${pool.length ? '' : 'disabled'} style="margin-top:8px;">Start practice (${pool.length})</button>
      </div>`;
  }

  function practiceSessionHtml() {
    const q = practiceState.questions[practiceState.index];
    const total = practiceState.questions.length;
    const pct = Math.round((practiceState.index / total) * 100);
    return `
      ${timerTopbarHtml(practiceState, 'practiceTimer')}
      <div class="quiz-progress">
        <span>Question ${practiceState.index + 1} of ${total}</span>
        <button class="btn" id="practiceEndBtn" style="padding:4px 10px; font-size:12px;">End session</button>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="quiz-card">
        <div class="quiz-tags">
          <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
          <span class="cat-tag">${escapeHtml(q.category)}</span>
          <span class="qid" style="align-self:center;" data-copy-id="${escapeHtml(q.shortId)}" title="Click to copy ${escapeHtml(q.shortId)}">${escapeHtml(q.shortId)}</span>
          <span class="qskill" style="margin:0; align-self:center;">${escapeHtml(q.skill)}</span>
          <button class="id-chip" data-copy-id="${escapeHtml(q.id)}" title="Click to copy ID">${escapeHtml(q.id)}</button>
        </div>
        ${qDetailHtml(q, { bare: true })}
        <div class="quiz-nav">
          <button class="btn" id="practicePrevBtn" ${practiceState.index === 0 ? 'disabled' : ''}>Previous</button>
          ${practiceState.index === total - 1
            ? `<button class="btn btn-accent" id="practiceFinishBtn">Finish</button>`
            : `<button class="btn btn-accent" id="practiceNextBtn">Next</button>`}
        </div>
      </div>`;
  }

  // Mirrors testAdvanceOrSubmit: on the timer running out in strict mode,
  // move to the next question (restarting the timer), or end the session on
  // the last question — same as clicking Next / Finish by hand.
  function practiceAdvanceOrFinish() {
    if (practiceState.index < practiceState.questions.length - 1) {
      practiceState.index++;
      qtimerStart(practiceState, 'practiceTimer', practiceTimerExpire);
      renderPractice();
    } else {
      qtimerClear(practiceState);
      practiceState.phase = 'config';
      renderPractice();
    }
  }

  function practiceTimerExpire() {
    if (practiceState.timerStrict) practiceAdvanceOrFinish();
    else renderPractice();
  }

  function wirePractice() {
    const shell = document.getElementById('practiceShell');
    if (practiceState.phase === 'config') {
      wireScopeChips(shell, practiceState, renderPractice);
      wireTimedModeConfig(shell, practiceState, 'practice', renderPractice);
      const shuffleBox = document.getElementById('practiceShuffle');
      if (shuffleBox) shuffleBox.addEventListener('change', () => { practiceState.shuffle = shuffleBox.checked; });
      const startBtn = document.getElementById('startPracticeBtn');
      if (startBtn) startBtn.addEventListener('click', () => {
        let pool = practicePool();
        if (practiceState.shuffle) pool = [...pool].sort(() => Math.random() - 0.5);
        practiceState.questions = pool;
        practiceState.index = 0;
        practiceState.phase = 'session';
        qtimerStart(practiceState, 'practiceTimer', practiceTimerExpire);
        renderPractice();
      });
    } else {
      const q = practiceState.questions[practiceState.index];
      wireDetail(q, renderPractice, shell);
      const prevBtn = document.getElementById('practicePrevBtn');
      if (prevBtn) prevBtn.addEventListener('click', () => { practiceState.index--; qtimerStart(practiceState, 'practiceTimer', practiceTimerExpire); renderPractice(); });
      const nextBtn = document.getElementById('practiceNextBtn');
      if (nextBtn) nextBtn.addEventListener('click', () => { practiceState.index++; qtimerStart(practiceState, 'practiceTimer', practiceTimerExpire); renderPractice(); });
      const finishBtn = document.getElementById('practiceFinishBtn');
      if (finishBtn) finishBtn.addEventListener('click', () => { qtimerClear(practiceState); practiceState.phase = 'config'; renderPractice(); });
      const endBtn = document.getElementById('practiceEndBtn');
      if (endBtn) endBtn.addEventListener('click', () => { qtimerClear(practiceState); practiceState.phase = 'config'; renderPractice(); });
    }
  }

  // ---------- Mock Exam (full-length, mirrors the real Digital SAT R&W structure) ----------
  // Two modules of 27 questions (54 total), 32 minutes each. Module 1 draws a
  // medium-weighted mix from every skill; Module 2 adapts — harder-weighted if
  // Module 1 went well, easier-weighted if it didn't — approximating (not
  // replicating; College Board's real routing is IRT-based) the real digital
  // SAT's multistage-adaptive design. Skill order/counts below mirror the
  // official 4-domain, 10-skill blueprint and its published per-test count
  // ranges (Information and Ideas 12-14, Craft and Structure 13-15, Expression
  // of Ideas 8-12, Standard English Conventions 11-15, out of 54) — Words in
  // Context leads each module, matching the real test's usual opening block.
  const MOCK_MODULE_SECONDS = 32 * 60;
  const MOCK_PASS_THRESHOLD = 0.6; // module-1 accuracy at/above this routes module 2 to the harder pool

  const MOCK_BLUEPRINT = [
    { category: 'Vocab', skill: 'Words in Context', m1: 4, m2: 4 },
    { category: 'Functions', skill: 'Text Structure and Purpose', m1: 2, m2: 3 },
    { category: 'Cross-Text', skill: 'Cross-Text Connections', m1: 1, m2: 1 },
    { category: 'Main Idea', skill: 'Central Ideas and Details', m1: 2, m2: 2 },
    { category: 'Command of Evidence', skill: 'Command of Evidence', m1: 3, m2: 3 },
    { category: 'Inferences', skill: 'Inferences', m1: 2, m2: 2 },
    { category: 'Grammar', skill: 'Boundaries', m1: 4, m2: 3 },
    { category: 'Grammar', skill: 'Form, Structure, and Sense', m1: 3, m2: 3 },
    { category: 'Transitions', skill: 'Transitions', m1: 3, m2: 3 },
    { category: 'Notes', skill: 'Rhetorical Synthesis', m1: 3, m2: 3 },
  ];
  const SKILL_DOMAIN = {
    'Central Ideas and Details': 'Information and Ideas',
    'Command of Evidence': 'Information and Ideas',
    'Inferences': 'Information and Ideas',
    'Words in Context': 'Craft and Structure',
    'Text Structure and Purpose': 'Craft and Structure',
    'Cross-Text Connections': 'Craft and Structure',
    'Rhetorical Synthesis': 'Expression of Ideas',
    'Transitions': 'Expression of Ideas',
    'Boundaries': 'Standard English Conventions',
    'Form, Structure, and Sense': 'Standard English Conventions',
  };
  const MOCK_DOMAIN_ORDER = ['Information and Ideas', 'Craft and Structure', 'Expression of Ideas', 'Standard English Conventions'];

  const MOCK_WEIGHTS_M1 = { Easy: 0.25, Medium: 0.5, Hard: 0.25 };
  const MOCK_WEIGHTS_HARDER = { Easy: 0.1, Medium: 0.35, Hard: 0.55 };
  const MOCK_WEIGHTS_EASIER = { Easy: 0.5, Medium: 0.4, Hard: 0.1 };
  const WEIGHT_PRESETS = { balanced: MOCK_WEIGHTS_M1, harder: MOCK_WEIGHTS_HARDER, easier: MOCK_WEIGHTS_EASIER };
  const WEIGHT_PRESET_LABELS = { balanced: 'Balanced', harder: 'Harder-weighted', easier: 'Easier-weighted', custom: 'Custom' };

  // Difficulty-mix config per module slot ('m1' | 'm2harder' | 'm2easier') —
  // either a named preset above or 'custom' with its own Easy/Medium/Hard
  // values (percentages, needn't sum to 100 — normalized before use).
  function defaultWeightConfig() {
    return {
      m1: { preset: 'balanced', custom: { Easy: 25, Medium: 50, Hard: 25 } },
      m2harder: { preset: 'harder', custom: { Easy: 10, Medium: 35, Hard: 55 } },
      m2easier: { preset: 'easier', custom: { Easy: 50, Medium: 40, Hard: 10 } },
    };
  }

  function normalizeWeights(w) {
    const sum = (w.Easy || 0) + (w.Medium || 0) + (w.Hard || 0);
    if (sum <= 0) return MOCK_WEIGHTS_M1;
    return { Easy: w.Easy / sum, Medium: w.Medium / sum, Hard: w.Hard / sum };
  }

  function resolveWeightConfig(key) {
    const cfg = mockState.weightConfig[key];
    if (cfg.preset === 'custom') return normalizeWeights(cfg.custom);
    return WEIGHT_PRESETS[cfg.preset];
  }

  function cloneDefaultBlueprint() {
    return MOCK_BLUEPRINT.map(r => ({ ...r }));
  }

  // Redistributes `field` ('m1' | 'm2') across mockState.blueprint to sum to
  // exactly `target`, keeping each row's share proportional to its slot in
  // the *official* blueprint (so the shape stays realistic even after
  // repeated rescales) — largest-remainder rounding guarantees the sum lands
  // exactly on target rather than drifting by a question or two.
  function scaleBlueprintField(field, target) {
    const rows = mockState.blueprint;
    target = Math.max(0, target);
    const totalWeight = MOCK_BLUEPRINT.reduce((s, r) => s + r[field], 0);
    const raw = rows.map((r, i) => totalWeight ? (MOCK_BLUEPRINT[i][field] / totalWeight) * target : target / rows.length);
    const floors = raw.map(Math.floor);
    const used = floors.reduce((a, b) => a + b, 0);
    const remainder = target - used;
    const order = raw.map((v, i) => ({ i, frac: v - Math.floor(v) })).sort((a, b) => b.frac - a.frac);
    const result = [...floors];
    for (let k = 0; k < remainder && k < order.length; k++) result[order[k].i]++;
    rows.forEach((r, i) => { r[field] = Math.max(0, result[i]); });
  }

  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Picks `n` questions from `pool` biased toward `weights` (a difficulty ->
  // fraction map), without replacement. Buckets by difficulty, takes a
  // weight-proportional slice of each, then backfills from whatever's left
  // over (any difficulty) if a bucket came up short — so a thin bucket (e.g.
  // few Hard Cross-Text questions) degrades gracefully instead of returning
  // fewer than n.
  function pickWeighted(pool, n, weights) {
    const buckets = { Easy: [], Medium: [], Hard: [] };
    pool.forEach(q => buckets[q.difficulty_label].push(q));
    Object.values(buckets).forEach(shuffleInPlace);

    const order = ['Easy', 'Medium', 'Hard'];
    const targets = {};
    let remaining = n;
    order.forEach((d, i) => {
      const t = (i === order.length - 1) ? remaining : Math.min(remaining, Math.round(n * weights[d]));
      targets[d] = Math.max(0, t);
      remaining -= targets[d];
    });

    const picked = [];
    order.forEach(d => picked.push(...buckets[d].splice(0, targets[d])));
    if (picked.length < n) {
      const leftover = shuffleInPlace([...buckets.Easy, ...buckets.Medium, ...buckets.Hard]);
      picked.push(...leftover.slice(0, n - picked.length));
    }
    return picked.slice(0, n);
  }

  // `blueprint` is an array of {category, skill, m1, m2} (mockState.blueprint,
  // user-editable). `statuses` (a Set, may be empty) additionally scopes each
  // skill's pool to matching question status (e.g. "Incomplete" only) — if a
  // skill doesn't have enough matching questions to hit its count, that one
  // skill quietly falls back to its full (status-unfiltered) pool rather than
  // shrinking the module below the requested count.
  function buildMockModule(blueprint, countField, weights, excludeIds, statuses) {
    const used = new Set(excludeIds || []);
    const questions = [];
    const normWeights = normalizeWeights(weights);
    blueprint.forEach(row => {
      const n = row[countField];
      if (!n) return;
      const base = QUESTIONS.filter(q => q.category === row.category && q.skill === row.skill && !used.has(q.id));
      let pool = base;
      if (statuses && statuses.size) {
        const filtered = base.filter(q => statuses.has(questionStatus(q)));
        if (filtered.length >= n) pool = filtered;
      }
      const picked = pickWeighted(pool, n, normWeights);
      picked.forEach(q => used.add(q.id));
      questions.push(...picked);
    });
    return questions;
  }

  // ---------- Mock exam history persistence ----------
  // Each completed exam (both modules) is saved as a compact record — question
  // ids + your answers, not full question objects — so history stays cheap
  // and always reflects the current question bank on replay. Same
  // localStorage-as-best-effort pattern as progress/tags, and deliberately
  // its own key: clearing mock history never touches state.progress (the
  // per-question complete/review marks), since those are separate concerns.
  const MOCK_HISTORY_KEY = 'sat_qbank_mock_history_v1';
  const MOCK_HISTORY_LIMIT = 50;

  function loadMockHistory() {
    try {
      const raw = localStorage.getItem(MOCK_HISTORY_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveMockHistory() {
    try {
      localStorage.setItem(MOCK_HISTORY_KEY, JSON.stringify(mockState.history));
    } catch (e) {
      // storage unavailable/full — history still lives in memory for this session
    }
  }

  // Reconstructs a results-view-shaped object from a saved history record by
  // looking question ids back up in the live QUESTIONS array — a question
  // deleted from a future rebuild of the bank just quietly drops out.
  function resolveMockAttempt(attempt) {
    const byId = id => QUESTIONS.find(q => q.id === id);
    return {
      module1Questions: attempt.module1Ids.map(byId).filter(Boolean),
      module2Questions: attempt.module2Ids.map(byId).filter(Boolean),
      answers: attempt.answers || {},
      module1Correct: attempt.module1Correct,
      module1Pct: attempt.module1Pct,
      routedHarder: attempt.routedHarder,
      mode: attempt.mode || 'adaptive', // older saved records predate mode tracking — treat as adaptive
    };
  }

  const mockState = {
    phase: 'intro', // intro | module1 | break | module2 | results | historyResults
    module1Questions: [],
    module2Questions: [],
    index: 0,
    answers: {}, // qid -> letter, shared across both modules
    timeLeft: 0,
    timerId: null,
    module1Correct: null,
    module1Pct: null,
    routedHarder: null,
    history: loadMockHistory(), // past completed exams, most recent first
    viewingAttemptId: null, // history record id being viewed read-only (phase 'historyResults')

    // ---- config (set on the 'intro' screen, read when Start is clicked) ----
    mode: 'adaptive', // adaptive (M1 -> routed M2) | module1 (M1 only) | module2 (M2 only, explicit pool)
    module2Pool: 'harder', // 'harder' | 'easier' — which pool Module-2-only draws from
    passThreshold: MOCK_PASS_THRESHOLD, // adaptive mode: M1 accuracy at/above this routes to the harder pool
    statuses: new Set(), // scope the question pool to these statuses (empty = no scoping); per-skill fallback to full pool if too thin
    blueprint: cloneDefaultBlueprint(), // editable per-skill {category, skill, m1, m2} counts
    weightConfig: defaultWeightConfig(), // per-slot ('m1' | 'm2harder' | 'm2easier') difficulty-mix preset/custom
    qtimer: { timed: false, timerSeconds: 60, timerStrict: true, timeLeft: 0, timerId: null, expired: false }, // opt-in per-question timer, layered alongside the module clock
  };

  function formatMockTime(seconds) {
    const s = Math.max(0, Math.ceil(seconds));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  function mockClearTimer() {
    if (mockState.timerId) {
      clearInterval(mockState.timerId);
      mockState.timerId = null;
    }
  }

  function mockStartTimer(onExpire) {
    mockClearTimer();
    mockState.timerId = setInterval(() => {
      mockState.timeLeft -= 1;
      const el = document.getElementById('mockTimer');
      if (el) {
        el.textContent = formatMockTime(mockState.timeLeft);
        el.classList.toggle('low-time', mockState.timeLeft <= 60);
      }
      if (mockState.timeLeft <= 0) {
        mockClearTimer();
        onExpire();
      }
    }, 1000);
  }

  function mockScoreModule(questions, answers) {
    const ans = answers || mockState.answers;
    let correct = 0;
    questions.forEach(q => { if (ans[q.id] === q.correct_answer) correct++; });
    return { correct, total: questions.length, pct: questions.length ? correct / questions.length : 0 };
  }

  // Per-question timer expiry, shared by both modules — strict mode advances
  // (or submits the module on the last question), flexible mode just shows
  // the expired badge and lets the user keep going at their own pace. This
  // runs alongside the module-level 32-minute clock (mockStartTimer above),
  // not instead of it.
  function mockQuestionAdvanceOrSubmit() {
    const questions = mockState.phase === 'module1' ? mockState.module1Questions : mockState.module2Questions;
    if (mockState.index < questions.length - 1) {
      mockState.index++;
      qtimerStart(mockState.qtimer, 'mockQTimer', mockQuestionTimerExpire);
      renderMock();
    } else if (mockState.phase === 'module1') {
      submitMockModule1();
    } else {
      submitMockModule2();
    }
  }

  function mockQuestionTimerExpire() {
    if (mockState.qtimer.timerStrict) mockQuestionAdvanceOrSubmit();
    else renderMock();
  }

  // Dispatches to the right first phase based on mockState.mode, using the
  // config set on the 'intro' screen (blueprint counts, weight mix, status
  // scope, pass threshold, per-question timer).
  function startMockAttempt() {
    mockClearTimer();
    qtimerClear(mockState.qtimer);
    mockState.index = 0;
    mockState.answers = {};
    mockState.module1Questions = [];
    mockState.module2Questions = [];
    mockState.module1Correct = null;
    mockState.module1Pct = null;
    mockState.routedHarder = null;
    mockState.timeLeft = MOCK_MODULE_SECONDS;

    if (mockState.mode === 'module2') {
      const key = mockState.module2Pool === 'harder' ? 'm2harder' : 'm2easier';
      mockState.module2Questions = buildMockModule(mockState.blueprint, 'm2', resolveWeightConfig(key), [], mockState.statuses);
      mockState.routedHarder = mockState.module2Pool === 'harder';
      mockState.phase = 'module2';
      renderMock();
      mockStartTimer(submitMockModule2);
    } else {
      mockState.module1Questions = buildMockModule(mockState.blueprint, 'm1', resolveWeightConfig('m1'), [], mockState.statuses);
      mockState.phase = 'module1';
      renderMock();
      mockStartTimer(submitMockModule1);
    }
    qtimerStart(mockState.qtimer, 'mockQTimer', mockQuestionTimerExpire);
  }

  function submitMockModule1() {
    mockClearTimer();
    qtimerClear(mockState.qtimer);
    const score = mockScoreModule(mockState.module1Questions);
    mockState.module1Correct = score.correct;
    mockState.module1Pct = score.pct;
    if (mockState.mode === 'module1') {
      mockState.phase = 'results';
      saveMockAttempt();
    } else {
      mockState.routedHarder = score.pct >= mockState.passThreshold;
      mockState.phase = 'break';
    }
    renderMock();
  }

  function startMockModule2() {
    const usedIds = mockState.module1Questions.map(q => q.id);
    const key = mockState.routedHarder ? 'm2harder' : 'm2easier';
    mockState.module2Questions = buildMockModule(mockState.blueprint, 'm2', resolveWeightConfig(key), usedIds, mockState.statuses);
    mockState.index = 0;
    mockState.timeLeft = MOCK_MODULE_SECONDS;
    mockState.phase = 'module2';
    renderMock();
    mockStartTimer(submitMockModule2);
    qtimerStart(mockState.qtimer, 'mockQTimer', mockQuestionTimerExpire);
  }

  function submitMockModule2() {
    mockClearTimer();
    qtimerClear(mockState.qtimer);
    mockState.phase = 'results';
    saveMockAttempt();
    renderMock();
  }

  function saveMockAttempt() {
    const attempt = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      completedAt: new Date().toISOString(),
      mode: mockState.mode,
      module1Ids: mockState.module1Questions.map(q => q.id),
      module2Ids: mockState.module2Questions.map(q => q.id),
      answers: { ...mockState.answers },
      module1Correct: mockState.module1Correct,
      module1Pct: mockState.module1Pct,
      routedHarder: mockState.routedHarder,
    };
    mockState.history = [attempt, ...mockState.history].slice(0, MOCK_HISTORY_LIMIT);
    saveMockHistory();
    renderStats();
  }

  function viewMockAttempt(id) {
    const attempt = mockState.history.find(a => a.id === id);
    if (!attempt) return;
    mockClearTimer();
    mockState.viewingAttemptId = id;
    mockState.phase = 'historyResults';
    renderMock();
  }

  function exitMockExam() {
    if (!confirm('Exit this mock exam? Your progress on it will be lost.')) return;
    mockClearTimer();
    qtimerClear(mockState.qtimer);
    mockState.phase = 'intro';
    renderMock();
  }

  function formatAttemptDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
        + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    } catch (e) {
      return iso;
    }
  }

  // Compact score readout for a history row, computed straight from the
  // saved ids/answers rather than needing the full resolved attempt.
  // `rw` (the composite R&W estimate) only makes sense for a full adaptive
  // attempt — its curve is calibrated against the 54-question exam, so a
  // Module-1-only or Module-2-only attempt reports null instead of a
  // misleading number.
  function mockAttemptSummary(attempt) {
    const ids = [...attempt.module1Ids, ...attempt.module2Ids];
    let correct = 0;
    ids.forEach(id => {
      const q = QUESTIONS.find(x => x.id === id);
      if (q && attempt.answers[id] === q.correct_answer) correct++;
    });
    const mode = attempt.mode || 'adaptive';
    const isFull = mode === 'adaptive' && attempt.module1Ids.length > 0 && attempt.module2Ids.length > 0;
    return { correct, total: ids.length, rw: isFull ? estimateRWScore(correct, attempt.routedHarder) : null, mode };
  }

  // Title prefix per mode; attempts are numbered chronologically within
  // their own mode (a Module-1-only attempt doesn't count against "Full
  // Mock Test" numbering, and vice versa).
  const MOCK_HISTORY_MODE_TITLES = { adaptive: 'Full Mock Test', module1: 'Module 1 Mock', module2: 'Module 2 Mock' };

  function mockHistoryListHtml() {
    if (!mockState.history.length) return '';
    const modeSeen = {};
    // history is most-recent-first; walk oldest-to-newest to assign
    // per-mode attempt numbers, then render in the original (newest-first) order.
    const numByAttemptId = {};
    mockState.history.slice().reverse().forEach(a => {
      const mode = a.mode || 'adaptive';
      modeSeen[mode] = (modeSeen[mode] || 0) + 1;
      numByAttemptId[a.id] = modeSeen[mode];
    });
    const rows = mockState.history.map(a => {
      const s = mockAttemptSummary(a);
      const mode = a.mode || 'adaptive';
      const title = `${MOCK_HISTORY_MODE_TITLES[mode] || 'Mock Exam'} ${numByAttemptId[a.id]}`;
      const scoreBlock = s.rw != null
        ? `<div class="mh-converted">${s.rw}<span class="mh-unit">/800 R&amp;W</span></div>
           <div class="mh-sub">${s.correct}/${s.total} correct</div>`
        : `<div class="mh-converted">${s.correct}/${s.total}</div>
           <div class="mh-sub">${Math.round((s.correct / (s.total || 1)) * 100)}% correct</div>`;
      return `
        <div class="mock-history-row" data-view-attempt="${a.id}">
          <div class="mh-main">
            <div class="mh-title">${escapeHtml(title)}</div>
            <div class="mh-date">${escapeHtml(formatAttemptDate(a.completedAt))}</div>
          </div>
          <div class="mh-score-block">${scoreBlock}</div>
          <button class="icon-close-btn" data-delete-attempt="${a.id}" title="Delete this record" aria-label="Delete this record">&#10005;</button>
        </div>`;
    }).join('');
    return `
      <div class="config-card" style="margin-top:16px;">
        <div class="cat-progress-row" style="margin-bottom:4px;">
          <span class="name">Past mock exams (${mockState.history.length})</span>
          <button class="btn" id="clearMockHistoryBtn" style="font-size:11.5px; padding:4px 10px;">Clear mock history</button>
        </div>
        <p style="font-size:11.5px; color:var(--ink-faint); margin:0 0 8px;">Saved automatically in this browser. Clearing it only removes these saved results — your per-question complete/review marks aren't touched.</p>
        ${rows}
      </div>`;
  }

  const MOCK_MODE_LABELS = {
    adaptive: 'Adaptive full exam',
    module1: 'Module 1 only',
    module2: 'Module 2 only',
  };

  function mockModeChipsHtml() {
    return Object.entries(MOCK_MODE_LABELS).map(([m, label]) =>
      `<button class="chip ${mockState.mode === m ? 'on' : ''}" data-mock-mode="${m}">${label}</button>`
    ).join('');
  }

  function mockModuleDescHtml() {
    if (mockState.mode === 'module1') return `Module 1 only — ${MOCK_MODULE_SECONDS / 60} minutes, no Module 2, no adaptive routing. Good for a quick difficulty-balanced check-in.`;
    if (mockState.mode === 'module2') return `Module 2 only — skips Module 1 and its routing; you pick the pool directly below (this is also how to drill the hard pool on demand).`;
    return `Module 1 routes into Module 2 based on your Module 1 accuracy — a stronger pool if you scored well, a gentler one if you didn't — approximating (not replicating) the real digital SAT's multistage-adaptive design.`;
  }

  function mockModule2PoolChipsHtml() {
    return `
      <div class="config-row">
        <label>Module 2 pool</label>
        <div class="chip-row">
          <button class="chip ${mockState.module2Pool === 'harder' ? 'on' : ''}" data-mock-pool="harder">Harder</button>
          <button class="chip ${mockState.module2Pool === 'easier' ? 'on' : ''}" data-mock-pool="easier">Easier</button>
        </div>
      </div>`;
  }

  // Editable per-skill question-count table backing mockState.blueprint.
  // `showM1`/`showM2` hide whichever column doesn't apply to the current mode.
  function mockBlueprintTableHtml(showM1, showM2) {
    const rows = mockState.blueprint.map((r, i) => {
      const poolSize = QUESTIONS.filter(q => q.category === r.category && q.skill === r.skill &&
        (!mockState.statuses.size || mockState.statuses.has(questionStatus(q)))).length;
      return `<tr>
        <td>${escapeHtml(r.skill)}</td>
        <td>${escapeHtml(SKILL_DOMAIN[r.skill])}</td>
        ${showM1 ? `<td><input type="number" class="mini-num-input" min="0" max="40" data-bp-idx="${i}" data-bp-field="m1" value="${r.m1}"></td>` : ''}
        ${showM2 ? `<td><input type="number" class="mini-num-input" min="0" max="40" data-bp-idx="${i}" data-bp-field="m2" value="${r.m2}"></td>` : ''}
        <td class="bp-avail">${poolSize} in bank</td>
      </tr>`;
    }).join('');
    const m1Total = mockState.blueprint.reduce((s, r) => s + r.m1, 0);
    const m2Total = mockState.blueprint.reduce((s, r) => s + r.m2, 0);
    return `
      <div class="config-row">
        <div class="bp-table-head">
          <label>Question mix by skill</label>
          <div class="bp-actions">
            <button type="button" class="btn" id="mockResetBlueprintBtn" style="font-size:11px; padding:4px 9px;">Reset to official (27)</button>
          </div>
        </div>
        <table class="mock-blueprint-table bp-editable">
          <thead><tr><th>Skill</th><th>Domain</th>${showM1 ? '<th>Module&nbsp;1</th>' : ''}${showM2 ? '<th>Module&nbsp;2</th>' : ''}<th>Pool</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr>
            <td colspan="2">Total</td>
            ${showM1 ? `<td class="bp-total" id="mockM1Total">${m1Total}</td>` : ''}
            ${showM2 ? `<td class="bp-total" id="mockM2Total">${m2Total}</td>` : ''}
            <td></td>
          </tr></tfoot>
        </table>
        <div class="config-subrow scale-row">
          ${showM1 ? `<span>Module 1 total &rarr;</span><input type="number" class="mini-num-input" id="mockScaleM1" min="0" max="200" value="${m1Total}"><button type="button" class="btn" id="mockScaleM1Btn" style="font-size:11px; padding:4px 9px;">Apply</button>` : ''}
          ${showM2 ? `<span>Module 2 total &rarr;</span><input type="number" class="mini-num-input" id="mockScaleM2" min="0" max="200" value="${m2Total}"><button type="button" class="btn" id="mockScaleM2Btn" style="font-size:11px; padding:4px 9px;">Apply</button>` : ''}
        </div>
        <p class="bp-hint">Edit any count directly, or set a target total and Apply to redistribute proportionally. If a skill runs short of "in bank" (especially once a status filter below narrows it), that skill quietly backfills from its full pool so the module still hits your requested count.</p>
      </div>`;
  }

  // Reusable difficulty-mix picker for one weight slot ('m1' | 'm2harder' |
  // 'm2easier') — a preset chip row, plus editable Easy/Medium/Hard fields
  // when "Custom" is picked (values are relative, not required to sum to 100).
  function weightPickerHtml(key, label) {
    const cfg = mockState.weightConfig[key];
    const chips = Object.keys(WEIGHT_PRESET_LABELS).map(p =>
      `<button class="chip ${cfg.preset === p ? 'on' : ''}" data-weight-key="${key}" data-weight-preset="${p}">${WEIGHT_PRESET_LABELS[p]}</button>`
    ).join('');
    const customRow = cfg.preset === 'custom' ? `
      <div class="weight-custom-row">
        ${['Easy', 'Medium', 'Hard'].map(d => `
          <label>${d}
            <input type="number" class="mini-num-input" min="0" max="100" data-weight-key="${key}" data-weight-diff="${d}" value="${cfg.custom[d]}">
          </label>`).join('')}
        <span class="weight-pct-hint">relative weights — needn't sum to 100</span>
      </div>` : '';
    return `
      <div class="config-row">
        <label>${label}</label>
        <div class="chip-row">${chips}</div>
        ${customRow}
      </div>`;
  }

  function mockConfigHtml() {
    const showM1 = mockState.mode !== 'module2';
    const showM2 = mockState.mode !== 'module1';
    const startLabel = mockState.mode === 'module2'
      ? `Start Module 2 (${MOCK_MODULE_SECONDS / 60}:00)`
      : `Start Module 1 (${MOCK_MODULE_SECONDS / 60}:00)`;

    let weightSection = '';
    if (mockState.mode === 'adaptive') {
      weightSection = `
        ${weightPickerHtml('m1', 'Module 1 difficulty mix')}
        <div class="config-row">
          <label>Adaptive routing threshold</label>
          <div class="scale-row">
            <span>Route to the harder pool if Module 1 accuracy is at least</span>
            <input type="number" class="mini-num-input" id="mockPassThreshold" min="0" max="100" value="${Math.round(mockState.passThreshold * 100)}">
            <span>%</span>
          </div>
        </div>
        ${weightPickerHtml('m2harder', 'Module 2 — harder-pool mix')}
        ${weightPickerHtml('m2easier', 'Module 2 — easier-pool mix')}`;
    } else if (mockState.mode === 'module1') {
      weightSection = weightPickerHtml('m1', 'Module 1 difficulty mix');
    } else {
      weightSection = mockModule2PoolChipsHtml() + weightPickerHtml(mockState.module2Pool === 'harder' ? 'm2harder' : 'm2easier', 'Module 2 difficulty mix');
    }

    return `
      <div class="config-card">
        <h2>Mock Exam</h2>
        <p class="lede">${mockModuleDescHtml()}</p>
        <div class="config-row">
          <label>Mode</label>
          <div class="chip-row">${mockModeChipsHtml()}</div>
        </div>
        <div class="config-row">
          <label>Scope — status (leave empty for all)</label>
          <div class="chip-row">${statusChipsHtml(mockState)}</div>
        </div>
        ${mockBlueprintTableHtml(showM1, showM2)}
        ${weightSection}
        ${timedModeConfigHtml(mockState.qtimer, 'mockQ')}
        <button class="btn btn-accent" id="startMockBtn">${startLabel}</button>
      </div>
      ${mockHistoryListHtml()}`;
  }

  function mockQuizHtml(questions, moduleNum) {
    const q = questions[mockState.index];
    const total = questions.length;
    const answered = mockState.answers[q.id];
    const pct = Math.round((mockState.index / total) * 100);
    const choiceHtml = ['A', 'B', 'C', 'D'].map(letter => {
      let cls = 'choice';
      if (answered === letter) cls += ' choice-selected';
      return `<div class="${cls}" data-letter="${letter}">
        <span class="letter">${letter}</span>
        <div>${escapeHtml(q.choices[letter])}</div>
      </div>`;
    }).join('');
    const isLast = mockState.index === total - 1;
    const qt = mockState.qtimer;
    const moduleBadge = mockState.mode === 'adaptive' ? `Module ${moduleNum} of 2` : `Module ${moduleNum} (${mockState.mode === 'module1' ? 'Module 1 only' : 'Module 2 only'})`;

    return `
      <div class="mock-topbar">
        <span class="mock-module-badge">${moduleBadge}</span>
        <span class="mock-timer" id="mockTimer">${formatMockTime(mockState.timeLeft)}</span>
        ${qt.timed ? `<span class="mock-timer ${qt.expired ? 'low-time' : ''}" id="mockQTimer" title="Per-question timer">${formatMockTime(qt.timeLeft)}</span>` : ''}
        <button class="mock-exit-link" id="mockExitBtn">Exit mock exam</button>
      </div>
      ${qt.timed && qt.expired && !qt.timerStrict ? `<p style="font-size:12px; color:var(--ink-faint); margin:-8px 0 12px;">Question timer's up — keep going at your own pace.</p>` : ''}
      <div class="quiz-progress">
        <span>Question ${mockState.index + 1} of ${total}</span>
        <span>${Object.keys(mockState.answers).filter(id => questions.some(qq => qq.id === id)).length} answered</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="quiz-card">
        <div class="quiz-tags">
          <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
          <span class="cat-tag">${escapeHtml(q.skill)}</span>
          <span class="qid" style="align-self:center;" data-copy-id="${escapeHtml(q.shortId)}" title="Click to copy ${escapeHtml(q.shortId)}">${escapeHtml(q.shortId)}</span>
          <button class="id-chip" data-copy-id="${escapeHtml(q.id)}" title="Click to copy ID">${escapeHtml(q.id)}</button>
          <button class="btn" style="padding:4px 10px; font-size:12px;" data-copy-question-qid="${q.id}" title="${q.has_image ? 'Copies question text only — chart/table image not included' : 'Copy question text'}">Copy question</button>
        </div>
        ${questionImageHtml(q)}
        <div class="stem">${renderStemHtml(q.stem)}</div>
        <div class="prompt-line">${escapeHtml(q.prompt)}</div>
        <div class="choices">${choiceHtml}</div>
        <div class="quiz-nav">
          <button class="btn" id="mockPrevBtn" ${mockState.index === 0 ? 'disabled' : ''}>Previous</button>
          ${isLast
            ? `<button class="btn btn-accent" id="mockSubmitBtn">Submit Module ${moduleNum}</button>`
            : `<button class="btn btn-accent" id="mockNextBtn">Next</button>`}
        </div>
      </div>`;
  }

  function mockBreakHtml() {
    const answeredCount = mockState.module1Questions.filter(q => mockState.answers[q.id]).length;
    return `
      <div class="config-card" style="text-align:center;">
        <h2>Module 1 complete</h2>
        <p class="lede">${answeredCount} of ${mockState.module1Questions.length} questions answered. Take a breather — Module 2 is 27 more questions, 32 minutes, and its difficulty is calibrated based on Module 1. You'll see the full breakdown after Module 2.</p>
        <button class="btn btn-accent" id="startModule2Btn">Start Module 2 (32:00)</button>
      </div>`;
  }

  // One tile per question in a module, colored by outcome — a compact visual
  // scan of "what did I get in Module 1/2" mirroring the Progress tab's tile
  // grids. Hover (native title tooltip) surfaces the shortId, skill,
  // difficulty, and your-answer/correct-answer detail; clicking scrolls the
  // matching card into view down in Review instead of opening a second copy
  // of the detail inline (Review already shows everything, so the tile grid
  // stays purely a fast overview + jump-to-item).
  function mockModuleTilesHtml(questions, moduleLabel, data) {
    if (!questions.length) return '';
    let correctCount = 0;
    const tiles = questions.map(q => {
      const yours = data.answers[q.id];
      const status = !yours ? 'unanswered' : (yours === q.correct_answer ? 'correct' : 'incorrect');
      if (status === 'correct') correctCount++;
      const detail = status === 'unanswered' ? 'Not answered' :
        (status === 'correct' ? `Correct (${yours})` : `Incorrect — yours: ${yours}, correct: ${q.correct_answer}`);
      const title = `${q.shortId} — ${q.skill} — ${q.difficulty_label} — ${detail}`;
      return `<button class="qtile status-${status}" data-scroll-to="mock-review-${q.id}" title="${escapeHtml(title)}"></button>`;
    }).join('');
    return `
      <div class="mock-module-tiles-block">
        <div class="diff-subhead"><span>${escapeHtml(moduleLabel)}</span><span>${correctCount}/${questions.length} correct</span></div>
        <div class="qtile-grid">${tiles}</div>
      </div>`;
  }

  function mockResultsHtml(data, isHistory) {
    data = data || mockState;
    const all = [...data.module1Questions.map(q => ({ q, module: 1 })), ...data.module2Questions.map(q => ({ q, module: 2 }))];
    const total = all.length;
    let correct = 0;
    all.forEach(({ q }) => { if (data.answers[q.id] === q.correct_answer) correct++; });
    const m2Score = mockScoreModule(data.module2Questions, data.answers);
    const pct = total ? Math.round((correct / total) * 100) : 0;

    const byDomain = {};
    MOCK_DOMAIN_ORDER.forEach(d => { byDomain[d] = { c: 0, t: 0 }; });
    const bySkill = {};
    all.forEach(({ q }) => {
      const domain = SKILL_DOMAIN[q.skill] || q.domain;
      byDomain[domain] = byDomain[domain] || { c: 0, t: 0 };
      byDomain[domain].t++;
      bySkill[q.skill] = bySkill[q.skill] || { c: 0, t: 0 };
      bySkill[q.skill].t++;
      if (data.answers[q.id] === q.correct_answer) {
        byDomain[domain].c++;
        bySkill[q.skill].c++;
      }
    });

    const domainRows = MOCK_DOMAIN_ORDER.filter(d => byDomain[d].t).map(d =>
      `<div class="domain-breakdown-row"><span>${escapeHtml(d)}</span><span style="font-family:var(--mono);">${byDomain[d].c}/${byDomain[d].t}</span></div>`
    ).join('');
    const skillRows = Object.entries(bySkill).map(([s, v]) =>
      `<div style="display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; color:var(--ink-soft);">
        <span>${escapeHtml(s)}</span><span style="font-family:var(--mono);">${v.c}/${v.t}</span>
      </div>`).join('');

    const reviewHtml = all.map(({ q, module }, i) => {
      const yours = data.answers[q.id];
      const isCorrect = yours === q.correct_answer;
      return `
        <div class="review-item clickable" id="mock-review-${q.id}" data-id="${q.id}">
          <div class="row1">
            <span class="pill ${isCorrect ? 'pill-easy' : 'pill-hard'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>
            <span class="mock-module-badge" style="font-size:10px;">Module ${module}</span>
            <span class="${diffPillClass(q.difficulty_label)}">${q.difficulty_label}</span>
            <span class="qskill" style="margin:0;">${escapeHtml(q.shortId)} &middot; ${escapeHtml(q.skill)}</span>
          </div>
          <div class="stem">${i + 1}. ${escapeStemFlat(q.stem)}</div>
          ${questionImageHtml(q)}
          <div style="font-size:13px;">
            Your answer: <strong>${yours || '—'}</strong>${!isCorrect ? ` &nbsp;&middot;&nbsp; Correct: <strong>${q.correct_answer}</strong>` : ''}
          </div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-top:6px;">${escapeHtml(q.rationale_by_choice[q.correct_answer] || '')}</div>
          ${statusButtonsHtml(q)}
        </div>`;
    }).join('');

    // A composite /1600 estimate only makes sense for a full adaptive attempt
    // (its curve is calibrated against all 54 questions); Module-1-only and
    // Module-2-only attempts show just the raw score for this module instead.
    const mode = data.mode || 'adaptive';
    const showComposite = mode === 'adaptive' && data.module1Questions.length > 0 && data.module2Questions.length > 0;
    const rwScore = showComposite ? computeMockRWScore(data) : null;

    let routingNoteHtml;
    if (showComposite) {
      routingNoteHtml = `
        <div class="mock-routing-note">
          Module 1: ${data.module1Correct}/${data.module1Questions.length} (${Math.round(data.module1Pct * 100)}%) &rarr;
          routed to the <strong>${data.routedHarder ? 'harder' : 'easier'}</strong> pool for Module 2, which scored ${m2Score.correct}/${m2Score.total} (${Math.round(m2Score.pct * 100)}%).
        </div>`;
    } else if (mode === 'module1') {
      routingNoteHtml = `<div class="mock-routing-note">Module 1 only — no Module 2 in this attempt, so no adaptive routing and no composite R&amp;W estimate (that curve is calibrated against the full 54-question exam).</div>`;
    } else {
      routingNoteHtml = `<div class="mock-routing-note">Module 2 only — drawn straight from the <strong>${data.routedHarder ? 'harder' : 'easier'}</strong> pool (no Module 1 in this attempt, so no composite R&amp;W estimate).</div>`;
    }

    return `
      <div class="results-summary">
        ${showComposite ? scoreCardHtml(rwScore) : ''}
        <div class="score">${correct}/${total}</div>
        <div class="score-sub">${pct}% correct${showComposite ? ' overall' : ' in this attempt'}</div>
        ${routingNoteHtml}
        <div style="max-width:340px; margin:18px auto 0; text-align:left;">
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin-bottom:4px;">By domain</div>
          ${domainRows}
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin:14px 0 4px;">By skill</div>
          ${skillRows}
        </div>
        <button class="btn" id="newMockBtn" style="margin-top:18px;">${isHistory ? 'Back to mock exams' : 'New mock exam'}</button>
      </div>
      <h3 style="font-family:var(--serif); font-size:16px; margin:0 0 4px;">Module breakdown</h3>
      <p style="font-size:11.5px; color:var(--ink-faint); margin:0 0 4px;">Hover a square for that question's id, skill and difficulty. Click one to jump to it in Review below.</p>
      <div class="mock-tile-legend">
        <span><span class="swatch status-correct"></span>Correct</span>
        <span><span class="swatch status-incorrect"></span>Incorrect</span>
        <span><span class="swatch status-unanswered"></span>Unanswered</span>
      </div>
      ${mockModuleTilesHtml(data.module1Questions, 'Module 1', data)}
      ${mockModuleTilesHtml(data.module2Questions, 'Module 2', data)}
      <h3 style="font-family:var(--serif); font-size:16px; margin:18px 0 10px;">Review</h3>
      ${reviewHtml}`;
  }

  function renderMock() {
    const shell = document.getElementById('mockShell');
    if (mockState.phase === 'intro') shell.innerHTML = mockConfigHtml();
    else if (mockState.phase === 'module1') shell.innerHTML = mockQuizHtml(mockState.module1Questions, 1);
    else if (mockState.phase === 'break') shell.innerHTML = mockBreakHtml();
    else if (mockState.phase === 'module2') shell.innerHTML = mockQuizHtml(mockState.module2Questions, 2);
    else if (mockState.phase === 'historyResults') {
      const attempt = mockState.history.find(a => a.id === mockState.viewingAttemptId);
      if (!attempt) { mockState.phase = 'intro'; mockState.viewingAttemptId = null; renderMock(); return; }
      shell.innerHTML = mockResultsHtml(resolveMockAttempt(attempt), true);
    }
    else shell.innerHTML = mockResultsHtml(mockState, false);
    wireMock();
  }

  function wireMock() {
    const shell = document.getElementById('mockShell');
    if (mockState.phase === 'intro') {
      const startBtn = document.getElementById('startMockBtn');
      if (startBtn) startBtn.addEventListener('click', startMockAttempt);

      shell.querySelectorAll('[data-mock-mode]').forEach(el => {
        el.addEventListener('click', () => { mockState.mode = el.dataset.mockMode; renderMock(); });
      });
      shell.querySelectorAll('[data-mock-pool]').forEach(el => {
        el.addEventListener('click', () => { mockState.module2Pool = el.dataset.mockPool; renderMock(); });
      });
      wireScopeChips(shell, mockState, renderMock);
      wireTimedModeConfig(shell, mockState.qtimer, 'mockQ', renderMock);

      // Blueprint table: counts are written straight into mockState.blueprint
      // on change (no re-render, so typing isn't interrupted); the live
      // totals in the table foot update via a lighter 'input' listener.
      shell.querySelectorAll('[data-bp-idx]').forEach(inp => {
        inp.addEventListener('change', () => {
          const idx = parseInt(inp.dataset.bpIdx, 10);
          mockState.blueprint[idx][inp.dataset.bpField] = Math.max(0, parseInt(inp.value, 10) || 0);
        });
        inp.addEventListener('input', () => {
          const field = inp.dataset.bpField;
          const totalEl = document.getElementById(field === 'm1' ? 'mockM1Total' : 'mockM2Total');
          if (!totalEl) return;
          let sum = 0;
          shell.querySelectorAll(`[data-bp-field="${field}"]`).forEach(x => { sum += parseInt(x.value, 10) || 0; });
          totalEl.textContent = sum;
        });
      });
      const resetBpBtn = document.getElementById('mockResetBlueprintBtn');
      if (resetBpBtn) resetBpBtn.addEventListener('click', () => { mockState.blueprint = cloneDefaultBlueprint(); renderMock(); });
      const scaleM1Btn = document.getElementById('mockScaleM1Btn');
      if (scaleM1Btn) scaleM1Btn.addEventListener('click', () => {
        const target = Math.max(0, parseInt(document.getElementById('mockScaleM1').value, 10) || 0);
        scaleBlueprintField('m1', target);
        renderMock();
      });
      const scaleM2Btn = document.getElementById('mockScaleM2Btn');
      if (scaleM2Btn) scaleM2Btn.addEventListener('click', () => {
        const target = Math.max(0, parseInt(document.getElementById('mockScaleM2').value, 10) || 0);
        scaleBlueprintField('m2', target);
        renderMock();
      });

      // Weight pickers (Module 1 / harder pool / easier pool, whichever are shown).
      shell.querySelectorAll('[data-weight-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          mockState.weightConfig[btn.dataset.weightKey].preset = btn.dataset.weightPreset;
          renderMock();
        });
      });
      shell.querySelectorAll('[data-weight-diff]').forEach(inp => {
        inp.addEventListener('change', () => {
          mockState.weightConfig[inp.dataset.weightKey].custom[inp.dataset.weightDiff] = Math.max(0, parseInt(inp.value, 10) || 0);
        });
      });
      const thresholdInput = document.getElementById('mockPassThreshold');
      if (thresholdInput) thresholdInput.addEventListener('change', () => {
        const pct = Math.max(0, Math.min(100, parseInt(thresholdInput.value, 10) || 0));
        mockState.passThreshold = pct / 100;
      });

      shell.querySelectorAll('[data-view-attempt]').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-delete-attempt]')) return;
          viewMockAttempt(el.dataset.viewAttempt);
        });
      });
      shell.querySelectorAll('[data-delete-attempt]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!confirm('Delete this saved mock exam record? This only removes the saved mock result — your per-question progress and tags aren\'t touched.')) return;
          mockState.history = mockState.history.filter(a => a.id !== el.dataset.deleteAttempt);
          saveMockHistory();
          renderMock();
          renderStats();
        });
      });
      const clearHistoryBtn = document.getElementById('clearMockHistoryBtn');
      if (clearHistoryBtn) clearHistoryBtn.addEventListener('click', () => {
        if (!confirm('Clear all saved mock exam history? This only removes saved mock results — your per-question progress and tags aren\'t touched.')) return;
        mockState.history = [];
        saveMockHistory();
        renderMock();
        renderStats();
      });
    } else if (mockState.phase === 'module1' || mockState.phase === 'module2') {
      const questions = mockState.phase === 'module1' ? mockState.module1Questions : mockState.module2Questions;
      const q = questions[mockState.index];
      shell.querySelectorAll('.choice[data-letter]').forEach(el => {
        el.addEventListener('click', () => {
          mockState.answers[q.id] = el.dataset.letter;
          renderMock();
        });
      });
      const prevBtn = document.getElementById('mockPrevBtn');
      if (prevBtn) prevBtn.addEventListener('click', () => { mockState.index--; qtimerStart(mockState.qtimer, 'mockQTimer', mockQuestionTimerExpire); renderMock(); });
      const nextBtn = document.getElementById('mockNextBtn');
      if (nextBtn) nextBtn.addEventListener('click', () => { mockState.index++; qtimerStart(mockState.qtimer, 'mockQTimer', mockQuestionTimerExpire); renderMock(); });
      const submitBtn = document.getElementById('mockSubmitBtn');
      if (submitBtn) submitBtn.addEventListener('click', () => {
        qtimerClear(mockState.qtimer);
        if (mockState.phase === 'module1') submitMockModule1(); else submitMockModule2();
      });
      const exitBtn = document.getElementById('mockExitBtn');
      if (exitBtn) exitBtn.addEventListener('click', exitMockExam);
    } else if (mockState.phase === 'break') {
      const btn = document.getElementById('startModule2Btn');
      if (btn) btn.addEventListener('click', startMockModule2);
    } else {
      // results or historyResults — same wiring, just a different data source
      const isHistory = mockState.phase === 'historyResults';
      const data = isHistory
        ? resolveMockAttempt(mockState.history.find(a => a.id === mockState.viewingAttemptId) || { module1Ids: [], module2Ids: [], answers: {} })
        : mockState;
      const newBtn = document.getElementById('newMockBtn');
      if (newBtn) newBtn.addEventListener('click', () => {
        mockState.phase = 'intro';
        mockState.viewingAttemptId = null;
        renderMock();
      });
      wireStatusButtons(shell, renderMock);
      wireScoreCard(computeMockRWScore(data));
      shell.querySelectorAll('[data-scroll-to]').forEach(el => {
        el.addEventListener('click', () => {
          const target = document.getElementById(el.dataset.scrollTo);
          if (!target) return;
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.remove('flash-highlight');
          void target.offsetWidth; // restart the animation if clicked again quickly
          target.classList.add('flash-highlight');
          setTimeout(() => target.classList.remove('flash-highlight'), 900);
        });
      });
      // Click a Review card to open it in the same modal Browse uses —
      // Prev/Next pages through this exam's questions in Module 1 -> Module 2
      // order, same pattern as Browse paging through its filtered list.
      const reviewModalList = [...data.module1Questions, ...data.module2Questions];
      shell.querySelectorAll('.review-item[data-id]').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-status-qid]')) return; // let mark-complete/review/incomplete through untouched
          const idx = reviewModalList.findIndex(q => q.id === el.dataset.id);
          if (idx !== -1) openQuestionModal(reviewModalList, idx);
        });
      });
    }
  }

  // ---------- Gamification: XP, levels, streaks, daily goal, achievements ----------
  // Everything here is derived on the fly from state.completionLog (+ existing
  // progress/mock history) rather than stored separately, so there's nothing
  // new to keep in sync — it just reflects whatever's already persisted.
  const QUESTION_XP = { Easy: 10, Medium: 15, Hard: 25 };
  const MOCK_EXAM_XP = 50;

  function dateKey(d) {
    const yy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yy}-${mm}-${dd}`;
  }

  // qid -> ISO timestamp, grouped into a local-date -> count map.
  function dailyCompletionCounts() {
    const counts = {};
    Object.values(state.completionLog).forEach(ts => {
      const d = new Date(ts);
      if (isNaN(d)) return;
      const key = dateKey(d);
      counts[key] = (counts[key] || 0) + 1;
    });
    return counts;
  }

  // Current streak counts consecutive days with >=1 completion, walking back
  // from today — but if today has nothing logged yet, it starts from
  // yesterday instead, so the streak isn't considered "broken" until the day
  // actually passes with nothing done. Longest streak scans full history.
  function computeStreaks(counts) {
    const has = key => !!counts[key];
    const cursor = new Date();
    if (!has(dateKey(cursor))) cursor.setDate(cursor.getDate() - 1);
    let current = 0;
    while (has(dateKey(cursor))) {
      current++;
      cursor.setDate(cursor.getDate() - 1);
    }
    const days = Object.keys(counts).sort();
    let longest = 0, run = 0, prev = null;
    days.forEach(key => {
      if (prev) {
        const diff = Math.round((new Date(key) - new Date(prev)) / 86400000);
        run = diff === 1 ? run + 1 : 1;
      } else {
        run = 1;
      }
      longest = Math.max(longest, run);
      prev = key;
    });
    return { current, longest: Math.max(longest, current) };
  }

  function totalXp() {
    let xp = 0;
    Object.keys(state.completionLog).forEach(qid => {
      const q = QUESTIONS.find(x => x.id === qid);
      if (q) xp += QUESTION_XP[q.difficulty_label] || 10;
    });
    return xp + mockState.history.length * MOCK_EXAM_XP;
  }

  const LEVEL_TITLES = [
    [1, 'Newcomer'], [3, 'Apprentice'], [6, 'Scholar'], [10, 'Strategist'],
    [15, 'Sharpshooter'], [20, 'Virtuoso'], [30, 'Master'], [40, 'Grandmaster'],
  ];
  function titleForLevel(level) {
    let title = LEVEL_TITLES[0][1];
    LEVEL_TITLES.forEach(([min, t]) => { if (level >= min) title = t; });
    return title;
  }

  // Each level needs 25% more XP than the last (starting at 100), so early
  // levels come quickly and later ones take sustained practice.
  function levelFromXp(xp) {
    let level = 1, remaining = xp, need = 100;
    while (remaining >= need) {
      remaining -= need;
      level++;
      need = Math.round(need * 1.25);
    }
    return { level, xpIntoLevel: remaining, xpForNextLevel: need, title: titleForLevel(level) };
  }

  const ACH_ICONS = {
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9"/>',
    flame: '<path d="M12 3c1.2 3-2.4 4.3-2.4 7.4a2.4 2.4 0 0 0 4.8 0c0-.8-.5-1.5-.9-2.3 1.8.9 3 2.9 3 5A4.5 4.5 0 0 1 12 17.6 4.5 4.5 0 0 1 7.5 13c0-4.2 3-5.6 4.5-10z"/>',
    grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/>',

    document: '<rect x="5.5" y="3" width="13" height="18" rx="1.5"/><line x1="8.5" y1="8" x2="15.5" y2="8"/><line x1="8.5" y1="12" x2="15.5" y2="12"/><line x1="8.5" y1="16" x2="12.5" y2="16"/>',

  };

  function achIcon(key, filled) {
    const inner = ACH_ICONS[key] || ACH_ICONS.check;
    return `<svg width="20" height="20" viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  }

  // Each achievement's progress() returns [current, target] against a stats
  // snapshot (see computeGamificationStats) — unlocked when current >= target.
  // Streak achievements key off longestStreak (not currentStreak) so a
  // lapsed streak doesn't take an already-earned badge away.
  const ACHIEVEMENTS = [
    { id: 'first-steps', icon: 'check', tier: 'bronze', title: 'First Steps', desc: 'Complete your first question.',
      progress: s => [Math.min(s.totalDone, 1), 1] },
    { id: 'getting-started', icon: 'check', tier: 'bronze', title: 'Getting Started', desc: 'Complete 25 questions.',
      progress: s => [Math.min(s.totalDone, 25), 25] },
    { id: 'century', icon: 'check', tier: 'silver', title: 'Century', desc: 'Complete 100 questions.',
      progress: s => [Math.min(s.totalDone, 100), 100] },
    { id: 'half-bank', icon: 'check', tier: 'silver', title: 'Halfway There', desc: 'Complete half the question bank.',
      progress: s => [Math.min(s.totalDone, Math.ceil(s.totalQuestions / 2)), Math.max(1, Math.ceil(s.totalQuestions / 2))] },
    { id: 'completionist', icon: 'star', tier: 'gold', title: 'Completionist', desc: 'Complete every question in the bank.',
      progress: s => [s.totalDone, s.totalQuestions] },
    { id: 'category-master', icon: 'grid', tier: 'silver', title: 'Category Master', desc: 'Fully complete every question in one category.',
      progress: s => [s.bestCategoryDone, s.bestCategoryTotal] },
    { id: 'hard-mode', icon: 'mountain', tier: 'silver', title: 'Hard Mode', desc: 'Complete 20 Hard-difficulty questions.',
      progress: s => [Math.min(s.hardDone, 20), 20] },
    { id: 'on-a-roll', icon: 'flame', tier: 'bronze', title: 'On a Roll', desc: 'Reach a 3-day streak.',
      progress: s => [Math.min(s.longestStreak, 3), 3] },
    { id: 'consistent', icon: 'flame', tier: 'silver', title: 'Consistent', desc: 'Reach a 7-day streak.',
      progress: s => [Math.min(s.longestStreak, 7), 7] },
    { id: 'unstoppable', icon: 'flame', tier: 'gold', title: 'Unstoppable', desc: 'Reach a 30-day streak.',
      progress: s => [Math.min(s.longestStreak, 30), 30] },
    { id: 'goal-met', icon: 'target', tier: 'bronze', title: 'Goal Met', desc: 'Hit your daily goal at least once.',
      progress: s => [Math.min(s.goalDaysHit, 1), 1] },
    { id: 'goal-getter', icon: 'target', tier: 'silver', title: 'Goal Getter', desc: 'Hit your daily goal on 7 different days.',
      progress: s => [Math.min(s.goalDaysHit, 7), 7] },

      progress: s => [Math.min(s.mockCount, 1), 1] },
    { id: 'marathon', icon: 'document', tier: 'silver', title: 'Marathon', desc: 'Complete 5 mock exams.',
      progress: s => [Math.min(s.mockCount, 5), 5] },
    { id: 'sharp-shooter', icon: 'star', tier: 'gold', title: 'Sharp Shooter', desc: 'Score 650+ (R&W) on a mock exam.',
      progress: s => [s.bestRWScore ? Math.min(s.bestRWScore, 650) : 0, 650] },
    { id: 'clean-slate', icon: 'check', tier: 'bronze', title: 'Clean Slate', desc: "Clear your review queue to zero once you've flagged some.",
      progress: s => [s.totalDone > 0 && s.totalReview === 0 ? 1 : 0, 1] },
  ];

  function computeGamificationStats() {
    const counts = dailyCompletionCounts();
    const streaks = computeStreaks(counts);
    const totalDone = Object.values(state.progress).filter(s => s === 'done').length;
    const totalReview = Object.values(state.progress).filter(s => s === 'review').length;
    const hardDone = QUESTIONS.filter(q => q.difficulty_label === 'Hard' && questionStatus(q) === 'done').length;

    let bestRatio = -1, bestCategoryDone = 0, bestCategoryTotal = 1;
    allCategories.forEach(cat => {
      const qs = QUESTIONS.filter(q => q.category === cat);
      if (!qs.length) return;
      const d = qs.filter(q => questionStatus(q) === 'done').length;
      const ratio = d / qs.length;
      if (ratio > bestRatio) { bestRatio = ratio; bestCategoryDone = d; bestCategoryTotal = qs.length; }
    });

    const goal = state.dailyGoal;
    const goalDaysHit = Object.values(counts).filter(c => c >= goal).length;
    const xp = totalXp();
    const lvl = levelFromXp(xp);

    return {
      totalDone, totalReview, totalQuestions: QUESTIONS.length, hardDone,
      bestCategoryDone, bestCategoryTotal,
      currentStreak: streaks.current, longestStreak: streaks.longest,
      todayCount: counts[dateKey(new Date())] || 0, goal, goalDaysHit,
      mockCount: mockState.history.length, bestRWScore: bestMockRWScore(),
      xp, level: lvl.level, xpIntoLevel: lvl.xpIntoLevel, xpForNextLevel: lvl.xpForNextLevel, levelTitle: lvl.title,
    };
  }

  function achievementCardHtml(a, stats) {
    const [cur, target] = a.progress(stats);
    const unlocked = target > 0 && cur >= target;
    const pct = target > 0 ? Math.min(100, Math.round((cur / target) * 100)) : 0;
    return `
      <div class="ach-card tier-${a.tier} ${unlocked ? 'unlocked' : 'locked'}" title="${escapeHtml(a.desc)}">
        <div class="ach-icon">${achIcon(a.icon, unlocked)}</div>
        <div class="ach-body">
          <div class="ach-title">${escapeHtml(a.title)}</div>
          <div class="ach-desc">${escapeHtml(a.desc)}</div>
          ${unlocked
            ? `<div class="ach-unlocked-tag">Unlocked</div>`
            : `<div class="ach-bar"><div class="ach-bar-fill" style="width:${pct}%"></div></div><div class="ach-frac">${Math.min(cur, target)}/${target}</div>`}
        </div>
      </div>`;
  }

  function profileCardHtml(stats) {
    const name = state.profile.name || DEFAULT_PROFILE_NAME;

        <div class="profile-row">
          <div class="avatar">${escapeHtml(initial)}</div>

  function streakGoalCardHtml(stats) {

  function achievementsCardHtml(stats) {
    const unlockedCount = ACHIEVEMENTS.filter(a => { const [c, t] = a.progress(stats); return t > 0 && c >= t; }).length;
    return `
      <div class="progress-summary">
        <h2>Achievements <span class="ach-count">${unlockedCount}/${ACHIEVEMENTS.length}</span></h2>

  // ---------- Progress tab ----------
  function diffBreakdownHtml(qs) {
    return allDifficulties.filter(d => qs.some(q => q.difficulty_label === d)).map(d => {
      const inDiff = qs.filter(q => q.difficulty_label === d);

      const tiles = inDiff.map(q =>
        `<button class="qtile status-${questionStatus(q)}" data-open-qid="${q.id}" title="${escapeHtml(q.shortId)} — ${STATUS_LABELS[questionStatus(q)]}"></button>`
