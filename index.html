          <span>${doneCount}/${inDiff.length} complete</span>
        </div>
        <div class="qtile-grid">${tiles}</div>`;
    }).join('');
  }

  function renderProgress() {
    const shell = document.getElementById('progressShell');
    const focusQuestions = QUESTIONS.filter(q => state.progressFocus.has(q.difficulty_label));
    const total = focusQuestions.length;
    let done = 0, review = 0;
    focusQuestions.forEach(q => {
      const s = questionStatus(q);
      if (s === 'done') done++;
      else if (s === 'review') review++;
    });
    const incomplete = total - done - review;
    const pct = n => total ? Math.round((n / total) * 100) : 0;

    const byCategory = allCategories.map(cat => {
      const qs = focusQuestions.filter(q => q.category === cat);
      const d = qs.filter(q => questionStatus(q) === 'done').length;
      const r = qs.filter(q => questionStatus(q) === 'review').length;
      return { cat, qs, total: qs.length, done: d, review: r };
    });

    const catRows = byCategory.map(c => {
      const isOpen = state.progressExpandedCategory === c.cat;
      return `
      <div class="cat-progress-card">
        <div class="cat-progress-row" data-toggle-cat="${escapeHtml(c.cat)}">
          <span class="name"><span class="chevron ${isOpen ? 'open' : ''}">&#9656;</span>${escapeHtml(c.cat)}</span>
          <span class="frac">${c.total ? `${c.done}/${c.total} complete${c.review ? ` &middot; ${c.review} to review` : ''}` : 'No questions in focus'}</span>
        </div>
        <div class="segbar">
          <div class="seg-done" style="width:${c.total ? (c.done / c.total) * 100 : 0}%"></div>
          <div class="seg-review" style="width:${c.total ? (c.review / c.total) * 100 : 0}%"></div>
        </div>
        ${isOpen ? `<div class="cat-detail">${c.qs.length ? diffBreakdownHtml(c.qs) : '<div class="review-queue-empty">No questions at this difficulty in this category.</div>'}</div>` : ''}
      </div>`;
    }).join('');

    let openQ = null;
    if (state.progressOpenQuestion) {
      openQ = QUESTIONS.find(x => x.id === state.progressOpenQuestion) || null;
      if (!openQ) state.progressOpenQuestion = null;
    }

    const gamificationStats = computeGamificationStats();

    shell.innerHTML = `
      ${profileCardHtml(gamificationStats)}
      ${streakGoalCardHtml(gamificationStats)}
      ${achievementsCardHtml(gamificationStats)}

      <div class="progress-summary">
        <h2>Your progress</h2>
        <div class="progress-focus-row">
          <span class="progress-focus-label">Focus</span>
          <div class="chip-row" id="progressFocusChips">
            ${PROGRESS_FOCUS_DIFFICULTIES.map(d => `<button class="chip ${state.progressFocus.has(d) ? 'on' : ''}" data-focus-diff="${escapeHtml(d)}">${escapeHtml(d)}</button>`).join('')}
          </div>
          <span class="progress-focus-hint">Stats below count only the selected difficulties — your personal domain, used later for adaptive practice.</span>
        </div>
        <div class="progress-stats">
          <div class="progress-stat done"><span class="n">${done}</span><span class="l">Complete (${pct(done)}%)</span></div>
          <div class="progress-stat review"><span class="n">${review}</span><span class="l">To review</span></div>
          <div class="progress-stat"><span class="n">${incomplete}</span><span class="l">Incomplete</span></div>
          <div class="progress-stat"><span class="n">${total}</span><span class="l">Total questions</span></div>
        </div>
        <div class="segbar">
          <div class="seg-done" style="width:${pct(done)}%"></div>
          <div class="seg-review" style="width:${pct(review)}%"></div>
        </div>
        <div class="progress-actions">
          <button class="btn" id="exportProgressBtn">Export progress (.json)</button>
          <button class="btn" id="importProgressBtn">Import progress</button>
          <input type="file" id="importProgressFile" accept="application/json" style="display:none;" />
          <button class="btn" id="resetProgressBtn">Reset all progress</button>
        </div>
        <div class="progress-note">
          Saved automatically in this browser. That storage isn't guaranteed to survive forever (clearing browser data, a different device, or a fresh copy of this page will lose it) — export a backup periodically and import it to restore or move your progress.
        </div>
      </div>

      ${openQ ? inlineQuestionPanelHtml(openQ, 'progressPanel', 'progressPanelClose') : ''}

      <h3 style="font-family: var(--serif); font-size: 16px; margin: 0 0 10px;">By category</h3>
      ${catRows}`;

    const nameInput = document.getElementById('profileNameInput');
    if (nameInput) {
      nameInput.addEventListener('change', () => {
        const val = nameInput.value.trim().slice(0, 24);
        state.profile = { name: val || DEFAULT_PROFILE_NAME };
        saveProfile();
        renderProgress();
      });
    }
    shell.querySelectorAll('[data-goal]').forEach(el => {
      el.addEventListener('click', () => {
        state.dailyGoal = parseInt(el.dataset.goal, 10);
        saveDailyGoal(state.dailyGoal);
        renderProgress();
      });
    });
    shell.querySelectorAll('[data-focus-diff]').forEach(el => {
      el.addEventListener('click', () => toggleProgressFocus(el.dataset.focusDiff));
    });
    shell.querySelectorAll('[data-toggle-cat]').forEach(el => {
      el.addEventListener('click', () => {
        const cat = el.dataset.toggleCat;
        state.progressExpandedCategory = state.progressExpandedCategory === cat ? null : cat;
        renderProgress();
      });
    });
    shell.querySelectorAll('[data-open-qid]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        state.progressOpenQuestion = el.dataset.openQid;
        renderProgress();
      });
    });

    if (openQ) {
      const panel = document.getElementById('progressPanel');
      const closeBtn = document.getElementById('progressPanelClose');
      if (closeBtn) closeBtn.addEventListener('click', () => { state.progressOpenQuestion = null; renderProgress(); });
      wireDetail(openQ, renderProgress, panel);
      requestAnimationFrame(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }

    wireProgress();
  }

  async function downloadFile(filename, text) {
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const downloads = await window.claude.use('downloads');
        if (downloads) {
          await downloads.save({ filename, data: text });
          return true;
        }
      } catch (e) {
        // fall through to blob-link fallback (also covers "declined")
      }
    }
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  }

  function wireProgress() {
    const exportBtn = document.getElementById('exportProgressBtn');
    if (exportBtn) exportBtn.addEventListener('click', () => {
      const payload = {
        app: 'sat-qbank-progress',
        version: 5,
        exportedAt: new Date().toISOString(),
        progress: state.progress,
        tags: state.tags,
        notes: state.notes,
        mathScore: loadMathScore(),
        completionLog: state.completionLog,
        dailyGoal: state.dailyGoal,
        profile: state.profile,
      };
      const date = new Date().toISOString().slice(0, 10);
      downloadFile(`sat-progress-${date}.json`, JSON.stringify(payload, null, 2));
    });

    const importBtn = document.getElementById('importProgressBtn');
    const importFile = document.getElementById('importProgressFile');
    if (importBtn && importFile) {
      importBtn.addEventListener('click', () => importFile.click());
      importFile.addEventListener('change', () => {
        const file = importFile.files && importFile.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            const incomingProgress = parsed && typeof parsed === 'object' ? parsed.progress : null;
            const incomingTags = parsed && typeof parsed === 'object' ? parsed.tags : null;
            const incomingNotes = parsed && typeof parsed === 'object' ? parsed.notes : null;
            const incomingMathScore = parsed && typeof parsed === 'object' ? parsed.mathScore : null;
            const incomingCompletionLog = parsed && typeof parsed === 'object' ? parsed.completionLog : null;
            const incomingDailyGoal = parsed && typeof parsed === 'object' ? parsed.dailyGoal : null;
            const incomingProfile = parsed && typeof parsed === 'object' ? parsed.profile : null;
            if (!incomingProgress && !incomingTags && !incomingNotes && !Number.isFinite(incomingMathScore) && !incomingCompletionLog) {
              alert('This file doesn\'t look like a progress export.');
              return;
            }
            if (incomingProgress && typeof incomingProgress === 'object') {
              state.progress = Object.assign({}, state.progress, incomingProgress);
              saveProgress();
            }
            if (incomingTags && typeof incomingTags === 'object') {
              state.tags = Object.assign({}, state.tags, incomingTags);
              saveTags();
            }
            if (incomingNotes && typeof incomingNotes === 'object') {
              state.notes = Object.assign({}, state.notes, incomingNotes);
              saveNotes();
            }
            if (Number.isFinite(incomingMathScore) && incomingMathScore >= 200 && incomingMathScore <= 800) {
              saveMathScore(incomingMathScore);
            }
            if (incomingCompletionLog && typeof incomingCompletionLog === 'object') {
              state.completionLog = Object.assign({}, state.completionLog, incomingCompletionLog);
              saveCompletionLog();
            }
            if (Number.isFinite(incomingDailyGoal) && incomingDailyGoal > 0) {
              state.dailyGoal = incomingDailyGoal;
              saveDailyGoal(state.dailyGoal);
            }
            if (incomingProfile && typeof incomingProfile === 'object' && typeof incomingProfile.name === 'string' && incomingProfile.name.trim()) {
              state.profile = { name: incomingProfile.name.trim().slice(0, 24) };
              saveProfile();
            }
            renderFilters();
            renderBrowse();
            renderProgress();
            renderReview();
            renderNotesView();
            renderStats();
          } catch (e) {
            alert('Could not read that file as progress JSON.');
          }
        };
        reader.readAsText(file);
        importFile.value = '';
      });
    }

    const resetBtn = document.getElementById('resetProgressBtn');
    if (resetBtn) resetBtn.addEventListener('click', () => {
      if (!confirm('Clear all "complete" and "to review" marks, plus your streak, XP, and achievement progress? This can\'t be undone unless you\'ve exported a backup.')) return;
      state.progress = {};
      state.completionLog = {};
      saveProgress();
      saveCompletionLog();
      renderFilters();
      renderBrowse();
      renderProgress();
      renderReview();
      renderStats();
    });
  }

  // ---------- Review tab ----------
  // Dedicated home for everything flagged 🚩 for review — replaces the old
  // inline "flagged" queue on the Progress tab (a tile click there now opens
  // the same kind of inline panel directly, so a separate list was redundant).
  function renderReview() {
    const shell = document.getElementById('reviewShell');
    const flagged = QUESTIONS.filter(q => questionStatus(q) === 'review');
    const byCategory = allCategories
      .map(cat => ({ cat, qs: flagged.filter(q => q.category === cat) }))
      .filter(c => c.qs.length);

    let openQ = null;
    if (state.reviewOpenQuestion) {
      openQ = QUESTIONS.find(x => x.id === state.reviewOpenQuestion) || null;
      if (!openQ) state.reviewOpenQuestion = null;
    }

    const catBlocks = byCategory.map(c => `
      <div class="cat-progress-card" style="cursor:default;">
        <div class="cat-progress-row">
          <span class="name">${escapeHtml(c.cat)}</span>
          <span class="frac">${c.qs.length} flagged</span>
        </div>
        <div class="qtile-grid">${c.qs.map(q =>
          `<button class="qtile status-review" data-open-qid="${q.id}" title="${escapeHtml(q.shortId)}"></button>`
        ).join('')}</div>
      </div>`).join('');

    shell.innerHTML = `
      <div class="progress-summary">
        <h2>Review queue</h2>
        <p style="margin:-6px 0 16px; color:var(--ink-faint); font-size:13px;">
          Everything flagged 🚩 for review, grouped by category. Click a square to work it right here — mark it complete or incomplete and it'll drop out of this queue.
        </p>
        <div class="progress-actions">
          <button class="btn btn-accent" id="reviewPracticeBtn" ${flagged.length ? '' : 'disabled'}>Practice all flagged (${flagged.length})</button>
        </div>
      </div>

      ${openQ ? inlineQuestionPanelHtml(openQ, 'reviewPanel', 'reviewPanelClose') : ''}

      ${byCategory.length ? catBlocks : `<div class="review-queue-empty">Nothing flagged yet — hit "🚩 Mark for review" on any question to add it here.</div>`}
    `;

    shell.querySelectorAll('[data-open-qid]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        state.reviewOpenQuestion = el.dataset.openQid;
        renderReview();
      });
    });

    if (openQ) {
      const panel = document.getElementById('reviewPanel');
      const closeBtn = document.getElementById('reviewPanelClose');
      if (closeBtn) closeBtn.addEventListener('click', () => { state.reviewOpenQuestion = null; renderReview(); });
      wireDetail(openQ, renderReview, panel);
      requestAnimationFrame(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }

    const practiceBtn = document.getElementById('reviewPracticeBtn');
    if (practiceBtn) practiceBtn.addEventListener('click', () => {
      practiceState.statuses = new Set(['review']);
      practiceState.categories = new Set();
      practiceState.skills = new Set();
      practiceState.difficulties = new Set();
      practiceState.shuffle = false;
      practiceState.questions = practicePool();
      practiceState.index = 0;
      practiceState.phase = practiceState.questions.length ? 'session' : 'config';

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab[data-view="practice"]').classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-practice').classList.add('active');
      renderPractice();
    });
  }

  // ---------- Notes tab ----------
  // Every note across every question, compiled in one place — the "see all
  // your notes" surface. Search box + list live as static DOM in the HTML
  // template (only #notesPanelContainer and #notesList get re-rendered) so
  // typing in the search box never loses focus, same pattern as Browse.
  function renderNotesView() {
    const listEl = document.getElementById('notesList');
    const panelEl = document.getElementById('notesPanelContainer');
    if (!listEl || !panelEl) return;

    const query = (state.notesQuery || '').toLowerCase().trim();
    let entries = allNotesFlat();
    if (query) entries = entries.filter(n => n.text.toLowerCase().includes(query));

    let openQ = null;
    if (state.notesOpenQuestion) {
      openQ = QUESTIONS.find(x => x.id === state.notesOpenQuestion) || null;
      if (!openQ) state.notesOpenQuestion = null;
    }

    const itemsHtml = entries.map(n => {
      const q = QUESTIONS.find(x => x.id === n.qid);
      if (!q) return '';
      return `
        <div class="review-item clickable" data-open-note-qid="${q.id}">
          <div class="row1">
            <span class="cat-tag">${escapeHtml(q.category)}</span>
            <span class="qskill" style="margin:0;">${escapeHtml(q.shortId)}</span>
          </div>
          <div class="stem">${escapeStemFlat(q.stem)}</div>
          <div class="note-item" style="margin-top:8px;">
            <span class="note-text">${escapeHtml(n.text)}</span>
            <button class="note-remove" data-remove-note-qid="${q.id}" data-remove-note-ts="${n.ts}" aria-label="Delete note">&times;</button>
          </div>
        </div>`;
    }).join('');

    listEl.innerHTML = entries.length
      ? itemsHtml
      : `<div class="review-queue-empty">${query ? 'No notes match your search.' : "No notes yet — open any question and add one from its detail view."}</div>`;

    panelEl.innerHTML = openQ ? inlineQuestionPanelHtml(openQ, 'notesPanel', 'notesPanelClose') : '';

    listEl.querySelectorAll('[data-open-note-qid]').forEach(el => {
      el.addEventListener('click', () => {
        state.notesOpenQuestion = el.dataset.openNoteQid;
        renderNotesView();
      });
    });

    listEl.querySelectorAll('[data-remove-note-qid]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeNote(btn.dataset.removeNoteQid, Number(btn.dataset.removeNoteTs));
        renderNotesView();
      });
    });

    if (openQ) {
      const panel = document.getElementById('notesPanel');
      const closeBtn = document.getElementById('notesPanelClose');
      if (closeBtn) closeBtn.addEventListener('click', () => { state.notesOpenQuestion = null; renderNotesView(); });
      wireDetail(openQ, renderNotesView, panel);
      requestAnimationFrame(() => panel.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }
  }

  renderStats();
  renderFilters();
  renderBrowse();
  renderPractice();
  renderTest();
  renderMock();
  renderProgress();
  renderReview();
  renderNotesView();
})();
</script>
